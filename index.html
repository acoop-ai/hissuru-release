/* ── 取込追跡（2026-09-08 新設）──
   「取込状況」は直前に走ったバッチの結果しか出さないため、アップロード直後に見ると必ず
   「検出0件」と表示され、利用者は自分の分が取り込まれたのか判断できなかった（実際に誤認が発生）。
   そこで、送ったファイル名を画面側で覚えておき、取込結果の一覧に現れるまで自動で追いかける。
   ・判定は status.json の uke.details[].filename との突き合わせ（確実に本人の分だけを見る）
   ・追跡開始時の checked_at を基準にし、それより新しいバッチの結果だけを採用（前回分の誤検知を防ぐ）
   ・28件が複数バッチに分かれて取り込まれる場合があるため、確認済みを累積して数える */
const UKE_TRACK_POLL=30000, UKE_TRACK_MAX=20*60*1000;   // 30秒毎に確認・20分で打ち切り
let UKE_TRACK=null;
function ukeTrackStop_(){ if(UKE_TRACK){ clearInterval(UKE_TRACK.poll); clearInterval(UKE_TRACK.tick); UKE_TRACK=null; } }
async function startUkeTrack_(names){
  ukeTrackStop_();
  if(!$("dmUkeTrack")||!names.length) return;
  UKE_TRACK={ want:new Set(names), seen:new Set(), notes:{}, t0:Date.now(), since:"", at:"", errors:[], poll:null, tick:null };
  try{
    const st=await loadJson("status.json","status.json");
    UKE_TRACK.since=String(st.checked_at||"");
    const el=$("dmStatus"); if(el) el.innerHTML=dmStatusHtml(st);
  }catch(e){ /* 取れなくても追跡は続ける */ }
  if(!UKE_TRACK) return;
  ukeTrackRender_();
  UKE_TRACK.tick=setInterval(ukeTrackRender_,1000);       // 経過時間の表示だけ毎秒
  UKE_TRACK.poll=setInterval(ukeTrackPoll_,UKE_TRACK_POLL);
}
async function ukeTrackPoll_(){
  if(!UKE_TRACK) return;
  let st; try{ st=await loadJson("status.json","status.json"); }catch(e){ return; }
  if(!UKE_TRACK) return;
  const el=$("dmStatus"); if(el) el.innerHTML=dmStatusHtml(st);   // 上のパネルも一緒に最新化
  const at=String(st.checked_at||"");
  if(!at||at<=UKE_TRACK.since) return;                            // まだ新しいバッチが走っていない
  UKE_TRACK.since=at; UKE_TRACK.at=at;
  (((st.uke||{}).details)||[]).forEach(d=>{
    if(!UKE_TRACK.want.has(d.filename)) return;
    UKE_TRACK.seen.add(d.filename);
    if(d.note) UKE_TRACK.notes[d.filename]=d.note;   // 旧分類の機械変換・新分類優先で使わなかった 等（backend が付ける）
  });
  const errs=((st.uke||{}).errors)||[];
  if(errs.length) UKE_TRACK.errors=errs;
  ukeTrackRender_();
}
function ukeTrackRender_(){
  const box=$("dmUkeTrack"), t=UKE_TRACK; if(!box||!t) return;
  const sec=Math.floor((Date.now()-t.t0)/1000);
  const time=Math.floor(sec/60)+"分"+String(sec%60).padStart(2,"0")+"秒";
  const n=t.seen.size, N=t.want.size, pct=N?Math.round(n/N*100):0;
  const done=n>=N, over=(Date.now()-t.t0)>UKE_TRACK_MAX;
  let h=`<div class="upbox" style="margin-top:8px">`;
  if(done){
    h+=`<div class="uphead"><span>✅</span><span><b>${N} 件すべて取込完了</b>${t.at?`（${esc(t.at)}）`:""}</span></div>`+
       `<div class="upbar"><i style="width:100%"></i></div>`+
       `<div class="upnote">表示データも再生成されました。画面を再読み込みすると最新の数値が表示されます。</div>`;
  }else if(over){
    h+=`<div class="uphead"><span>⏱</span><span><b>${time}待っても ${N-n} 件が取込結果に現れませんでした</b></span></div>`+
       `<div class="upbar"><i style="width:${pct}%"></i></div>`+
       `<div class="upnote">お手数ですが本部（システム担当）へご連絡ください。アップロード自体は完了しています。</div>`;
  }else{
    h+=`<div class="uphead"><span class="spin dark"></span><span><b>自動処理を待っています</b>（経過 ${time}／取込は最大5分間隔）</span></div>`+
       `<div class="upbar"><i style="width:${pct}%"></i></div>`+
       `<div class="uplist"><div class="uprow ${n?"done":"wait"}"><span class="st">${n?"✅":"…"}</span><span>取込確認 <b>${n} / ${N}</b> 件</span></div></div>`+
       `<div class="upnote">アップロードは完了しています。この画面のままお待ちください（自動で更新されます）。</div>`;
  }
  const nk=Object.keys(t.notes);
  if(nk.length) h+=`<div class="upnote" style="color:#92400e">${nk.map(k=>`・${esc(k)}：${esc(t.notes[k])}`).join("<br>")}</div>`;
  if(t.errors.length) h+=`<div class="err">取込エラー: ${t.errors.map(x=>esc(String(x))).join(" / ")}</div>`;
  box.innerHTML=h+`</div>`;
  if(done||over) setTimeout(ukeTrackStop_,0);            // 描画してから止める
}
function dmStatusHtml(st){
  const uke=st.uke||{}, bud=st.budget||{};
  let h=`<div style="font-size:13px;line-height:1.8">確認時刻: <b>${esc(st.checked_at||"\u2014")}</b><br>`+
    `受払CSV: 検出 ${uke.files_found||0} 件 ／ 取込 ${uke.imported||0} 件 ／ 重複・スキップ ${uke.duplicates_or_skipped||0} 件<br>`+
    `予算: 検出 ${bud.files_found||0} 件${(bud.saved&&bud.saved.length)?`（保存: ${bud.saved.map(x=>esc(String(x))).join(", ")}）`:""}<br>`+
    `表示データ再生成: ${st.outbox_regenerated&&st.outbox_regenerated.ran?"実施":"なし（データ変化なし）"}</div>`;
  const errs=[].concat(uke.errors||[],bud.errors||[]);
  if(errs.length) h+=`<div class="err">エラー: ${errs.map(x=>esc(String(x))).join(" / ")}</div>`;
  return h;
}

function busyOverlay_(show, title, sub){

    `<div class="bttl">${esc(title||"処理中です")}</div><div class="bsub">${esc(sub||"画面を閉じずにお待ちください")}</div></div>`;

function upProgress_(host, names, title){
  const rows=names.map((n,i)=>`<div class="uprow wait" id="up_${i}"><span class="st">…</span><span>${esc(n)}</span></div>`).join("");
  host.innerHTML=`<div class="upbox"><div class="uphead"><span class="spin dark"></span><span id="upTtl">${esc(title)}</span></div>`+
    `<div class="upbar"><i id="upBar"></i></div><div class="uplist">${rows}</div>`+
    `<div class="upnote">送信中です。完了までこのタブを閉じないでください。</div></div>`;
  const total=names.length;
  return {
    step(i, state, extra){
      const el=$("up_"+i); if(el){
        el.className="uprow "+state;
        el.querySelector(".st").textContent = state==="now"?"▶" : state==="done"?"✅" : state==="fail"?"❌" : "…";
        if(extra) el.innerHTML += ` <span style="opacity:.8">${esc(extra)}</span>`;
      }
      const doneCount=names.filter((_,k)=>{const e=$("up_"+k);return e&&(/done|fail/.test(e.className));}).length;
      const bar=$("upBar"); if(bar) bar.style.width=Math.round(doneCount/total*100)+"%";
      const t=$("upTtl"); if(t) t.textContent=`${title}（${doneCount}/${total}）`;
    },
    finish(okCount, failCount){
      const box=host.querySelector(".upbox"); if(!box) return;
      const sp=box.querySelector(".spin"); if(sp) sp.remove();
      const t=$("upTtl"); if(t) t.textContent = failCount? `完了（成功 ${okCount} / 失敗 ${failCount}）` : `完了（${okCount} 件すべて成功）`;
      const note=box.querySelector(".upnote");
      if(note) note.textContent = failCount ? "失敗した行は内容をご確認のうえ再度お試しください。" : "取込は5分毎の自動処理で行われます。";
    }
  };
}

/* ── 旧分類の受払表の確認（PO 2026-09-18）──
   旧分類の受払表（2026年8月以前の過去分など）は、取込時に新分類の名前へ機械的に置き換える（backend newclass_map）。
   送る前に中身の部門名で旧分類かを見分け、「新分類で入れ直すのが望ましい／このままなら参考データ」と確かめる。
   目印は backend の newclass_map.OLD_MARK_DEPTS / NEW_MARK_DEPTS と同じ（取込済み411本で確認: 旧382本・新29本とも例外なし）。 */
const UKE_OLD_DEPTS=new Set(["農産","畜産","一食","その他１","その他２","その他1","その他2"]);
const UKE_NEW_DEPTS=new Set(["青果","精肉","一般食品","その他"]);
async function ukeClassInfo_(f){
  let t="";
  try{
    const buf=await f.arrayBuffer();
    t=new TextDecoder("utf-8").decode(buf);
    if(t.includes("\uFFFD")) t=new TextDecoder("shift_jis").decode(buf);   // UTF-8 で読めない＝Shift_JIS
  }catch(e){ return {basis:"unknown"}; }
  const lines=t.replace(/^\uFEFF/,"").split(/\r?\n/);
  const head=lines[0]||"";
  const ym=((head.match(/\[年月\]\s*=\s*(\d{6})/)||head.match(/\[年月日\]\s*=\s*(\d{6})\d{2}/)||[])[1])||"";
  const store=((head.match(/\[店舗名\]\s*=\s*([^)]+?)\s*\)/)||[])[1])||"";
  // 同じ日付の警告に使う: エリア（グループ１名）・時点（05-4＝[年月日]／05-2＝[年月]＝月末）
  const area=((head.match(/\[グループ[１1]名\]\s*=\s*([^\s)　]+)/)||[])[1])||"";
  const day=((head.match(/\[年月日\]\s*=\s*(\d{8})/)||[])[1])||"";
  const kind=day?"05-4":(ym?"05-2":"");
  let hi=-1;
  for(let i=0;i<Math.min(6,lines.length);i++){
    if(/^"?分類[２2]名"?\s*,/.test(lines[i].trim())){ hi=i; break; }
  }
  if(hi<0) return {basis:"unknown",ym,store,area,day,kind};
  const ds=new Set();
  for(let i=hi+1;i<lines.length;i++){
    const d=(lines[i].split(",")[0]||"").replace(/"/g,"").replace(/[\s\u3000]/g,"");
    if(d) ds.add(d);
  }
  const basis=[...ds].some(d=>UKE_NEW_DEPTS.has(d))?"new":[...ds].some(d=>UKE_OLD_DEPTS.has(d))?"old":"new";
  return {basis,ym,store,area,day,kind};
}
/* 同じ店・同じ時点のデータが、もう画面にあるか（PO 2026-10-14「同じ日付のデータが入った場合は、警告を出して上書きも出来る」）。
   画面にあるデータ期間（snapshots）と、その期間の店（stores）で見る。画面の一覧に無い月は確かめられない（警告しない）。 */
async function ukeExisting_(infos){
  const norm=x=>String(x||"").normalize("NFKC").replace(/[\s\u3000]/g,"");
  const cache={}, out=[];
  for(const x of infos){
    if(!x.area||!x.ym||!x.store||!x.kind) continue;
    if(!(S.meta.areas||[]).includes(x.area)||!(S.meta.year_months||[]).includes(x.ym)) continue;
    const k=x.area+"|"+x.ym;
    if(!cache[k]){ try{ cache[k]=(await API.snapshots(x.area,x.ym)).snapshots||[]; }catch(e){ cache[k]=[]; } }
    const snap=cache[k].find(o=>x.kind==="05-2"?String(o.file_type||"")==="05-2":(String(o.file_type||"")==="05-4"&&s8(o.snapshot)===x.day));
    if(!snap) continue;
    const sk=k+"|"+snap.snapshot;
    if(!cache[sk]){ try{ cache[sk]=((await API.stores(x.area,x.ym,snap.snapshot)).stores)||[]; }catch(e){ cache[sk]=[]; } }
    if(cache[sk].some(st=>norm(st.full)===norm(x.store))) out.push(Object.assign({},x,{label:String(snap.label||"").replace("\uD83D\uDCCA","").replace("\uD83D\uDCCC","").trim()}));
  }
  return out;
}
/* 確認ダイアログ（同じ日付の上書き／旧分類）。取り込む→true／やめる・Esc→false。既定の選択は「やめる」（警告なので安全側） */
function ukeAsk_(olds, dups, total){
  return new Promise(resolve=>{
    const o=document.createElement("div"); o.id="ukeAsk";
    const ymTxt=ym=>ym?`${ym.slice(0,4)}年${Number(ym.slice(4,6))}月`:"年月不明";
    const rowsOld=olds.map(x=>`<div>・${esc(ymTxt(x.ym))}　${esc(x.store||"店舗不明")} <span class="fn">${esc(x.name)}</span></div>`).join("");
    const rowsDup=dups.map(x=>`<div>・${esc(ymTxt(x.ym))} ${esc(x.label||"")}　${esc(x.store)} <span class="fn">${esc(x.name)}</span></div>`).join("");
    const secDup=dups.length?
      `<p><b>同じ店・同じ時点のデータが、すでにあります（${dups.length} / ${total} 件）。</b>取り込むと、今回のデータで上書きされます。</p>`+
      `<div class="alist">${rowsDup}</div>`+
      `<div class="anote">新分類のデータは、旧分類のデータより優先されます（旧分類で上げ直しても、新分類のデータが残ります）。月中（速報）と月末確定は別の時点として扱います。</div>`:"";
    const secOld=olds.length?
      `<p style="margin-top:10px"><b>旧分類の受払表が含まれています（${olds.length} / ${total} 件）。</b>2026年8月以前の過去分は旧分類のデータです。新分類のデータで改めて入れてください。</p>`+
      `<div class="alist">${rowsOld}</div>`+
      `<p>新分類のデータが無い場合も、このまま取り込めます。その場合は、<b>旧分類を新分類へ機械的に置き換えた参考データ</b>になります（温惣菜と冷惣菜など、新分類で分かれたカテゴリは分けられません）。</p>`+
      `<div class="anote">あとから同じ店・同じ月の新分類のデータを入れると、自動でそちらに置き換わります。</div>`:"";
    const title=dups.length&&olds.length?"上書きと旧分類を確かめてください":dups.length?"同じ日付のデータがあります（上書き）":`旧分類の受払表が含まれています（${olds.length} / ${total} 件）`;
    const yes=dups.length?"上書きして取り込む":"参考データとして取り込む";
    o.innerHTML=`<div class="acard" role="alertdialog" aria-modal="true" aria-labelledby="ukeAskT">`+
      `<div class="ahead" id="ukeAskT"><span>⚠️</span>${esc(title)}</div>`+
      `<div class="abody">${secDup}${secOld}<p style="margin-top:8px">よろしいですか？</p></div>`+
      `<div class="afoot"><button class="btn" id="ukeAskNo">やめる</button><button class="btn primary" id="ukeAskYes">${esc(yes)}</button></div></div>`;
    document.body.appendChild(o);
    const done=v=>{ document.removeEventListener("keydown",onKey); o.remove(); resolve(v); };
    const onKey=e=>{ if(e.key==="Escape") done(false); };
    document.addEventListener("keydown",onKey);
    $("ukeAskNo").onclick=()=>done(false);
    $("ukeAskYes").onclick=()=>done(true);
    $("ukeAskNo").focus();
  });
}
let UKEUP=false;  // 二重実行ガード
let UKECHK=false; // 旧分類の確認中（ファイルを読む間・ダイアログを開いている間）の二度押しガード
async function dmUpUke(btn){
  if(UKEUP){ toast("アップロード処理中です。完了までお待ちください",true); return; }
  if(UKECHK) return;
  const fs=[...($("dmUke").files||[])];
  if(!fs.length){ toast("CSVファイルを選択してください",true); return; }
  UKECHK=true;
  let go=true;
  try{
    const infos=await Promise.all(fs.map(f=>ukeClassInfo_(f).then(x=>({...x,name:f.name}))));
    const olds=infos.filter(x=>x.basis==="old");
    const dups=await ukeExisting_(infos);
    if(olds.length||dups.length) go=await ukeAsk_(olds, dups, fs.length);
  } finally { UKECHK=false; }
  if(!go){ toast("アップロードをやめました（ファイルは選んだままです）"); return; }
  UKEUP=true;
  btn=btn||$("dmUkeBtn");
  btnBusy_(btn,true,"送信中…");
  busyOverlay_(true,"受払CSVを送信中です",`0 / ${fs.length} 件`);
  const pg=upProgress_($("dmUkeMsg"), fs.map(f=>f.name), "アップロード中");
  let ok=0, ng=0; const sent=[];              // sent = 送信できたファイル名（取込追跡の対象）
  try{
    for(let i=0;i<fs.length;i++){
      const f=fs[i];
      pg.step(i,"now");
      busyOverlay_(true,"受払CSVを送信中です",`${i+1} / ${fs.length} 件目：${f.name}`);
      try{
        const r=await capi("uploadInbox","uke",f.name,await fileB64(f),"text/csv");
        ok++; sent.push(f.name); pg.step(i,"done",`（${r.by||""}）`);
      }catch(e){ ng++; pg.step(i,"fail",String(e&&e.message||e)); }
    }
  } finally {
    UKEUP=false; btnBusy_(btn,false); busyOverlay_(false);
    pg.finish(ok,ng);
    $("dmUke").value="";
  }
  if(ok){ toast(ok+" 件をアップロードしました（自動取込を待っています）"); startUkeTrack_(sent); }
}
/* \u2500\u2500 予算取込キュー: ファイル選択のたびに積み上げ、名前から年度・エリアを自動判定して
     「{年度}_{エリア}.xlsx」へ正規化。同一ファイル・同一 年度\u00D7エリア は自動排除。
     （ファイル取込UIの標準形＝積み上げ式・自動正規化・重複排除） \u2500\u2500 */
const _XLSX_MIME="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
const _BUD_AREAS=["北東北","北関東","首都圏","宮城","山形","東北"]; // 部分一致の優先順（「北東北」を「東北」より先に判定）
const _budLabel=a=>a==="東北"?"東北（北東北・宮城・山形 一括）":a;
let BQ=[]; // 積み上げキュー {f, key, year, area}
function budParse(name){
  const n=String(name).normalize("NFC");
  let area=""; for(const a of _BUD_AREAS){ if(n.includes(a)){ area=a; break; } }
  const y=n.match(/20\d{2}/);
  return { year: y?y[0]:"", area };
}
function budAdd(){
  const inp=$("dmBud");
  for(const f of inp.files){
    const key=f.name.normalize("NFC")+"|"+f.size;
    if(BQ.some(x=>x.key===key)) continue;
    BQ.push(Object.assign({f,key,name:f.name},budParse(f.name)));
  }
  inp.value=""; budRenderQ();
}
/* ドライブ選択ピッカー（xlsx・スプシのみ表示。選んだら同じ自動判定キューへ積む） */
let DP={stack:[],cur:null};
async function budPickOpen(rootId){
  DP.stack=[{id:rootId,name:rootId==="shared"?"\uD83D\uDC65 共有アイテム":"\uD83D\uDCC2 マイドライブ"}];
  await budPickLoad();
}
async function budPickLoad(){
  const box=$("dmPick"); box.innerHTML=`<div class="lb" style="margin-top:6px">ドライブを読み込み中\u2026</div>`;
  const cur=DP.stack[DP.stack.length-1];
  try{ DP.cur=await capi("driveList",cur.id); budPickRender(); }
  catch(e){ box.innerHTML=`<div class="err">ドライブを開けません: ${esc(String(e&&e.message||e))}</div>`; }
}
function budPickRender(){
  const d=DP.cur;
  const bc=DP.stack.map((s,i)=>i===DP.stack.length-1?`<b>${esc(s.name)}</b>`
    :`<a href="#" onclick="DP.stack=DP.stack.slice(0,${i+1});budPickLoad();return false">${esc(s.name)}</a>`).join(" \u203A ");
  const rows=[
    ...d.folders.map((f,i)=>`<div class="lb" style="margin-top:2px">\uD83D\uDCC1 <a href="#" onclick="budPickInto(${i});return false">${esc(f.name)}</a></div>`),
    ...d.files.map((f,i)=>`<div class="lb" style="margin-top:2px">${f.mime==="application/vnd.google-apps.spreadsheet"?"\uD83D\uDCD7":"\uD83D\uDCC4"} ${esc(f.name)} <button class="btn" onclick="budPickAdd(${i})">リストに追加</button></div>`)
  ].join("")||`<div class="lb">このフォルダに xlsx・スプレッドシートはありません</div>`;
  $("dmPick").innerHTML=`<div class="cmcard" style="margin-top:6px"><div class="lb">${bc} <button class="btn" style="float:right" onclick="$('dmPick').innerHTML=''">閉じる</button></div>${rows}${d.truncated?`<div class="lb">（多数のため先頭300件のみ表示）</div>`:""}</div>`;
}
function budPickInto(i){ const f=DP.cur.folders[i]; DP.stack.push({id:f.id,name:f.name}); budPickLoad(); }
function budPickAdd(i){
  const f=DP.cur.files[i]; const key="drive|"+f.id;
  if(BQ.some(x=>x.key===key)){ toast("すでにリストにあります",true); return; }
  BQ.push(Object.assign({driveId:f.id,key,name:f.name},budParse(f.name)));
  budRenderQ(); toast("リストに追加しました");
}
function budRenderQ(){
  const q=$("dmBudQ"); if(!BQ.length){ q.innerHTML=""; return; }
  const seen={};
  q.innerHTML=BQ.map((x,i)=>{
    const dest=(x.year&&x.area)?`${x.year}_${x.area}.xlsx`:"";
    const dup=!!(dest&&seen[dest]); if(dest&&!dup) seen[dest]=1;
    const yearIn=`<input type="number" value="${esc(x.year)}" style="width:74px" onchange="BQ[${i}].year=this.value;budRenderQ()">`;
    const areaSel=`<select onchange="BQ[${i}].area=this.value;budRenderQ()"><option value=""${x.area?"":" selected"}>エリア?</option>${_BUD_AREAS.map(a=>`<option value="${esc(a)}"${a===x.area?" selected":""}>${esc(_budLabel(a))}</option>`).join("")}</select>`;
    const state=dup?`<b style="color:#b8860b">重複（自動排除）</b>`
      :dest?`\u2192 <b>${esc(dest)}</b>${x.area==="東北"?"（3エリアへ自動分割）":""}`
      :`<b style="color:#c00">年度・エリアを判定できません\u2014\u2014選んでください</b>`;
    return `<div class="cmadd" style="margin-top:4px"><span class="lb">${x.driveId?"\u2601\uFE0F":"\uD83D\uDCC4"} ${esc(x.name)}</span> ${yearIn} ${areaSel} <span class="lb">${state}</span> <button class="btn" onclick="BQ.splice(${i},1);budRenderQ()">\u2715</button></div>`;
  }).join("");
}
let BUP=false; // 二重実行ガード（連打・処理中の再クリックを無効化）
async function dmUpBud(btn){
  if(BUP){ toast("アップロード処理中です。完了までお待ちください",true); return; }
  if(!BQ.length){ toast("ファイルを選択（またはドライブから追加）してください",true); return; }
  if(BQ.some(x=>!(x.year&&x.area))){ toast("年度・エリア未確定（赤）の行を修正してください",true); return; }
  const items=BQ.filter(x=>!x.done);
  btn=btn||$("dmBudBtn");
  BUP=true; btnBusy_(btn,true,"送信中…");
  busyOverlay_(true,"年度予算を送信中です",`0 / ${items.length} 件`);
  const pg=upProgress_($("dmBudMsg"), items.map(x=>x.name), "アップロード中");
  const seen={}; let ok=0, ng=0;
  try{
    for(let i=0;i<items.length;i++){
      const x=items[i];
      const dest=`${x.year}_${x.area}.xlsx`;
      if(seen[dest]){ x.done=true; pg.step(i,"done","（重複のため送信省略）"); continue; }
      seen[dest]=1;
      pg.step(i,"now");
      busyOverlay_(true,"年度予算を送信中です",`${i+1} / ${items.length} 件目：${dest}`);
      try{
        if(x.driveId) await capi("uploadInboxFromDrive",x.driveId,dest);
        else await capi("uploadInbox","budget",dest,await fileB64(x.f),_XLSX_MIME);
        ok++; x.done=true;
        pg.step(i,"done",`→ ${dest}${x.area==="東北"?"（3エリアへ自動分割）":""}`);
      }catch(e){ ng++; pg.step(i,"fail",String(e&&e.message||e)); }
    }
  } finally {
    BUP=false; btnBusy_(btn,false); busyOverlay_(false);
    pg.finish(ok,ng);
    BQ=BQ.filter(x=>!x.done); budRenderQ();
  }
  if(ok){ toast(ok+" 件をアップロードしました（取込は5分毎の自動処理→上の「取込状況」で確認）"); refreshDmStatus_(); }
}

/* \u2500\u2500 モード検出: getLocation で ?mode=viewer を判定。応答が無くても1.5秒で必ず確定（起動を止めない） \u2500\u2500 */

  const section=(head,chipCls,chipTxt,inner)=>`<div class="cmcard"><div class="chips"><span class="chip ${chipCls}">${esc(chipTxt)}</span><b>${esc(head)}</b><span class="lb">${esc(snapLabelNow())}</span></div>${inner}</div>`;
  const nodata=`<div class="note">この条件の実績データがありません。</div>`;
  const areaHtml=async()=>{ const d=await API.detail(S.area,S.ym,S.snap,S.dept).catch(e=>isNoFile(e)?null:Promise.reject(e)); const apd=await viewerApd_(""); return section(`エリア合計（${S.area}／${S.dept}）`,"a",S.area,(d?renderSection(d):nodata)+`<div style="margin-top:10px"></div>`+apd); };
  const storeHtml=async(st)=>{ const d=await API.detailStore(S.area,S.ym,S.snap,S.dept,st.slug).catch(e=>isNoFile(e)?null:Promise.reject(e)); const apd=await viewerApd_(st.full); return section(`自店舗・自部門（${st.short}／${S.dept}）`,"s",st.short,(d?renderSection(d):nodata)+`<div style="margin-top:10px"></div>`+apd); };
  try{
    if(S.storeTab==="__area__"){ b.innerHTML=await areaHtml(); }
    else if(S.storeTab==="__all__"){
      busyOverlay_(true,"全店をまとめています",`エリア合計＋${S.stores.length}店を読み込み中…（少しお待ちください）`);
      try{
        const area=await areaHtml();
        const parts=await Promise.all(S.stores.map(st=>storeHtml(st).catch(e=>`<div class="cmcard"><div class="chips"><span class="chip s">${esc(st.short)}</span></div><div class="note">この店舗の読み込みに失敗しました。</div></div>`)));
        b.innerHTML=area+parts.map(p=>`<div class="page-break"></div>`+p).join("");
      } finally { busyOverlay_(false); }
    }
    else { const store=S.stores.find(x=>x.slug===S.storeTab); if(!store){ b.innerHTML=nodata; return; } b.innerHTML=(await storeHtml(store))+(await areaHtml()); }
  }catch(e){ b.innerHTML=`<div class="err">データを取得できません：${esc(String(e&&e.message||e))}</div>`; }
}

/* \u2500\u2500 スプレッドシート即時生成（GAS即時生成方式） \u2500\u2500 */
function bulkSheetSpec(area,dept){
  const a=aslug(area), d=dslug(dept), sp=s8(S.snap);
  const tabs=[{ name:"エリア合計", title:`${area} エリア合計／${dept}`, subtitle:snapLabelNow(),
    path:`c/shohin_detail__${a}__${d}__${S.ym}__${sp}.json`, key:{ym:S.ym,snap8:sp,area:area,store:"",dept:dept} }];
  S.stores.forEach(st=>tabs.push({ name:st.short, title:`${area}／${st.short}／${dept}`, subtitle:snapLabelNow(),
    path:`c/shohin_detail__${a}__${d}__${S.ym}__${sp}__${st.slug}.json`, key:{ym:S.ym,snap8:sp,area:area,store:st.full,dept:dept} }));
  return { fileName:`PDCA会議_${area}_${dept}_${S.ym}_${sp}`, tabs };
}
async function openSheet(spec,btn,msgEl){
  if(btn) btn.disabled=true; const restore=btn?btn.textContent:""; if(btn) btn.textContent="生成中\u2026";
  if(msgEl) msgEl.innerHTML=`<span class="lb">スプレッドシートを生成中\u2026（数秒かかります）</span>`;
  try{ const r=await capi("buildPdcaSheet",spec);
    if(msgEl) msgEl.innerHTML=`<a class="btn primary" href="${esc(safeUrl_(r.url))}" target="_blank" rel="noopener" style="text-decoration:none">\uD83D\uDCD7 スプレッドシートを開く</a>`;
    try{ window.open(r.url,"_blank"); }catch(e){}
  }catch(e){ if(msgEl) msgEl.innerHTML=`<span class="err">生成に失敗: ${esc(String(e&&e.message||e))}</span>`; }
  finally{ if(btn){ btn.disabled=false; btn.textContent=restore; } }
}
async function bulkOpenSheet(btn){
  if(!S.stores.length){ try{const r=await API.stores(S.area,S.ym,S.snap);S.stores=r.stores||[];}catch(e){} }
  openSheet(bulkSheetSpec(S.area,S.dept),btn,$("bulkMsg"));
}

boot();
</script>
