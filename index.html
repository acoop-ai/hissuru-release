<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 多層防御(第零条実践規範§7-4): 出口封鎖CSP。connect/imgを自ドメイン＋Google認証系だけに限定し、
     万一XSSが通っても盗んだデータを外部へ送れない状態を作る。script/frameはGoogleログインを壊さぬよう寛容に。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://accounts.google.com https://apis.google.com; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://www.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com">
<title>ヒッスル（PDCA）</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  /* 前回開発機（acoop-platform /pdca・c-section-table.tsx）の見た目を踏襲 */
  :root{
    --border:#e2e8f0; --muted:#64748b; --fg:#0f172a; --card:#fff; --bg-muted:#f1f5f9;
    --sky50:#f0f9ff; --sky100:#e0f2fe; --sky700:#0369a1; --sky800:#075985;
    --emer100:#dcfce7; --emer800:#166534; --violet100:#ede9fe; --violet800:#5b21b6;
    --good:#1565c0; --bad:#c62828; --amber:#b45309;
    --total-dark:#263238; --subtotal:#f1f5f9;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;color:var(--fg);background:#fff;}
  header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40;}
  /* 上の帯の字（2026-10-26 PO「余白に余裕があるので、もっと文字フォントを大きく」）: 帯の字はおおむね +2px（いちばん小さい 10〜11px は 12〜13px へ）。
     表の数字のマス（.cell）の字は変えない。表の左の見出しの列（部門・カテゴリ）は 12px → 14px（table.c の th.h・td.h） */
  header .logo{background:#0f172a;color:#fff;font-weight:700;font-size:14px;border-radius:6px;padding:6px 8px;}
  /* 上の帯（2026-11-02 PO「システム名が重複するので左上をはっきりと大きく、1か所で良い」）:
     システム名は左上の1か所だけ（大きく）。重複でない字（PDCA のどの段か・本番データ・build）は名前の右に小さく2行。
     右は「いまの担当」（入室後・本部用だけ）→ ログイン → ご利用ガイド。幅が足りないときは折り返す（はみ出さない） */
  header{flex-wrap:wrap;row-gap:6px;padding:5px 16px;min-height:52px;}
  header .brand{display:flex;align-items:center;gap:12px;min-width:0;}
  header h1{font-size:25px;font-weight:800;margin:0;letter-spacing:.04em;line-height:1.1;white-space:nowrap;color:#0f172a;}
  header .bsub{display:flex;flex-direction:column;gap:1px;border-left:2px solid var(--border);padding-left:12px;line-height:1.3;min-width:0;}
  header .hmode{font-size:13.5px;color:#334155;white-space:nowrap;}
  header .hstep{display:inline-block;background:#0f172a;color:#fff;border-radius:5px;padding:0 7px;margin-right:6px;font-size:12.5px;font-weight:700;line-height:19px;}
  header .hstep.sv{background:#475569;}
  header .bname{font-size:12px;color:#64748b;white-space:nowrap;}
  header .hsp{flex:1 1 0;min-width:8px;}
  header .user{font-size:13px;color:var(--muted);}
  /* いまの担当（入室後）: 何の担当で入っているか・どこに書けるか・担当を変える、を1つの札に */
  header .hasg{display:flex;align-items:center;gap:10px;border:1px solid var(--border);background:#f8fafc;border-radius:9px;padding:3px 5px 3px 10px;}
  header .hasg[hidden]{display:none;}
  header .hasg .who{display:flex;flex-direction:column;gap:1px;line-height:1.2;}
  header .hasg .chs{display:flex;align-items:center;gap:5px;font-size:13px;color:#475569;white-space:nowrap;}
  header .hasg .role-badge{border-radius:6px;padding:0 7px;font-weight:700;font-size:13.5px;line-height:20px;}
  header .hasg .chip{font-size:13.5px;padding:0 7px;line-height:20px;}
  header .hasg .wh{font-size:12px;color:#475569;white-space:nowrap;}
  header .hasg .btn{padding:4px 10px;font-size:13px;white-space:nowrap;}
  .page{transition:background-color .3s;min-height:calc(100vh - 55px);}
  main{max-width:1400px;margin:0 auto;padding:14px 16px 40px;}
  h2.title{font-size:20px;font-weight:600;margin:0;} .subtitle{font-size:14px;color:var(--muted);margin:2px 0 0;}
  .btn{border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-size:13px;padding:6px 12px;color:#334155;}
  .btn.primary{background:#0284c7;border-color:#0284c7;color:#fff;font-weight:600;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  select{font-size:15px;padding:5px 7px;border:1px solid var(--border);border-radius:6px;background:#fff;}
  label.lb{font-size:13px;color:var(--muted);}

  /* 入室ゲート */
  .gate-wrap{display:flex;min-height:70vh;align-items:center;justify-content:center;padding:16px;}
  .card{width:100%;max-width:640px;border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .card .chead{padding:20px 20px 6px;text-align:center;}
  .card .cico{margin:0 auto 6px;width:40px;height:40px;border-radius:999px;background:var(--sky100);display:flex;align-items:center;justify-content:center;color:var(--sky700);font-size:20px;}
  .card h3{font-size:18px;margin:4px 0;} .card .cdesc{font-size:13px;color:var(--muted);}
  .card .cbody{padding:8px 20px 20px;}
  .roles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0;}
  .role{border:1px solid var(--border);border-radius:10px;padding:12px;text-align:left;cursor:pointer;background:#fff;transition:.15s;}
  .role:hover{background:#f8fafc;} .role.on{border-color:#0ea5e9;background:var(--sky50);box-shadow:0 0 0 1px #0ea5e9 inset;}
  .role .rt{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;}
  .role .rd{margin:6px 0 0;font-size:11px;line-height:1.4;color:var(--muted);}
  .gate-selects{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0;}
  .warn{color:var(--amber);font-size:12px;text-align:center;} .hint{color:var(--muted);font-size:12px;text-align:center;}

  /* 入室後バー */
  .asgbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:15px;}
  .asgbar .btn{font-size:14px;}
  .asgbar .role-badge{border-radius:6px;padding:2px 8px;font-weight:600;}
  .rb-buyer{background:var(--sky100);color:var(--sky800);} .rb-admin{background:#fef3c7;color:#92400e;} .rb-viewer{background:#f1f5f9;color:#475569;} .rb-unei{background:#dcfce7;color:#166534;}

  /* モードタブ */
  .modes{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:0;}   /* 2026-11-02: 上の題と担当の帯を上の帯へ移したので、段の地図がいちばん上 */
  .modes button{border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-size:15px;padding:6px 11px;color:#334155;}
  .modes button.on{background:#0284c7;border-color:#0284c7;color:#fff;font-weight:600;}
  /* 管理者用（データ管理）は閲覧系タブと明確に別物と分かるよう、右端へ隔離＋琥珀色の枠 */
  /* 管理者用の2つは縦に積む（店舗事業部会議・仕入分析の列と同じ形・2026-10-26 字を大きくしても 1366 の幅で段の地図と同じ1行に入る） */
  .modes .admin-sep{margin-left:auto;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:4px;padding-left:10px;border-left:2px dashed #e2e8f0;}
  .modes .admin-sep button{padding:4px 11px;text-align:left;}
  .modes .admin-sep .lbl{font-size:12px;color:#b45309;font-weight:700;letter-spacing:.04em;white-space:nowrap;}
  .modes button.admin{border:1px solid #f59e0b;background:#fffbeb;color:#92400e;font-weight:700;}
  .modes button.admin:hover{background:#fef3c7;}
  .modes button.admin.on{background:#b45309;border-color:#b45309;color:#fff;}

  /* 選択バー・タブ */
  .selbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0;}
  /* 選ぶ帯（本部用・2026-11-02）: 「ここで選ぶ」を白い札1枚にまとめる。左＝選ぶ物（選んだ値を太字で）・右＝見方の切り替えと印刷。
     見出しの字（エリア・年月…）は従・選んだ値は主（字の大きさ・太さで差をつける） */
  #view .selbar{background:#fff;border:1px solid var(--border);border-radius:10px;padding:6px 10px;margin:10px 0 8px;gap:6px 8px;box-shadow:0 1px 2px rgba(15,23,42,.04);}
  #view .selbar > .lb{font-size:13.5px;color:#475569;font-weight:600;margin-left:4px;}
  #view .selbar > .lb:first-child{margin-left:0;}
  #view .selbar select{font-weight:600;color:#0f172a;border-color:#94a3b8;cursor:pointer;min-height:34px;}
  #view .selbar select:hover,#view .selbar .catbtn:hover{border-color:#0284c7;}
  .tabs2{display:flex;flex-wrap:wrap;gap:3px;margin:10px 0;}
  .tabs2 button{border:1px solid var(--border);border-radius:7px;background:#fff;cursor:pointer;font-size:14px;padding:4px 6px;color:#475569;}   /* 字は 12→14px・左右の余白は 9→6px（北関東の18店が 1366 の幅で1行に入る） */
  .tabs2 button.on{background:#0369a1;border-color:#0369a1;color:#fff;font-weight:600;}
  .chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:16px;margin:10px 0;}
  .chip{border-radius:6px;padding:2px 8px;font-weight:700;}
  .chip.a{background:var(--sky100);color:var(--sky800);} .chip.d{background:var(--emer100);color:var(--emer800);} .chip.s{background:var(--violet100);color:var(--violet800);}
  .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin:8px 0;align-items:center;}
  .legend .sw{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:middle;margin-right:3px;}
  .splitnote{font-size:12px;color:var(--muted);margin:6px 0 0;}
  .sokuho{display:flex;gap:8px;border-left:4px solid #f59e0b;background:#fffbeb;color:#78350f;padding:10px 14px;border-radius:8px;font-size:15px;margin:8px 0;}
  .note{font-size:13px;color:var(--muted);background:#fff;border:1px dashed var(--border);border-radius:10px;padding:14px;}
  .err{color:var(--bad);font-size:13px;padding:12px;}
  /* 注記（青）と警告（黄）。従来 .gnote は #guide 内にしか定義がなくガイド外で無装飾だったため、共通定義を置く */
  .gnote{background:var(--sky50);border:1px solid var(--sky100);border-radius:8px;padding:8px 11px;font-size:12.5px;line-height:1.7;color:var(--sky800);margin:8px 0 0;}
  .cmwarn{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 11px;font-size:12.5px;line-height:1.7;color:#78350f;margin:8px 0 0;}

  /* C表 */
  .tbl-wrap{max-height:70vh;overflow:auto;border:1px solid var(--border);border-radius:10px;background:#fff;}
  table.c{width:100%;border-collapse:collapse;font-size:12px;}
  table.c thead th{position:sticky;top:0;z-index:20;background:var(--bg-muted);color:var(--muted);font-weight:600;padding:6px 10px;text-align:right;border-left:1px solid var(--border);white-space:nowrap;}
  table.c thead th.h{text-align:left;left:0;z-index:30;font-size:14px;} table.c thead th .u{font-size:10px;font-weight:400;color:#94a3b8;margin-left:2px;}
  table.c td{border-left:1px solid var(--border);border-top:1px solid var(--border);padding:2px 10px;vertical-align:top;text-align:right;}
  table.c td.h{text-align:left;font-weight:600;position:sticky;left:0;background:#fff;z-index:10;white-space:nowrap;font-size:14px;}
  /* 見出しの列が2つ（部門・カテゴリ）の表: 2つ目の列の貼り付く位置＝1つ目の列の幅（字が大きくなり、部門の行の名前が1つ目の列に入るので、測って合わせる・fixHcols_） */
  table.c thead th.h2,table.c td.h2{left:var(--hc1,56px);}
  /* 委託の、月末確定の前の粗利（今年の値の印・2026-10-26）: 計(推定)・前(推定) と同じ大きさの「(推定)」を、今年の値の左に */
  table.c .curest{font-weight:400;font-size:11px;white-space:nowrap;}   /* 「(推定)」の途中で折り返さない（細い列では数の上の行に） */
  table.c .cev{white-space:nowrap;}   /* 店舗事業部会議の細い列: 「(推定)」と数を1行に */
  #uTbl table.c .curest{display:block;}   /* 運営部全体（店の列が細い）: 「(推定)」はいつも数の上の行に（数が長い所だけ折り返して、同じ行の「前」の高さがずれないように） */
  #sokCurEst{display:block;} #sokCurEst:empty{display:none;}   /* 速報の帯の、委託の一文は2行目に（文の途中で折り返さない） */
  tr.total td{background:var(--total-dark);color:#fff;font-weight:700;border-top:2px solid #0f172a;}
  tr.total td.h{background:var(--total-dark);color:#fff;}
  tr.subtotal td{background:var(--subtotal);font-weight:600;} tr.subtotal td.h{background:var(--subtotal);}
  tr.datarow:hover td{background:#f8fafc;}
  .cell{display:flex;flex-direction:column;gap:1px;text-align:right;line-height:1.25;font-variant-numeric:tabular-nums;padding:3px 0;}
  .cell .act{font-weight:700;font-size:12px;background:rgba(224,242,254,.6);margin:0 -10px;padding:0 10px;}
  tr.total .cell .act{background:transparent;color:#fff;} .cell .prev{color:var(--muted);font-size:11px;}
  tr.total .cell .prev{color:#cbd5e1;}
  .cell .bud{color:var(--amber);font-size:11px;} tr.total .cell .bud{color:#fcd34d;}
  .g{color:var(--good);} .b{color:var(--bad);} .n{color:var(--muted);}
  tr.total .g{color:#7dd3fc;} tr.total .b{color:#fca5a5;}
  .badge{display:inline-block;border-radius:4px;padding:0 4px;font-size:10px;font-weight:500;margin-top:2px;}
  .bd-loss{background:#ffe4e6;color:#be123c;} .bd-inv{background:#ffedd5;color:#c2410c;}
  td.gp-neg{background:#fff7ed;} td.gp-loss{background:#fefce8;}
  .catcol{color:var(--muted);}
  input[type=number]{width:64px;font-size:13px;padding:4px 6px;border:1px solid var(--border);border-radius:6px;}

  /* コメントパネル（G2）・データ管理（G3） */
  .cmcard{border:1px solid var(--border);border-radius:12px;background:#fff;padding:12px 14px;margin-top:14px;}
  .cmhead{display:flex;gap:8px;align-items:baseline;margin-bottom:4px;flex-wrap:wrap;}
  .cmsechead{font-weight:600;font-size:13px;margin-bottom:6px;}
  .cmempty{color:var(--muted);font-size:12px;}
  /* 課題グリッド: 行=課題（①②…）× 列=A/P/D。済は行単位 */
  table.cmt{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}
  table.cmt th{background:var(--bg-muted);color:var(--muted);font-weight:600;padding:6px 8px;text-align:left;border:1px solid var(--border);}
  table.cmt td{border:1px solid var(--border);padding:6px 8px;vertical-align:top;background:#fff;}
  table.cmt td.cmmark{width:26px;text-align:center;}
  tr.cmresolved td{background:#f0fdf4;}
  .cmmark{font-size:13px;color:var(--sky700);padding-top:2px;}
  .cmtext{font-size:13px;white-space:pre-wrap;line-height:1.5;}
  .cmmeta{font-size:11px;color:var(--muted);margin-top:2px;}
  .cmbtns{display:flex;gap:4px;margin-top:2px;} .cmbtns .btn{padding:2px 8px;font-size:12px;}
  .cmadd{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap;}
  .cmcell{width:100%;min-height:26px;border:none;background:transparent;font-family:inherit;font-size:13px;line-height:1.5;resize:none;padding:2px 3px;outline:none;box-sizing:border-box;display:block;}
  .cmcell:focus{background:#fff;box-shadow:0 0 0 2px #7dd3fc inset;border-radius:4px;}
  .badge.bd-ok{background:#dcfce7;color:#166534;}

  /* アップロード進捗（フリーズ誤認の防止）: 押下感・スピナー・進捗バー・処理中オーバーレイ */
  .btn:active:not(:disabled){transform:scale(.97);}
  .btn.busy{position:relative;color:transparent !important;}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px;}
  .spin.dark{border-color:rgba(2,132,199,.3);border-top-color:#0284c7;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .upbox{margin-top:10px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#f8fafc;}
  .upbox .uphead{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#0f172a;}
  .upbar{height:8px;border-radius:999px;background:#e2e8f0;overflow:hidden;margin-top:8px;}
  .upbar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0284c7,#38bdf8);transition:width .25s;}
  .uplist{margin-top:8px;font-size:12px;line-height:1.7;}
  .uprow{display:flex;align-items:center;gap:6px;}
  .uprow .st{width:18px;text-align:center;}
  .uprow.done{color:#166534;} .uprow.fail{color:#b91c1c;} .uprow.wait{color:#94a3b8;} .uprow.now{color:#0369a1;font-weight:600;}
  .upnote{font-size:11px;color:var(--muted);margin-top:6px;}
  /* データの届き具合の知らせ（上の帯のすぐ下・2026-11-02 PO で決まりを替えた）:
     #noticeUp＝受払（月中）のアップロード忘れ（黄・本部用）／#noticeCopy＝本部 PC の取込・写しの止まり（赤・管理者だけ）。
     文の途中で改行しない。入る幅なら1行・入らなければ文の切れ目で折り返す（右が空いたまま2行にしない）。印刷には出さない */
  .fbar{display:flex;align-items:center;gap:10px;background:#fffbeb;border-bottom:2px solid #fde68a;color:#78350f;padding:7px 16px;font-size:13px;line-height:1.6;}
  .fbar.copy{background:#fef2f2;border-bottom-color:#fecaca;color:#7f1d1d;}
  .fbar b{font-weight:700;}
  .fbar .fbtxt{display:flex;flex-wrap:wrap;gap:0 .45em;}
  @media print{ .fbar{display:none !important;} }
  #busyOverlay{position:fixed;inset:0;background:rgba(15,23,42,.35);display:flex;align-items:center;justify-content:center;z-index:200;}
  #busyOverlay .bcard{background:#fff;border-radius:14px;padding:20px 26px;box-shadow:0 10px 30px rgba(0,0,0,.2);text-align:center;min-width:260px;}
  #busyOverlay .bttl{font-weight:700;font-size:14px;margin-top:10px;color:#0f172a;}
  #busyOverlay .bsub{font-size:12px;color:var(--muted);margin-top:4px;}
  /* ご利用ガイド（ヘッダー右上から開く） */
  header .ghelp{margin-left:10px;padding:4px 10px;font-size:14px;white-space:nowrap;border-color:var(--sky700);color:var(--sky800);background:var(--sky50);font-weight:600;}
  header .ghelp:hover{background:var(--sky100);}
  #guide{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;}
  #guide .gcard{background:#fff;border-radius:14px;width:100%;max-width:880px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.28);}
  #guide .ghead{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--border);}
  #guide .ghead h2{font-size:16px;margin:0;} #guide .ghead .gsub{font-size:11px;color:var(--muted);}
  #guide .gclose{margin-left:auto;}
  #guide .gbody{overflow:auto;padding:14px 20px 26px;}
  #guide h3{font-size:14px;margin:20px 0 6px;color:var(--sky800);border-left:4px solid var(--sky700);padding-left:8px;}
  #guide h3:first-child{margin-top:4px;}
  #guide p,#guide li{font-size:13px;line-height:1.75;color:#334155;margin:4px 0;}
  #guide ul{margin:4px 0 6px 20px;padding:0;}

  /* ── 週間モード（第5便・2026-10-16）: 累計｜週間の切り替え・🔎 気になる所を探す・週の推移・棚卸・気になる所 ── */

<script>
/* 起動エラー可視化＋該当ソース取得: エラー行の実物を画面に出す（同一オリジンの生HTMLをfetch）。 */
window.addEventListener("error", function(ev){
  var ln = ev.lineno || 0;
  var esc2 = function(s){ return String(s).replace(/[&<>]/g, function(c){ return c==="&"?"&amp;":c==="<"?"&lt;":"&gt;"; }); };
  var show = function(src){
    var a = document.getElementById("app");
    if (a) a.innerHTML = '<div class="err" style="white-space:pre-wrap;font-size:11px;line-height:1.5">起動エラー：' + esc2(ev.message||"不明") + '\n行' + ln + '\n--- 該当ソース（前後） ---\n' + src + '</div>';
  };
  try{
    fetch(location.href).then(function(r){ return r.text(); }).then(function(t){
      var lines = t.split("\n");
      var out = [];
      for (var i = Math.max(0, ln-4); i < Math.min(lines.length, ln+2); i++){ out.push((i+1) + ": " + esc2(lines[i])); }
      show(out.join("\n"));
    }).catch(function(e){ show("(ソース取得失敗: " + esc2(e.message) + ")"); });
  }catch(e){ show("(取得例外: " + esc2(e.message) + ")"); }
});
</script>

let currentAccessToken=null, accessTokenExpiry=0, oauthTokenClient=null, tokenRefreshTimer=null, authedEmail="";

// 覚える数は 200 まで（全部門の店の明細は1店で6つ読む＝17店で約100）。あふれたら、いちばん長く使っていないものから捨てる
const JCACHE=new Map(), JCACHE_TTL=5*60*1000, JCACHE_MAX=200;
function cached_(key,fn){
  if(/status\.json$/.test(key)) return fn();
  const now=Date.now(), hit=JCACHE.get(key);
  if(hit&&now-hit.t<JCACHE_TTL){ JCACHE.delete(key); JCACHE.set(key,hit); return hit.p; }   // 使ったものを後ろへ（捨てる順を、使っていない順に）
  const p=fn(), e={t:now,p}; JCACHE.set(key,e);
  p.then(()=>{ e.done=true; },()=>{ if(JCACHE.get(key)===e) JCACHE.delete(key); });   // done＝届いた（jcPeek_）・失敗したものは覚えない
  if(JCACHE.size>JCACHE_MAX) JCACHE.delete(JCACHE.keys().next().value);

}

function jcPeek_(key){ const e=JCACHE.get(key); if(!e||Date.now()-e.t>=JCACHE_TTL) return null; return e.done?"done":"pending"; }

/* ══ 前回の表を先に出す（PO 2026-11-10「案1」）══
   店舗事業部会議を開いたとき、その人が前に開いた同じ表（同じ回・同じエリア／店）を端末に覚えていれば、すぐにそれを出し、裏で新しい表を取りに行く（jigyoBody_）。
   守り（端末に覚える物と消す決まり）:
   ・置き場はアカウントごと（hissuru_jgc_<アカウントの SHA-256 の頭16字>。メールそのものは鍵にしない）。ログインしたら、ほかのアカウントの物は全部消す
   ・ログインが切れた（サーバーが認証失敗を返した・端末の鍵を消した）ら、全部消す（clearStoredToken_）
   ・7日より古い物は使わずに消す／覚えるのは、いちばん新しい 6 本・合わせて 60 万字まで（1本 20 万字を超える表は覚えない）。超えたら古い物から消す
   ・読み書きは try/catch。読めない・壊れている（形が違う）ときは使わずに消し、今までどおり取りに行く
   ・覚えるのは、サーバーが返した表（表を出すときに使った物）だけ。先読み（adminPrefetch_）は覚えない（メモリだけ） */
const JGC={ah:"",mem:null,max:6,maxChars:600000,itemMax:200000,days:7};
const JGC_PRE="hissuru_jgc_";
async function jgcInit_(){
  let h="";
  try{ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("hissuru-jgc-v1|"+String(authedEmail||"local").trim().toLowerCase()));
    h=[...new Uint8Array(b)].slice(0,8).map(x=>x.toString(16).padStart(2,"0")).join(""); }catch(e){ h=""; }   // 作れない端末では使わない
  JGC.ah=h; JGC.mem=null;
  try{ for(let i=localStorage.length-1;i>=0;i--){ const k=localStorage.key(i); if(k&&k.startsWith(JGC_PRE)&&k!==JGC_PRE+h) localStorage.removeItem(k); } }catch(e){}
  jgcLoad_();
}
function jgcClearAll_(){ JGC.mem=null; try{ for(let i=localStorage.length-1;i>=0;i--){ const k=localStorage.key(i); if(k&&k.startsWith(JGC_PRE)) localStorage.removeItem(k); } }catch(e){} }
const jgcOk_=x=>!!x&&typeof x.k==="string"&&+x.t>0&&x.d&&typeof x.d==="object"&&Array.isArray(x.d.rows)&&Array.isArray(x.d.columns);
function jgcLoad_(){
  if(!JGC.ah) return [];
  if(JGC.mem) return JGC.mem;
  let a=[], bad=false;
  try{ const o=JSON.parse(localStorage.getItem(JGC_PRE+JGC.ah)||"null"); if(o&&o.v===1&&Array.isArray(o.items)) a=o.items; else if(o) bad=true; }catch(e){ bad=true; }
  const now=Date.now(), keep=a.filter(x=>jgcOk_(x)&&now-x.t<JGC.days*864e5&&x.t<=now+6e4);
  JGC.mem=keep; if(bad||keep.length!==a.length) jgcSave_();
  return keep;
}
function jgcSave_(){
  const key=JGC_PRE+JGC.ah, out=[]; let n=0;
  (JGC.mem||[]).slice().sort((p,q)=>q.t-p.t).forEach(x=>{ if(out.length<JGC.max&&n+(x.n||0)<=JGC.maxChars){ out.push(x); n+=x.n||0; } });
  JGC.mem=out;
  for(let i=0;i<2;i++){   // 入らない（端末の置き場がいっぱい）＝いちばん古い物を捨てて1回だけやり直す
    try{ if(out.length) localStorage.setItem(key,JSON.stringify({v:1,items:out})); else localStorage.removeItem(key); return; }catch(e){ out.pop(); }
  }
  try{ localStorage.removeItem(key); }catch(e){} JGC.mem=[];
}
function jgcGet_(k){ return jgcLoad_().find(x=>x.k===k)||null; }
function jgcPut_(k,d){
  if(!JGC.ah||!d||!Array.isArray(d.rows)) return;
  let n=0; try{ n=JSON.stringify(d).length; }catch(e){ return; }
  if(n>JGC.itemMax) return;
  JGC.mem=jgcLoad_().filter(x=>x.k!==k).concat([{k,t:Date.now(),n,d}]); jgcSave_();
}

/* 新分類（2026-09）で分かれた中分類は、前年は分かれていないので前年比を出さない（PO 決定 2026-09-22）。
   分け方は backend tools/convert_budget_newclass.py の SPLITS・FISH_TO と同じ。added＝新しくできた中分類。
   判定: added に今年の売上があり、前年の売上が無い → その組の全員を「—」にする（部門計の前年比はそのまま）。
   旧分類のデータ（added の行が無い）や、前年も分かれている年は、ふつうに前年比を出す。 */
const SPLIT_GROUPS=[
  {members:["温惣菜","冷惣菜"],added:["冷惣菜"]},
  {members:["一般食品","酒８％"],added:["酒８％"]},

/* salesOf(中分類名) → {current, yoy}（その部門・その列の売上）。無ければ null。前年比を出さない中分類の Set を返す */
function splitNoYoy(salesOf){
  const out=new Set();
  SPLIT_GROUPS.forEach(g=>{
    const cs=g.added.map(salesOf).filter(Boolean);
    const now=cs.some(c=>Math.abs(c.current||0)>=1), last=cs.some(c=>Math.abs(c.yoy||0)>=1);
    if(now&&!last) g.members.forEach(m=>out.add(m));
  });
  return out;
}

function splitNoYoyRows(rows,sales){
  const byDept={}; rows.forEach(r=>{ if(r.category!=null) (byDept[r.dept||""]=byDept[r.dept||""]||{})[r.category]=r; });
  const out=new Set();
  Object.entries(byDept).forEach(([d,cats])=>splitNoYoy(c=>cats[c]?sales(cats[c]):null).forEach(c=>out.add(d+"|"+c)));
  return out;
}

/* ── いつも出さない中分類（PO 2026-10-26「別な地域の混ざっている愛知の2つの分類は非表示にして下さい」）──
   農産の あいち生産者（新分類のコード 16）・あいち生産者１０％（コード 17）。値が 0 でなくても、どのモードでも出さない。決まりはここだけ（HIDE_CATS）。
   当て方: outbox の行は中分類のコードを持たない（部門と名前だけ）ので、部門と名前を NFKC でそろえて当てる（「あいち生産者10%」など全角・半角のゆれも当たる）。
   抜く所: 表を読んだところ（loadJson・loadJsonStrict の hideCats_）＝どの表・件数・印刷・🔎 の問いにも、はじめから無い。
     c の表と店舗事業部会議は rows から・週の表は cats と hits から。部門の計・合計の行は、作る側の数のまま（中に含まれる）。
   値が入っていたら（データの誤り）: 行は出さず、d._hidCats に残して、表の下に1行（部門の計と、見える行の和が合わないことが分かるように）。
     0 なら何も出さない（「すべて 0 の中分類」の注記にも名前を出さない＝読んだ時点で行が無い）。
   🔎 の当たりの数のうち meta の hit_counts（作る側が数える）は、読んだエリアの分だけ、抜いた当たりを引く（wkHidHits_） */
const HIDE_CATS=[{dept:"農産",cat:"あいち生産者",code:16},{dept:"農産",cat:"あいち生産者１０％",code:17}];
const nfk_=s=>String(s==null?"":s).normalize("NFKC").replace(/\s+/g,"");
const HIDE_DEPT=new Map(HIDE_CATS.map(h=>[nfk_(h.cat),nfk_(h.dept)])), HIDE_NAME=new Map(HIDE_CATS.map(h=>[nfk_(h.cat),h.cat]));   // 注記には決まりの名前で出す（ゆれた名前でなく）
/* 部門が分からない行（部門を持たない形）は、名前だけで当てる */
function isHiddenCat_(dept,cat){ const k=nfk_(cat); if(!HIDE_DEPT.has(k)) return false; const d=nfk_(dept); return !d||d===HIDE_DEPT.get(k); }
/* 抜いた行の値: c の表（cells）・運営部全体（grand＝合計・stores＝店）・店舗事業部会議（values・yoy）。any＝どこかに 0 でない値 */
function hidSum_(r){
  const cs=r.cells||r.grand||null;
  if(cs) return {s:((cs.sales_month||{}).current)||0, g:((cs.gross_profit_month||{}).current)||0,
    any:!zeroCells_(cs)||!Object.values(r.stores||{}).every(zeroCells_)};
  const v=r.values||{};
  return {s:v.sales_month||0, g:v.gross_profit_month||0, any:!(zeroCells_(r.values)&&zeroCells_(r.yoy))};
}
function hideCats_(d){
  if(!d||typeof d!=="object") return d;
  const hid=[];
  if(Array.isArray(d.rows)) d.rows=d.rows.filter(r=>{
    if(!r||r.category==null||!isHiddenCat_(r.dept,r.category)) return true;
    const x=hidSum_(r); if(x.any) hid.push(Object.assign({dept:r.dept||"",cat:HIDE_NAME.get(nfk_(r.category))},x)); return false; });
  if(d.cats&&typeof d.cats==="object") Object.keys(d.cats).forEach(k=>{
    const p=k.indexOf("|"), dp=p<0?"":k.slice(0,p), ct=p<0?k:k.slice(p+1); if(!isHiddenCat_(dp,ct)) return;
    const s=d.cats[k]; if(s&&Array.isArray(s.s)&&s.s.some(v=>v)) hid.push({dept:dp,cat:HIDE_NAME.get(nfk_(ct)),wk:s,any:true});
    delete d.cats[k]; });
  if(Array.isArray(d.hits)){ const out=[]; d.hits=d.hits.filter(h=>{ const x=!!h&&h.c!=null&&isHiddenCat_(h.d,h.c); if(x) out.push(h); return !x; }); if(out.length) d._hidHits=out; }
  if(hid.length) d._hidCats=hid;
  return d;
}
const hidK_=v=>{ const x=Math.round((v||0)/1000); return x===0?"1千円未満":x.toLocaleString()+"千円"; };
/* 表の下の1行。list＝d._hidCats（値の入った行だけ）。wk＝週の表のときの {cols}（表に出した週） */
function hidNote_(list,wk){
  const L=(list||[]).filter(x=>x&&x.any); if(!L.length) return "";
  const names=[...new Set(L.map(x=>x.cat))].join("・");
  let v;
  if(wk){ const s=L.reduce((t,x)=>t+wk.cols.reduce((u,j)=>u+((x.wk&&x.wk.s[j])||0),0),0); if(!s) return ""; v=`表の${wk.cols.length}週で売上 ${hidK_(s)}`; }
  else { const s=L.reduce((t,x)=>t+(x.s||0),0), g=L.reduce((t,x)=>t+(x.g||0),0);
    v=[s?`今年の売上 ${hidK_(s)}`:"", g?`粗利 ${hidK_(g)}`:""].filter(Boolean).join("・")||"計画・前年などの値"; }
  return `<div class="splitnote hidnote">愛知の分類（${esc(names)}）に ${esc(v)} が入っています（表には出していません）。部門の計には入っているので、見える行を足しても部門の計と合いません。</div>`;
}
/* ── 合計の行（2026-10-26 PO「部門の行に合計と書く」）──
   見出しの列が2つ（部門・カテゴリ）の表: 部門の行・全体の合計の行も、カテゴリの欄に「合計」（空けない）。部門の欄は名前（「◆ 全部門合計」→「◆ 全部門」）。
   見出しの列が1つで、部門の行と中分類の行が混ざる表（運営部全体・店舗事業部会議・週の表のカテゴリ別）: 部門の行の名前に「合計」を足す（▶ 農産 合計） */
const SUM_WORD="合計";
function totalLabels_(label){
  const s=String(label==null?"":label).trim(), m=s.match(/^(.*?)\s*合計$/);
  return [(m&&m[1].replace(/[◆▶■\s]/g,""))?m[1].trim():s, SUM_WORD];
}
const withSum_=label=>{ const s=String(label==null?"":label).trim(); return /計$/.test(s)?s:s+" "+SUM_WORD; };
/* 見出しの列が2つの表: 2つ目の列（カテゴリ）が貼り付く位置を、1つ目の列（部門）の幅に合わせる（表を描くたび・幅が変わるたび） */
function fixHcols_(){
  document.querySelectorAll("table.c.hc2").forEach(t=>{ const th=t.querySelector("thead th.h"); if(!th) return; const w=Math.round(th.getBoundingClientRect().width); if(w>0) t.style.setProperty("--hc1",w+"px"); });
}
if(typeof MutationObserver!=="undefined"&&document.body) new MutationObserver(fixHcols_).observe(document.body,{childList:true,subtree:true});
window.addEventListener("resize",fixHcols_);

/* 縦積みセル（金額=計/実績/前/計比/前比、率=実績/前/前差/計差） */
/* セルは全列とも「計 → 実績 → 前年 → 計画差 → 前年差」の5段固定。
   計画が無い列は空欄を置いて段数を揃える（列をまたいで実績が必ず同じ行に来るように）。 */
/* est＝推定の印 {b, y}（estOf_）。部門の行・合計の行は渡さない */
function cellHtml(cell,col,dark,noYoy,est){
  if(!cell||cell.current==null) return `<div class="cell n">—</div>`;
  const hib=col.higher_is_better, cur=cell.current, yoy=cell.yoy, bud=cell.budget;
  const isRate=(col.type==="rate");
  const hasB=(bud!=null && bud!==0);
  const yDiff=cur-(yoy||0), pDiff=hasB?cur-bud:0;
  const fmt=v=>isRate?pct(v):kyen(v);
  const e=est||{};
  let h=`<div class="cell">`;
  // ①計画
  h+= hasB ? `<div class="bud">計${e.b?EST_TAG:""} ${fmt(bud)}</div>` : `<div class="bud">&nbsp;</div>`;
  // ②実績（この行が全列で揃う）。委託の月末確定の前の粗利は、作る側が付けた印（cur_est）だけを見て「(推定)」（curEstMark_）
  h+=`<div class="act">${curEstMark_(cell)}${fmt(cur)}</div>`;
  // ③前年（新分類で分かれた中分類は前年と比べられないので「—」）
  h+=`<div class="prev">前${e.y?EST_TAG:""} ${noYoy?"—":fmt(yoy)}</div>`;
  // ④計画との差（上）
  h+= hasB
    ? `<div class="${judge(hib,pDiff)}">${isRate?`計差 ${ppt(pDiff)}`:`計比 ${ratio(cur,bud)} <span style="opacity:.8">${dkyen(pDiff)}</span>`}</div>`
    : `<div class="n">&nbsp;</div>`;
  // ⑤前年との差（下）
  h+= noYoy
    ? `<div class="n">${isRate?"前差":"前比"} —</div>`
    : `<div class="${judge(hib,yDiff)}">${isRate?`前差 ${ppt(yDiff)}`:`前比 ${ratio(cur,yoy)} <span style="opacity:.8">${dkyen(yDiff)}</span>`}</div>`;
  return h+`</div>`;
}

function legend(){
  return `<div class="legend"><span>セル: <b style="color:var(--fg)">実績</b> / 前年 / 前比（差分）・計＝予算</span>`+
    `<span><span class="sw" style="background:var(--good)"></span>改善</span>`+
    `<span><span class="sw" style="background:var(--bad)"></span>悪化</span>`+
    `<span class="badge bd-loss">\u26A0差損%</span><span class="badge bd-inv">\u26A0棚卸原価ゼロ</span></div>`;
}

/* カテゴリ縦積み表（shohin_detail）: \u25C6全体合計\u2192\u25B6部門小計\u2192カテゴリ行 */
/* opts.deptGo（第2便・運営部詳細の店）: 部門の小計の行を押すと、下の運営部の A・PD がその部門に替わる
   opts.deptGo==="sdept"（全部門・商品部詳細）: 部門の小計の行を押すと、その部門の明細と A・PD へ下りる
   opts.fold（全部門）: カテゴリの行をはじめたたむ（表の上の釦で出す） */
function renderSection(d,opts){
  const o=opts||{}, cols=d.columns;
  const dg=dept=>!o.deptGo?null:(o.deptGo==="sdept"
    ? {go:"sdept",a:dept,k:"d:"+dept,title:`押すと、${dept}の明細と A・PD（商品部詳細）`}
    : {go:"cdept",a:dept,k:"d:"+dept,title:`押すと、下の運営部の A・PD を ${dept} に替えます`});
  let h=(o.fold?`<div style="margin:0 0 6px"><button class="btn" data-fold>▸ カテゴリも出す</button> <span class="lb">部門の行を押すと、その部門の明細と A・PD へ</span></div>`:"")+
    `<div class="tbl-wrap"><table class="c hc2${o.fold?" foldcats":""}"><thead><tr>`+
    `<th class="h" style="left:0">部門</th><th class="h h2">カテゴリ</th>`+
    cols.map(c=>`<th>${esc(c.label)}<span class="u">${c.type==="amount"?"千円":"%"}</span></th>`).join("")+`</tr></thead><tbody>`;
  /* 部門絞込データの grand_total は部門合計の重複（ラベルだけ「全部門合計」）のため表示しない */
  const dup=d.grand_total&&(d.dept_totals||[]).length===1&&
    (d.grand_total.cells.sales_month||{}).current===(d.dept_totals[0].cells.sales_month||{}).current;
  // 中分類を選んだ合計（本部用の入口だけ・o.catx）。部門ごとに、その部門の設定で部門の行を出し直す。何も絞らない部門は、いままでと同じ字
  const cx=o.catx?catxSection_(d):null;
  if(d.grand_total&&!dup) h+=totalRow(d.grand_total,cols,true,2,null,"",cx&&cx.any?cx.grand:null);
  const dtMap={}; (d.dept_totals||[]).forEach(t=>dtMap[t.dept]=t);
  const noYoy=splitNoYoyRows(d.rows,r=>(r.cells||{}).sales_month||null), noted=new Set();
  const marked=estMarked_(d.rows.map(r=>r.cells));
  let prevDept=null; const hid=[];
  d.rows.forEach(r=>{
    if(r.dept!==prevDept && dtMap[r.dept]){ h+=totalRow(dtMap[r.dept],cols,false,2,dg(r.dept),
      (r.dept===S.dept&&o.deptGo)?" curdept":"",cx?cx.by[r.dept]:null); }
    prevDept=r.dept;
    if(zeroCells_(r.cells)){ hid.push([r.dept||"",r.category]); return; }   // すべて 0 の中分類は出さない（部門の行は上で出している）
    const ny=noYoy.has((r.dept||"")+"|"+r.category); if(ny) noted.add(r.category);
    const ep=estPrior(d.ym,r.category);
    const xo=!!(cx&&cx.by[r.dept]&&cx.by[r.dept].ex.has(r.category));   // 合計に入れていない中分類（薄く・名前の下に一言）
    h+=`<tr class="datarow${o.fold?" catrow":""}${xo?" catx":""}"><td class="h" style="left:0"></td><td class="h h2 catcol">${esc(r.category)}`;
    if(xo) h+=`<br><span class="badge bd-catx">合計に入れていない</span>`;
    if(r.alerts&&r.alerts.loss_alert) h+=`<br><span class="badge bd-loss">\u26A0差損${(r.alerts.loss_rate||0).toFixed(1)}%</span>`;
    if(r.alerts&&r.alerts.inv_cost_zero) h+=`<br><span class="badge bd-inv">\u26A0棚卸原価ゼロ</span>`;
    h+=`</td>`;
    h+=cols.map(c=>{
      let cls=""; if(c.key==="gross_profit_month"&&r.alerts){ cls=r.alerts.gp_negative?" gp-neg":(r.alerts.loss_alert?" gp-loss":""); }
      return `<td class="${cls}">${cellHtml(r.cells[c.key],c,false,ny,estOf_(r.cells[c.key],marked,ep))}</td>`;
    }).join("");
    h+=`</tr>`;
  });
  h+=`</tbody></table></div>`;
  return h+splitNote(noted)+estNote(d.ym,marked,h)+curEstNote_(h)+zeroNote_(hid)+hidNote_(d._hidCats)+(cx?cx.note:"");
}
/* 部門の行・全体の合計の行（見出しの列2つの表）: 部門の欄に名前、カテゴリの欄に「合計」。
   x（中分類を選んだ合計・catxSection_）: 出し直した数 x.cells・名前の下に（ベーカリーを除く）・前年と比べられない組を片方だけ入れたときは前年比「—」 */
function totalRow(t,cols,dark,hspan,g,cls,x){
  const [name,sum]=totalLabels_(t.label), cs=x?x.cells:t.cells;
  return `<tr class="${dark?"total":"subtotal"}${g?" go":""}${cls||""}"${goAttr_(g)}><td class="h" style="left:0">${goLabel_(name,g)}</td><td class="h h2">${esc(sum)}${x?catxMk_(x.label):""}</td>`+
    cols.map(c=>`<td>${cellHtml(cs[c.key],c,dark,!!(x&&x.noYoy))}</td>`).join("")+`</tr>`;
}
/* 集計表（by_store 行=店舗 / by_dept 行=部門）: \u25C6合計\u2192行 */
/* ── 全部門（計）（2026-10-16b・PO「全部門計もわかるように」）──
   部門の選ぶ欄の「全部門（計）」。数は、部門ごとの数（届いている表の数）を足し、率は足した額から出し直す（前年・予算も同じ）。
   率の分母は売上（粗利率＝粗利÷売上・値引率＝値引÷売上・廃棄率＝廃棄÷売上。届いている表の率と同じ出し方。分母が 0 なら 0）。
   A・PD は部門ごとの欄なので、全部門の画面では書かない（部門を選ぶ近道を出す）。 */
const ALL_DEPT="__all__";
const isAll_=d=>d===ALL_DEPT;
const deptLabel_=d=>isAll_(d)?"全部門":d;
const RATE_OF={gross_profit_rate_month:["gross_profit_month","sales_month"],discount_rate:["discount_amount","sales_month"],discard_rate:["discard_amount","sales_month"]};
function sumCells_(list,cols){
  const F=["current","yoy","budget"], out={};
  const keys=new Set(cols.filter(c=>c.type!=="rate").map(c=>c.key)); Object.values(RATE_OF).forEach(p=>p.forEach(k=>keys.add(k)));
  keys.forEach(k=>{ const o={type:"amount"}; let any=false;
    F.forEach(f=>{ let s=null; list.forEach(cs=>{ const v=((cs||{})[k]||{})[f]; if(v!=null) s=(s||0)+v; }); if(s!=null){ o[f]=s; any=true; } });
    out[k]=any?o:null; });
  cols.filter(c=>c.type==="rate").forEach(c=>{ const p=RATE_OF[c.key], o={type:"rate"}; let any=false;
    if(p) F.forEach(f=>{ const n=(out[p[0]]||{})[f], d=(out[p[1]]||{})[f]; if(n!=null&&d!=null){ o[f]=d?n/d*100:0; any=true; } });
    out[c.key]=any?o:null; });
  return out;
}
/* 6部門の表をそろえて読む（無い部門は飛ばす）。手元ではサンプルへ落とさない（足し算に別のデータを混ぜない） */
const allPath_={
  byStore:(d)=>`c/by_store__${aslug(S.area)}__${dslug(d)}__${S.ym}__${s8(S.snap)}.json`,
  detail:(d,slug)=>`c/shohin_detail__${aslug(S.area)}__${dslug(d)}__${S.ym}__${s8(S.snap)}${slug?"__"+slug:""}.json`
};
function loadAllDepts_(pathOf){ return Promise.all(S.meta.departments.map(d=>loadJsonStrict(pathOf(d)).catch(e=>{ if(isNoFile(e)) return null; throw e; }))); }
/* 商品部全体 × 全部門: 行＝店（＋◆全店舗合計）・列＝いまと同じ指標 */
async function allByStore_(){
  const raw=await loadAllDepts_(allPath_.byStore);
  let parts=raw.map((p,i)=>p?Object.assign({},p,{dept:p.dept||S.meta.departments[i]}):null).filter(Boolean);
  if(!parts.length) throw new Error("未収載: 全部門の店の表");
  // 中分類を選んだ合計: 絞り込み中の部門は、その部門の設定で店の行を出し直してから足す（部門ごとに順に・読んだ表は覚える）
  const cxs={}, notes=[];
  for(let i=0;i<parts.length;i++){ const dp=parts[i].dept; if(catxOf_(dp).length){ parts[i]=await catxByStore_(parts[i],dp); const x=parts[i]._cx; if(x){ notes.push(x.note); if(x.label) cxs[dp]=x; } } }
  const cols=parts[0].columns, by={}, order=[], nul=Object.fromEntries(cols.map(c=>[c.key,null]));
  parts.forEach(p=>(p.rows||[]).forEach(r=>{ const k=r.store_full||r.store; if(!by[k]){ by[k]={store:r.store,store_full:r.store_full,label:r.label,list:[],ny:false,miss:false}; order.push(k); } by[k].list.push(r.cells); if(r._noYoy) by[k].ny=true; if(r._miss) by[k].miss=true; }));
  const rank=k=>{ const i=(S.stores||[]).findIndex(s=>s.full===k); return i<0?9999:i; };
  order.sort((a,b)=>rank(a)-rank(b));
  const cx=Object.keys(cxs);
  return {dept:"全部門",columns:cols,ym:parts[0].ym,
    rows:order.map(k=>({store:by[k].store,store_full:by[k].store_full,label:by[k].label,cells:by[k].miss?nul:sumCells_(by[k].list,cols),_noYoy:by[k].ny})),
    grand_total:{label:"◆ 全店舗合計（全部門）",cells:parts.some(p=>p._miss)?nul:sumCells_(parts.map(p=>(p.grand_total||{}).cells),cols),
      _noYoy:parts.some(p=>p.grand_total&&p.grand_total._noYoy),_mk:cx.length?catxMulti_(Object.fromEntries(cx.map(d=>[d,{label:cxs[d].label}]))):""},
    _cx:notes.length?{note:notes.join("")}:null};
}
/* 商品部詳細 × 全部門: 行＝部門（その下のカテゴリはたたむ）＋◆全部門合計。店（slug）かエリア合計（slug 無し） */
async function allDetail_(slug){
  const parts=(await loadAllDepts_(d=>allPath_.detail(d,slug))).filter(Boolean);
  if(!parts.length) throw new Error("未収載: 全部門の明細");
  const cols=parts[0].columns, dts=parts.flatMap(p=>p.dept_totals||[]);
  return {...parts[0], rows:parts.flatMap(p=>p.rows||[]), dept_totals:dts, _hidCats:parts.flatMap(p=>p._hidCats||[]),   // 抜いた愛知の分類の値（hideCats_）も部門ぶん合わせる
    grand_total:{label:"◆ 全部門合計",cells:sumCells_(dts.map(t=>t.cells),cols)}};
}
/* 全部門の画面で A・PD の欄の代わりに出す一言と、部門を選ぶ近道（押すとその部門の欄へ） */
function allDeptNote_(){
  const who=S.mode==="運営部詳細"?"運営部":"商品部";
  return `<div class="allnote"><span>✎ ${who}の A・PD は部門ごとです。部門を選ぶと、ここに出ます（書ける担当は、そのまま書けます）：</span>`+
    S.meta.departments.map(d=>`<button class="btn" data-go="cdept" data-a="${esc(d)}" data-k="n:${esc(d)}">${esc(d)}</button>`).join("")+`</div>`;
}

/* ══ 中分類を選んだ合計（2026-11-01・PO「惣菜でベーカリーの数字を含まない合計を見たい → どうせなら任意で選んだ中分類だけの合計を、全部門で」）══
   設定は部門に1つ（この PC・このアカウント＝hissuru_catx_<アカウント>）。覚えるのは「除く名前」＝あとの月に新しくできた中分類は、はじめから合計に入る。
   その部門の表はどれも同じ設定で出す: 商品部全体（店の行・◆全店舗合計）・商品部詳細（エリア合計・店）・運営部全体・運営部詳細（エリア合計・店）・
     店舗事業部会議・受払の表・全部門（計）（部門ごとに、その部門の設定で足す）。店舗用の入口・週間・仕入分析・会議用まとめには入れない（週間・仕入分析は一言）。
   数: 部門の計 − 除いた中分類（愛知の2分類など、表に出さない行の値は部門の計の中に残る＝いままでと同じ）。率は足した額から出し直す
     （c の表＝RATE_OF・sumCells_ と同じ／店舗事業部会議・受払＝jigyoRates_＝HQ の backend〈_jigyo_recalc_rates〉と同じ式・差損率は ÷売上）。
   新分類で分かれた組（SPLIT_GROUPS）の片方だけを入れ、前年が分かれていない月は、その合計の前年比を「—」（理由を表の下に1行）。
   名前は月で違う（旧分類・新分類）: その表にある名前だけを当てる（NFKC でそろえて）。表にある名前が全部「除く」になるときは、絞らない（全部 0 の表にしない）。
   絞っていることを読み違えないよう、同じ琥珀色の印を3か所に: 選ぶ欄の札・上の帯・合計の行の名前（＋表の下の1行と印刷の題）。合計に入れていない行は薄く。 */
const CATX_KEY_=()=>"hissuru_catx_"+(authedEmail||"local");
let _cxm={s:null,o:{}};
function catxObj_(){ const s=S.catx||"{}"; if(_cxm.s!==s){ let o={}; try{ o=JSON.parse(s)||{}; }catch(e){ o={}; } _cxm={s:s,o:o}; } return _cxm.o; }
/* いつも同じ字にする（履歴の比べ・覚える物を1つの形に）: 部門の名前順・名前の重なりなし・空の部門は持たない */
function catxStr_(o){ const r={}; Object.keys(o||{}).sort().forEach(d=>{ const a=[...new Set((Array.isArray(o[d])?o[d]:[]).map(String).filter(Boolean))].sort(); if(a.length) r[d]=a; }); return JSON.stringify(r); }
function catxSave_(){ try{ localStorage.setItem(CATX_KEY_(),S.catx||"{}"); }catch(e){} }
function catxLoad_(){ let o={}; try{ o=JSON.parse(localStorage.getItem(CATX_KEY_())||"{}")||{}; }catch(e){ o={}; } S.catx=catxStr_(o); }
function catxRaw_(dept){ return catxObj_()[dept]||[]; }
/* 当てる画面: 本部用の入口・累計・段の地図の4つと店舗事業部会議 */
function catxHere_(){ return S.viewMode!=="viewer"&&!!S.entered&&S.view==="cum"&&(TREE.includes(S.mode)||S.mode==="店舗事業部会議"); }
function catxOf_(dept){ return catxHere_()?catxRaw_(dept):[]; }
/* その表にある名前（present）のうち、除く物の Set。全部が「除く」になるときは空（絞らない） */
function catxEx_(dept,present){
  const x=catxOf_(dept); if(!x.length||!present.length) return new Set();
  const xs=new Set(x.map(nfk_)), ex=present.filter(n=>xs.has(nfk_(n)));
  return ex.length&&ex.length<present.length?new Set(ex):new Set();
}
const catxNames_=a=>a.length<=2?a.join("・"):a.slice(0,2).join("・")+" ほか"+(a.length-2);
/* 印の字: 除く物が少なければ「ベーカリーを除く」・入れる物が少なければ「温惣菜・米飯だけ」 */
function catxLabel_(present,ex){ if(!ex||!ex.size) return ""; const e=present.filter(n=>ex.has(n)), i=present.filter(n=>!ex.has(n)); return e.length<=i.length?catxNames_(e)+"を除く":catxNames_(i)+"だけ"; }
const catxMk_=t=>t?`<span class="catmk">（${esc(t)}）</span>`:"";
function catxMulti_(by){ const k=Object.keys(by); return k.length===1?k[0]+"は"+by[k[0]].label:k.join("・")+"は中分類を絞り込み中"; }
/* いま描いた表にある、部門ごとの中分類の名前と今年の売上（選ぶ欄の一覧・札の字に使う。表を描くたびに作り直す） */
const CXV={d:{}};
function cxReset_(){ CXV.d={}; }
function cxSeen_(dept,names,sales){ const o=CXV.d[dept]||(CXV.d[dept]={names:[],s:{}}); names.forEach(n=>{ if(!o.names.includes(n)) o.names.push(n); }); Object.keys(sales||{}).forEach(n=>{ if(o.s[n]==null) o.s[n]=sales[n]; }); }
/* 部門の計（cells）から、除いた中分類の額を引く。率は引いたあとの額から（RATE_OF）。前年・予算も同じ */
function catxSub_(base,exList){
  if(!base) return base;
  const F=["current","yoy","budget"], out={};
  Object.keys(base).forEach(k=>{ const b=base[k];
    if(!b||typeof b!=="object"||b.type==="rate"||RATE_OF[k]){ out[k]=b; return; }
    const o=Object.assign({},b);
    F.forEach(f=>{ if(b[f]==null) return; let s=b[f]; exList.forEach(cs=>{ const v=((cs||{})[k]||{})[f]; if(v!=null) s-=v; }); o[f]=Math.abs(s)<1e-6?0:s; });
    out[k]=o; });
  Object.keys(RATE_OF).forEach(k=>{ if(!(k in base)) return; const p=RATE_OF[k], o={type:"rate"}; let any=false;
    F.forEach(f=>{ const n=(out[p[0]]||{})[f], d=(out[p[1]]||{})[f]; if(n!=null&&d!=null){ o[f]=d?n/d*100:0; any=true; } });
    out[k]=any?o:null; });
  return out;
}
/* 中分類の明細を読む。いまの画面と同じ読み方（同じ覚え方）で読む＝あとで同じ表を開いたとき、もう一度は取りに行かない
   （全部門の画面＝allPath_ の厳しい読み方・部門の画面＝API.detail・API.detailStore） */
function cxDetail_(dept,slug,k){
  k=k||cxKey_();
  if(k.all) return loadJsonStrict(`c/shohin_detail__${aslug(k.area)}__${dslug(dept)}__${k.ym}__${s8(k.snap)}${slug?"__"+slug:""}.json`);
  return slug?API.detailStore(k.area,k.ym,k.snap,dept,slug):API.detail(k.area,k.ym,k.snap,dept);
}
/* 読み始めたときの見方。alive()＝その見方のまま（別の所が押されたら false＝残りは読まない・進み具合も書かない） */
function cxKey_(){ const n=NAV.seq, t=TBL.seq; return {area:S.area,ym:S.ym,snap:S.snap,all:isAll_(S.dept),alive:()=>NAV.seq===n&&TBL.seq===t}; }
const CX_STALE="__中分類の読み込みを止めた（見方が替わった）";
/* 店ごとの中分類の並びを1つに（その店に無い中分類は、前の中分類のすぐ後ろへ）＝作る側の並び（エリアの明細と同じ）を崩さない */
function cxMerge_(lists){ const out=[]; lists.forEach(l=>l.forEach((n,i)=>{ if(out.includes(n)) return; const at=i>0?out.indexOf(l[i-1])+1:0; out.splice(at,0,n); })); return out; }
const cxSum_=(list,k)=>list.reduce((t,cs)=>t+((((cs||{})[k]||{}).current)||0),0);
/* 新分類で分かれた組の片方だけを入れて、前年と比べられない組（その合計の前年比は「—」）。salesOf(名前) → {current, yoy} */
function catxPartial_(present,ex,salesOf){
  if(!ex||!ex.size) return [];
  const no=splitNoYoy(salesOf), out=[];
  SPLIT_GROUPS.forEach(g=>{ const m=g.members.filter(n=>present.includes(n)&&no.has(n)), inc=m.filter(n=>!ex.has(n)); if(inc.length&&inc.length<m.length) out.push(m); });
  return out;
}
/* 表の下の1行（部門ごと）: 合計に入れていない中分類とその額（千円）・すべてに戻す・前年比が「—」の理由 */
function catxNote_(items){
  const L=(items||[]).filter(Boolean); if(!L.length) return "";
  return L.map(x=>`<div class="catxnote"><span>✂ <b>${esc(x.dept)}</b>の合計に入れていない中分類：<b>${esc(x.ex.join("・"))}</b>（今年の売上 ${esc(kyen(x.s))}千円${x.g!=null?`・粗利 ${esc(kyen(x.g))}千円`:""}）</span>`+
    `<button type="button" class="btn catreset" data-catreset="${esc(x.dept)}" title="${esc(x.dept)}の中分類を、すべて合計に入れます">すべてに戻す</button>`+
    (x.part&&x.part.length?`<span class="lb" style="flex-basis:100%">前年比が「—」の合計は、新分類で分かれた中分類（${esc(x.part.map(m=>m.join("・")).join("／"))}）の片方だけを入れているためです（前年は分かれていないので比べられません）。</span>`:"")+
    (x.more||"")+`</div>`).join("");
}
/* 商品部詳細・運営部詳細（店）・全部門の明細（renderSection）: 部門ごとに出し直す */
function catxSection_(d){
  const by={}, items=[], allEx=[]; let any=false, ny=false;
  const dtMap={}; (d.dept_totals||[]).forEach(t=>dtMap[t.dept]=t);
  Object.keys(dtMap).forEach(dp=>{
    const rows=(d.rows||[]).filter(r=>r.dept===dp&&r.category!=null), names=rows.map(r=>r.category);
    const sales={}; rows.forEach(r=>sales[r.category]=((r.cells||{}).sales_month||{}).current);
    cxSeen_(dp,names,sales);
    const ex=catxEx_(dp,names); if(!ex.size) return;
    const exr=rows.filter(r=>ex.has(r.category)), exc=exr.map(r=>r.cells);
    const part=catxPartial_(names,ex,n=>{ const r=rows.find(z=>z.category===n); return r?((r.cells||{}).sales_month||null):null; });
    by[dp]={ex,label:catxLabel_(names,ex),cells:catxSub_(dtMap[dp].cells,exc),noYoy:part.length>0};
    exc.forEach(c=>allEx.push(c)); any=true; if(part.length) ny=true;
    items.push({dept:dp,ex:exr.map(r=>r.category),s:cxSum_(exc,"sales_month"),g:cxSum_(exc,"gross_profit_month"),part});
  });
  const grand=any&&d.grand_total?{cells:catxSub_(d.grand_total.cells,allEx),label:catxMulti_(by),noYoy:ny}:null;
  return {by,any,grand,note:catxNote_(items)};
}
/* 同時に読む本数。GAS の窓口はデプロイした人のアカウントで動く（同時に走る本数の上限 約30本を、使う人みんなで分ける）＝いまの全部門（6本）と同じにする */
const CX_POOL=6, CX_LOSS_TH=10;   // CX_LOSS_TH＝差損の印の線（HQ の INV_LOSS_ALERT_THRESHOLD と同じ 10%）
async function pool_(items,n,fn,onDone,alive){
  let i=0, done=0; const out=new Array(items.length);
  const work=async()=>{ while(i<items.length&&(!alive||alive())){ const k=i++; try{ out[k]=await fn(items[k],k); }catch(e){ out[k]={__err:e}; } done++; if(onDone&&(!alive||alive())) onDone(done,items.length); } };
  await Promise.all(Array.from({length:Math.min(n,items.length)},work));
  if(alive&&!alive()) throw new Error(CX_STALE);   // 見方が替わった（呼んだ所は、待っている間に押されたとして捨てる）
  return out;
}
/* 読んでいる間の印（選ぶ欄のすぐ右と、表がまだ無いときは表の場所にも）。i＝null で消す */
function cxProg_(i,n,dept){
  const p=$("catProg"), b=$("cxBodyProg"), t=i==null?"":`中分類を集めています${dept?"（"+dept+"）":""} ${i}/${n}`;
  if(p) p.innerHTML=t?`<span class="spin dark"></span>${esc(t)}`:"";
  if(b&&t) b.innerHTML=`<span class="spin dark"></span>${esc(t)}（はじめの1回だけ。読んだ表は5分覚えるので、あとはすぐ出ます）`;
}
/* 商品部全体（by_store・行＝店）: 店ごとに、その店の中分類の明細で出し直す。
   HQ が by_store の行に categories（中分類ごとの cells・alerts・inv）を足したら、それを使う（読み足し 0・自動で切り替わる）。
   無ければ、店の明細（c/shohin_detail__…__{店}）を CX_POOL 本ずつ並べて読む（読んだ表は5分覚える）。
   店の行の印: 粗利マイナスは絞った額で出し直す。差損は、中分類ごとの差損の額（inv）が届いたときだけ出し直す（無ければ出さない・表の下に一言） */
async function catxByStore_(d,dept){
  if(!d||!Array.isArray(d.rows)||!catxOf_(dept).length) return d;
  let per;
  if(d.rows.length&&d.rows.every(r=>Array.isArray(r.categories))) per=d.rows.map(r=>r.categories.filter(c=>c&&c.category!=null&&!isHiddenCat_(dept,c.category)));
  else {
    const slugs=d.rows.map(r=>slugOfFull_(r.store_full||"")), k=cxKey_();
    let res;
    try{
      res=await pool_(slugs,CX_POOL,s=>(s==null||s==="__total__")?Promise.resolve(null)
        :cxDetail_(dept,s,k).catch(e=>{ if(isNoFile(e)) return null; throw e; }),(i,n)=>cxProg_(i,n,k.all?dept:""),k.alive);
    } finally { if(k.alive()) cxProg_(null); }
    const er=res.find(p=>p&&p.__err); if(er) throw er.__err;
    per=res.map(p=>p?(p.rows||[]).filter(r=>r.category!=null&&(!r.dept||r.dept===dept)):null);
  }
  const names=cxMerge_(per.map(p=>(p||[]).map(c=>c.category))), sales={};
  per.forEach(p=>(p||[]).forEach(c=>{ sales[c.category]=(sales[c.category]||0)+((((c.cells||{}).sales_month)||{}).current||0); }));
  cxSeen_(dept,names,sales);
  if(!names.length) return Object.assign({},d,{_cx:{dept,label:"",note:`<div class="catxwarn">✂ この期間は${esc(dept)}の中分類の明細が無いため、中分類の絞り込みは効きません（部門全体の数）。</div>`}});
  const ex=catxEx_(dept,names); if(!ex.size) return d;
  const cols=d.columns||[], nul=Object.fromEntries(cols.map(c=>[c.key,null])), allEx=[], miss=[], catSum={};
  let inv=true;
  const rows=d.rows.map((r,i)=>{
    const p=per[i]; if(!p){ miss.push(r.label||r.store); return Object.assign({},r,{cells:nul,alerts:null,_miss:true}); }
    const exc=p.filter(c=>ex.has(c.category)), inc=p.filter(c=>!ex.has(c.category));
    exc.forEach(c=>allEx.push(c.cells));
    p.forEach(c=>{ const s=(c.cells||{}).sales_month||{}, o=catSum[c.category]||(catSum[c.category]={current:0,yoy:0}); o.current+=s.current||0; o.yoy+=s.yoy||0; });
    const cells=catxSub_(r.cells,exc.map(c=>c.cells));
    const part=catxPartial_(p.map(c=>c.category),ex,n=>{ const c=p.find(z=>z.category===n); return c?((c.cells||{}).sales_month||null):null; });
    const hasInv=p.length>0&&p.every(c=>c.inv&&c.inv.book_value!=null); if(!hasInv) inv=false;
    let lr=0, la=false;
    if(hasInv){ const lp=inc.reduce((t,c)=>t+(+c.inv.loss_price||0),0), bk=inc.reduce((t,c)=>t+(+c.inv.book_value||0),0); lr=bk?lp/bk*100:0; la=lr>CX_LOSS_TH; }
    const alerts={loss_rate:lr,loss_alert:la,gp_negative:(((cells.gross_profit_month||{}).current)||0)<0,inv_cost_zero:inc.some(c=>!!(c.alerts&&c.alerts.inv_cost_zero))};
    return Object.assign({},r,{cells,alerts,_noYoy:part.length>0});
  });
  const label=catxLabel_(names,ex), gpart=catxPartial_(names,ex,n=>catSum[n]||null);
  const gt=d.grand_total?Object.assign({},d.grand_total,{cells:miss.length?nul:catxSub_(d.grand_total.cells,allEx),_mk:label,_noYoy:gpart.length>0}):null;
  const more=(inv?"":`<span class="lb" style="flex-basis:100%">店の行の差損の印（粗利のマスの黄色）は、絞り込み中は出していません（中分類ごとの差損の額が届いていないため）。粗利マイナスの印は、絞った額で出しています。</span>`)+
    (miss.length?`<span class="lb" style="flex-basis:100%">中分類の明細が無い店（${esc(miss.join("・"))}）は出し直せないため、その店の行と ◆全店舗合計 は「—」です。</span>`:"");
  return Object.assign({},d,{rows,grand_total:gt,_miss:miss.length>0,
    _cx:{dept,label,note:catxNote_([{dept,ex:names.filter(n=>ex.has(n)),s:cxSum_(allEx,"sales_month"),g:cxSum_(allEx,"gross_profit_month"),part:gpart,more}])}});
}
/* 運営部詳細のエリア合計（by_dept・行＝部門・中分類が無い）: 絞り込み中の部門だけ、エリアの明細を1本ずつ読んで出し直す */
async function catxByDept_(d){
  if(!d||!Array.isArray(d.rows)) return d;
  const act=d.rows.filter(r=>r.dept&&catxOf_(r.dept).length); if(!act.length) return d;
  const k=cxKey_();
  let parts; try{ parts=await pool_(act,CX_POOL,r=>cxDetail_(r.dept,"",k).catch(e=>{ if(isNoFile(e)) return null; throw e; }),(i,n)=>cxProg_(i,n,""),k.alive); }
  finally { if(k.alive()) cxProg_(null); }
  const er=parts.find(p=>p&&p.__err); if(er) throw er.__err;
  const items=[], allEx=[], by={}; let any=false, ny=false;
  act.forEach((r,i)=>{
    const p=parts[i]; if(!p){ cxSeen_(r.dept,[],{}); return; }   // 明細が無い（絞れない）＝印も出さない
    const cats=(p.rows||[]).filter(z=>z.dept===r.dept&&z.category!=null), names=cats.map(z=>z.category);
    const sales={}; cats.forEach(z=>sales[z.category]=((z.cells||{}).sales_month||{}).current); cxSeen_(r.dept,names,sales);
    const ex=catxEx_(r.dept,names); if(!ex.size) return;
    const exr=cats.filter(z=>ex.has(z.category)), part=catxPartial_(names,ex,n=>{ const z=cats.find(q=>q.category===n); return z?((z.cells||{}).sales_month||null):null; });
    const cells=catxSub_(r.cells,exr.map(z=>z.cells));
    by[r.dept]={label:catxLabel_(names,ex),cells,noYoy:part.length>0,
      alerts:Object.assign({},r.alerts||{},{loss_rate:0,loss_alert:false,gp_negative:(((cells.gross_profit_month||{}).current)||0)<0})};   // 差損は中分類ごとの額が無いので出さない
    exr.forEach(z=>allEx.push(z.cells)); any=true; if(part.length) ny=true;
    items.push({dept:r.dept,ex:exr.map(z=>z.category),s:cxSum_(exr.map(z=>z.cells),"sales_month"),g:cxSum_(exr.map(z=>z.cells),"gross_profit_month"),part,
      more:`<span class="lb" style="flex-basis:100%">この部門の行の差損の印（粗利のマスの黄色）は、絞り込み中は出していません（中分類ごとの差損の額が届いていないため）。粗利マイナスの印は、絞った額で出しています。</span>`});
  });
  if(!any) return d;
  const rows=d.rows.map(r=>by[r.dept]?Object.assign({},r,{cells:by[r.dept].cells,alerts:by[r.dept].alerts,_mk:by[r.dept].label,_noYoy:by[r.dept].noYoy}):r);
  const gt=d.grand_total?Object.assign({},d.grand_total,{cells:catxSub_(d.grand_total.cells,allEx),_mk:catxMulti_(by),_noYoy:ny}):null;
  return Object.assign({},d,{rows,grand_total:gt,_cx:{note:catxNote_(items)}});
}
/* 運営部全体（行＝部門・中分類 × 列＝合計・店）: 部門の行を、合計の列と店の列ごとに出し直す（指標を替えても使い回す） */
function catxUneibu_(d){
  if(!(d._cxc&&d._cxc.k===S.catx)){
    const st=d.stores||[], info={}, seen=[]; let any=false;
    [...new Set(d.rows.filter(r=>r.type==="dept").map(r=>r.dept))].forEach(dp=>{
      const dr=d.rows.find(r=>r.type==="dept"&&r.dept===dp), cats=d.rows.filter(r=>r.type!=="dept"&&r.dept===dp), names=cats.map(r=>r.category);
      const sales={}; cats.forEach(r=>sales[r.category]=(((r.grand||{}).sales_month)||{}).current);
      seen.push([dp,names,sales]);
      const ex=catxEx_(dp,names); if(!ex.size) return;
      any=true;
      const exr=cats.filter(r=>ex.has(r.category));
      const so=col=>n=>{ const r=cats.find(z=>z.category===n); if(!r) return null; const c=col==null?(r.grand||{}):((r.stores||{})[col]||{}); return c.sales_month||null; };

/* 店舗事業部会議・受払の表の率（HQ の backend＝main.py D30AA838・JIGYO_AREA_RATES_V2 と同じ式・2026-11-08 から本番）。keys＝表の率の列。

   エリア合計の中分類の行（cat＝_jigyo_area_cat_rates）: 同じ式。ただし JG_CAT_NORATE の率（原価率）は計算しない（受払表の原本は原価率を出さない＝店の 0 の和＝0 のまま）。

const JG_CAT_NORATE={inventory_cost_rate:"エリア合計の中分類は、原価率を出していません"};   // 率の列 → 字の上に乗せたときの説明
function jigyoRates_(v,keys,cat){

  const R={gross_profit_rate_month:s?g("gross_profit_month")/s*100:0, discount_rate:s?g("discount_amount")/s*100:0, discard_rate:s?g("discard_amount")/s*100:0,
    purchase_margin_rate:pp?(1-g("purchase_cost_month")/pp)*100:0, inventory_loss_rate:s?g("inventory_loss_price")/s*100:0,

}
/* 6部門の■合計（PO 2026-11-09「■合計は6部門だけ・外は下に参考」）: 部門の行の額を足し、率は額から（jigyoRates_）。前年も足して、粗利率は額から */

  const y=add(yks,r=>r.yoy); if(has(r=>r.yoy,"gross_profit_rate_month")) y.gross_profit_rate_month=0;

/* 名前の無い部門・中分類（受払表の空の行＝<NULL>）は、生の字を出さない */

function jigyoYoyRates_(y){ const o=Object.assign({},y||{}); if(o.gross_profit_rate_month!=null){ const s=+o.sales_month||0; o.gross_profit_rate_month=s?(+o.gross_profit_month||0)/s*100:0; } return o; }

/* 店舗事業部会議・受払: 部門の行と ■合計 を出し直す（額は引く・率は jigyoRates_）。rows は率を出し直したあとの6部門の行・grand は6部門の■合計（renderJigyo） */

const TBL={seq:0};
function tblNav_(patch,coalesce){

  if(coalesce&&CXP.pushed){ Object.assign(S,patch); try{ history.replaceState({hissuru:Object.assign({},cur,{v:viewState_()})},""); }catch(e){} NAV.trail[d]=viewState_(); }

function goAttr_(g){ return g?` data-go="${esc(g.go)}" data-a="${esc(g.a||"")}" data-b="${esc(g.b||"")}" data-k="${esc(g.k||"")}" title="${esc(g.title||"")}"`:""; }

/* 運営部全体（逆ピボット 行=部門/カテゴリ \u00D7 列=店舗・指標選択） */
let _uneibu=null;

function drawUneibu(mkey){
  const d=_uneibu,col=d.columns.find(c=>c.key===mkey)||d.columns[0],st=d.stores||[];

  /* 全部門計（2026-10-16b）: いちばん上に。6部門の行の足し算（率は足した額から）＝商品部全体の全部門と同じ数。
     届いた表の下の合計の行は出さない（回によっては ＳＭ外・経費 など6部門の外の行を含むため）。
     6部門の外の行は、店舗事業部会議と同じ決まり（2026-11-09）: 表のいちばん下に区切りの1行「6部門の外（全部門合計に入れていない・参考）」を置き、

/* 事業部会議（18列2段＋前年比較3列） */
function cmpCell(cur,prev,isRate,hib,noYoy,estP,curMark){

/* opts.catx（本部用の入口・店舗事業部会議と受払の表はいつも渡す。渡さないときは届いた表のまま＝試験で前の版と比べるため）:

       区切りの1行「6部門の外（■合計に入れていない・参考）」を置いて落ち着いた字で出す（すべて 0 の行・部門は出さない・前年 0 は比べない）。表の下に1行。
     ③中分類を選んだ合計（catxJigyo_）。
   opts.onlyDept: その部門の行だけ（受払の表・商品部詳細）。■合計は出さない（部門の行が合計） */
function renderJigyo(d,opts){
  const o=opts||{}, cols=d.columns, cmp=d.compare||[]; const grp=[];
  const rk=cols.filter(c=>c.type==="rate").map(c=>c.key), ak=cols.filter(c=>c.type!=="rate").map(c=>c.key);

}

const BDAYS=25; let _shiire=null;

  const row=(r,g)=>{const c=calc(r);let pc="";if(c.tp>0){const rt=(r.purchase||0)/c.tp;pc=rt>1.1?"background:#ffe4e6":rt<0.9?"background:#e0f2fe":"background:#dcfce7";}

/* ── データの届き具合の知らせ（2026-11-02 PO「データが止まっているという警告は、常に出すのではなく、翌週の月曜日にアップロードされずにいた場合には
   日付を超えた火曜日からアラートを出す」「月末の月曜が翌月へ超える週は、翌月の10日頃の月末締めを待ってからのアップロードとなるため、この週でのアラートは
   出さなくて結構」「その代わり、週間の数字を計算するために、翌月の第1週は7日に満たなくても、必ずアップロードをする必要があることをアラート」）──
   ① 受払（月中）のアップロード忘れ（本部用・黄・#noticeUp）: 週＝月〜日。その日曜までの受払（05-4・月初からの累計）は、翌週の月曜にアップロードする
      （meta.json の snapshots[日曜の年月] に「日曜の日付235959」が入る）。日 T（日本の日付・サーバーの時計）には、T−2 日以前の最後の日曜 S の週から
      さかのぼって UP_WEEKS 週を見る（月曜はまだ前の週まで・火曜から先週の分を見る）。
      ・月をまたがない週（S の翌日が、週の月曜と同じ月）: S の受払が要る
      ・月をまたぐ週: 前の月の分は知らせない（翌月10日ごろの月末確定を待つ）。前の月の最後の日 E が S より前なら、新しい月の第1週（E+1〜S・7日未満）を
        必ず（S の受払を S の年月に）。月末確定と組み合わせて、月をまたぐ週の週間の動きを計算するため。E＝S（月末が日曜）なら何も要らない
      ・要る日曜は月末の日になることが無いので、05-2（月末確定）と 05-4 を日付で取り違えない
      ・エリアごとに見る（2026-11-02 三田さん「エリアごとに見る」）: meta.json に snapshots_by_area（エリアごとの、snapshots と同じ形の一覧・HQ が足す）があれば、
        エリアごとに判定し、届いていないエリアの名前を帯に出す。見るエリアは、直近3か月（今月・先月・先々月）に受払表が1本でも届いたエリア
        （ずっと上げていないエリアを、毎週出し続けない）。欄が無い間は、snapshots（エリアをまとめた一覧）で見る（どこかのエリアで届けば、その週は届いたとみなす）。
        エリアごとの一覧を別のファイル（snapshots/エリア__年月.json）で読むと、エリア×月の数だけ窓口の往復が増えるので読まない
      ・店舗用の入口には出さない（店舗の方はアップロードしない）。帯の言葉は、データ管理の画面の名前（⚙️ データ管理・📥 受払CSV 取込）にそろえる
   ② 本部 PC の取込・写しの止まり（管理者だけ・赤・#noticeCopy）: 生存の印＝ドライブの status.json の checked_at（本部 PC の取込が1〜2分ごとに書き、
      写し〔同期〕がドライブへ送る。取込が止まっても、写しが止まっても古くなる）。LIVE_STALE_H 時間（翌日＝24 時間・2026-11-02 三田さん）より古ければ出す。
      窓口の getDataFreshness が、いつも一緒に返す（statusCheckedAt・GAS は変えない・窓口の本数は増えない）。
      ・meta.json の時刻（データを作った時刻）では判定しない: アップロードが無い日が続くと、本部が動いていても古くなる
        （2026-11-02 の赤い帯はこれ。4日間アップロードが0本で、作り直す物が無かった＝HQ 11/02 09:44 の便）
      ・生存の印が読めないときだけ、meta.json が META_STALE_H 時間より古ければ出す（「止まっているとは限らない」と添える）
      ・店舗・ほかの方には出さない（することが無いため）。管理者かはサーバーに聞く（getMyRights・止まっているときだけ＝ふだんは窓口を増やさない）
   帯の id は noticeUp・noticeCopy（データ管理のアップロードの棒 #upBar と同じ名前にしない） */
const UP_WEEKS=5, LIVE_STALE_H=24, META_STALE_H=24;
const d8_=s=>new Date(Date.UTC(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8)));
const f8_=d=>d.toISOString().slice(0,10).replace(/-/g,"");
const addD_=(d,n)=>new Date(d.getTime()+n*864e5);
const mdOf_=d=>(d.getUTCMonth()+1)+"/"+d.getUTCDate();
/* 日 t8（yyyymmdd）に見る週（新しい順）。kind: week＝月をまたがない・first＝月をまたぐ週の新しい月の第1週・monthend＝月末が日曜（要る物なし） */
function upWeeks_(t8,n){
  const out=[], ym=d=>f8_(d).slice(0,6);
  let S=addD_(d8_(t8),-2); S=addD_(S,-S.getUTCDay());
  for(let k=0;k<(n||UP_WEEKS);k++,S=addD_(S,-7)){
    const M=addD_(S,-6), N=addD_(S,1);
    if(ym(N)===ym(M)) out.push({kind:"week",mon:f8_(M),sun:f8_(S),need:f8_(S)});
    else if(ym(S)!==ym(M)){ const F=d8_(ym(S)+"01"); out.push({kind:"first",mon:f8_(M),sun:f8_(S),need:f8_(S),first:f8_(F),days:Math.round((S-F)/864e5)+1,prevYm:ym(M)}); }
    else out.push({kind:"monthend",mon:f8_(M),sun:f8_(S),need:null});
  }
  return out;
}
/* 要るのに meta.json の snapshots に無い週（新しい順）＝エリアをまとめて見る */
function upMissing_(t8,snaps,n){ return upWeeks_(t8,n).filter(w=>w.need&&!(((snaps||{})[w.need.slice(0,6)])||[]).includes(w.need+"235959")); }
/* 見るエリア＝直近3か月（日 t8 の月・先月・先々月）に、受払表が1本でも届いたエリア（並びは order＝meta.areas の順） */
function upAreasActive_(t8,byArea,order){
  const T=d8_(t8), yms=[0,1,2].map(k=>f8_(new Date(Date.UTC(T.getUTCFullYear(),T.getUTCMonth()-k,1))).slice(0,6));
  const names=(order||[]).filter(a=>a in byArea).concat(Object.keys(byArea).filter(a=>!(order||[]).includes(a)));
  return names.filter(a=>yms.some(ym=>(((byArea[a]||{})[ym])||[]).length));
}
/* エリアごとに見る: 要るのに届いていない週と、そのエリア（新しい順・w.areas） */
function upMissingArea_(t8,byArea,order,n){
  const act=upAreasActive_(t8,byArea,order);
  return upWeeks_(t8,n).filter(w=>w.need).map(w=>Object.assign({},w,{areas:act.filter(a=>!((((byArea[a]||{})[w.need.slice(0,6)])||[]).includes(w.need+"235959")))})).filter(w=>w.areas.length);
}
/* どちらで判定するか: meta.json に snapshots_by_area（中身のある物）があればエリアごと（area）・無ければまとめて（all） */
function upJudge_(t8,meta,n){
  const by=meta&&meta.snapshots_by_area;
  if(by&&typeof by==="object"&&!Array.isArray(by)&&Object.keys(by).length) return {mode:"area",miss:upMissingArea_(t8,by,meta.areas,n)};
  return {mode:"all",miss:upMissing_(t8,(meta&&meta.snapshots)||{},n)};
}
/* 知らせの文（無ければ ""）。誰が（受払表をアップロードする方）→ 何を（どの週の受払表を・どこから）→ なぜ（週間の数字のため）。先週・先々週は、日 t8 の週から数える */
const UP_WHERE="「⚙️ データ管理」の「📥 受払CSV 取込」から";
function upBarHtml_(t8,miss,mode){
  if(!miss||!miss.length) return "";
  const at=w=>w.areas&&w.areas.length?esc(w.areas.join("・")):"";   // エリアごとに見たときの、届いていないエリア
  const T=d8_(t8), lastSun=f8_(addD_(T,-((T.getUTCDay()+6)%7)-1)), prevSun=f8_(addD_(d8_(lastSun),-7));
  const rng=w=>mdOf_(d8_(w.mon))+"〜"+mdOf_(d8_(w.sun));
  const lab=w=>w.sun===lastSun?`先週（${rng(w)}）`:w.sun===prevSun?`先々週（${rng(w)}）`:rng(w);
  const asc=miss.slice().sort((a,b)=>a.sun<b.sun?-1:1), wk=asc.filter(w=>w.kind==="week"), fi=asc.filter(w=>w.kind==="first");
  const parts=[`<b class="fbwho">受払表をアップロードする方へ：</b>`];

    const grp=[]; wk.forEach(w=>{ const k=at(w), g=grp.find(x=>x.k===k); if(g) g.w.push(w); else grp.push({k,w:[w]}); });
    grp.forEach(g=>parts.push(`<b>${esc(g.w.map(lab).join("・"))}の受払表（月中）が、${g.k?g.k+" で":""}まだ届いていません。</b>`));

  }
  fi.forEach(w=>{ const F=d8_(w.first), S=d8_(w.sun), m=F.getUTCMonth()+1, pm=+w.prevYm.slice(4);
    const r=w.days===1?mdOf_(F):mdOf_(F)+"〜"+mdOf_(S), where=wk.length?"同じ所から":UP_WHERE;
    parts.push((at(w)
      ?`<b>${m}月の第1週（${esc(r)}・${w.days}日分）の受払表（月中）が、${at(w)} でまだ届いていません。7日に満たなくても${where}アップロードしてください。</b>`
      :`<b>${m}月の第1週（${esc(r)}・${w.days}日分）の受払表（月中）を、7日に満たなくても${where}アップロードしてください。</b>`)+
      `<span>${pm}月の月末確定と組み合わせて、月をまたぐ週（${esc(rng(w))}）の週間の動きを計算するためです。</span>`); });
  // 補足（アップロードの直後も、取り込みが終わるまで残る）はホバーに（帯を1行に収めるため・同じファイルは送り直しても自動で除外される）
  const how=mode==="area"?"エリアごとに確かめています。":"エリアをまとめて確かめています（どこかのエリアで届けば、その週は届いたとみなす）。";
  return `<span>⚠️</span><span class="fbtxt" data-judge="${mode==="area"?"area":"all"}" title="${how}アップロードの直後は、取り込みが終わるまでこの表示が残ります（同じファイルを送り直しても、自動で除外されます）">${parts.join("")}</span>`;
}
/* 時刻 at から now まで何時間か（どちらも "yyyy-MM-dd HH:mm:ss"・日本時刻）。読めなければ null */
function hoursSince_(at,now){
  const p=v=>{ if(!v) return null; const t=new Date(String(v).replace(/-/g,"/")); return isNaN(t)?null:t.getTime(); };
  const a=p(at), b=p(now); return a==null||b==null?null:(b-a)/36e5;
}
/* 本部 PC の取込・写しが止まっているか（f＝getDataFreshness の返事）。止まっていなければ null。
   生存の印（statusCheckedAt）が読めれば、それだけで決める。読めないときだけ、データを作った時刻（metaUpdated）で（止まっているとは限らない） */
function liveJudge_(f,now){
  if(!f) return null;
  const hl=hoursSince_(f.statusCheckedAt,now);
  if(hl!=null) return hl>=LIVE_STALE_H?{kind:"live",at:f.statusCheckedAt,h:hl}:null;
  const hm=hoursSince_(f.metaUpdated,now);
  return hm!=null&&hm>=META_STALE_H?{kind:"meta",at:f.metaUpdated,h:hm}:null;
}
/* 知らせの文（管理者だけ）。誰が（管理者）→ 何を（本部PC の取込と写しを確かめる）→ なぜ（止まっている間はアップロードした物が出ない） */
function copyBarHtml_(j){
  if(!j) return "";
  const m=String(j.at).replace(/\//g,"-").match(/^\d{4}-(\d{2})-(\d{2}) (\d{1,2}):(\d{2})/), when=m?`${+m[1]}/${+m[2]} ${+m[3]}:${m[4]}`:String(j.at);
  const dur=j.h<24?`約${Math.floor(j.h)}時間`:`約${Math.floor(j.h/24)}日`;   // 24 時間からは日で（約1日）
  const head=j.kind==="live"
    ?`<b>（管理者だけに表示）本部PC の取込の印が ${esc(when)} から届いていません（${dur}）。</b>`
    :`<b>（管理者だけに表示）本部PC の取込の印（status.json）が読めません。データを作った時刻は ${esc(when)}（${dur}前）です。</b><span>アップロードが無い日が続くと古くなるので、止まっているとは限りません。</span>`;
  return `<span>🔴</span><span class="fbtxt">${head}<span>本部PC の取込と、ドライブへの写し（同期）が動いているかを、本部PC（HQ）に確かめてください。</span>`+
    `<span>止まっている間は、アップロードした受払表・予算が画面に出ません。</span></span>`;
}
/* 上の帯のすぐ下に出す・消す（id＝noticeUp／noticeCopy） */
function fbarSet_(id,html,cls){
  const old=$(id); if(old) old.remove();
  if(!html) return false;
  const bar=document.createElement("div"); bar.id=id; bar.className="fbar"+(cls?" "+cls:""); bar.setAttribute("role","status"); bar.innerHTML=html;
  const page=$("page"), next=id==="noticeUp"&&$("noticeCopy")?$("noticeCopy"):page;   // 並びは いつも 受払 → 写し
  if(page&&page.parentNode) page.parentNode.insertBefore(bar,next);
  return true;
}
function renderUpBar_(t8,meta){ if(S.viewMode==="viewer") return fbarSet_("noticeUp",""); const j=upJudge_(t8,meta); return fbarSet_("noticeUp",upBarHtml_(t8,j.miss,j.mode)); }

function jstNow_(){ return new Date(Date.now()+9*36e5).toISOString().slice(0,19).replace("T"," "); }   // サーバーの時刻が取れないときだけ（端末の時計を日本時刻に）

/* ══ 管理者だけ、店舗事業部会議のはじめの表を裏で先に取っておく（PO 2026-11-10「管理者でログインした人だけが、裏で先に作っておくように。BY や各部門担当が開くことは稀なので」）══

   だれ: 管理者かは、サーバーに聞く（getMyRights＝サーバーの ADMIN_EMAILS）。担当（役割）の選び方や、端末の記録では決めない。
     サーバーが「管理者ではない」と答えたアカウントには、この端末に印（30日・アカウントの SHA-256 の鍵）を残し、次から聞かない（BY・部門担当・店舗は往復を増やさない）。
     印は「聞かない」ためだけ＝消されても、サーバーに聞くだけ（先読みが走るのは、サーバーが管理者と答えたときだけ）。
   何を: いちばん新しい回（meta の先頭の年月・その期間の既定）・担当のエリアの、エリア合計の表を1本。メモリ（JCACHE・5分）にだけ置く（端末に保存しない）。
     押したときは、覚えた表を使う（往復 0）。取りに行っている途中に押したら、その返事を待って使う（2本にしない）。失敗したら黙って捨てる（押したとき、今までどおり取りに行く） */
const PF={started:false,p:null,key:""};
const NOTADMIN_DAYS=30, notAdminKey_=()=>"hissuru_notadmin_"+JGC.ah;
function notAdminMemo_(){ if(!JGC.ah) return false; try{ const t=+localStorage.getItem(notAdminKey_())||0; return t>0&&Date.now()-t<NOTADMIN_DAYS*864e5; }catch(e){ return false; } }
/* サーバーに管理者かを聞く（答えは、この端末の「管理者ではない」の印にも反映する） */
async function myRights_(){
  const r=await capi("getMyRights");
  if(JGC.ah&&r) try{ if(r.admin) localStorage.removeItem(notAdminKey_()); else localStorage.setItem(notAdminKey_(),String(Date.now())); }catch(e){}
  return r;
}
function adminPrefetch_(){
  if(PF.started||!S.entered||S.viewMode==="viewer"||!S.meta) return;
  PF.started=true;
  const area=(S.asg&&S.asg.area)||S.area, ym=(S.meta.year_months||[])[0]||"";
  if(!area||!ym) return;
  const idle=window.requestIdleCallback?(f=>window.requestIdleCallback(f,{timeout:4000})):(f=>setTimeout(f,1500));
  PF.p=new Promise(res=>idle(()=>res(adminPrefetchRun_(area,ym))));
}
async function adminPrefetchRun_(area,ym){
  try{
    if(notAdminMemo_()) return "notadmin(memo)";
    const r=await myRights_(); if(!(r&&r.admin)) return "notadmin";
    const sn=(ym===S.ym&&area===S.area&&S.snap)?S.snap:(((await API.snapshots(area,ym))||{}).default||"");
    if(!sn) return "nosnap";
    const [prod,sample]=jgPath_(area,ym,sn,""); PF.key=prod;

/* 移動は滑らせて、着いた所を光らせる（0.28〜0.65秒・動きを減らす設定では即座に） */
function stickyH_(){ const hd=document.querySelector("header"), nb=$("navbar"); return (hd?hd.offsetHeight:0)+(nb?nb.offsetHeight:0); }
function glideTo_(y,cb){
  y=Math.max(0,Math.min(Math.round(y),document.documentElement.scrollHeight-window.innerHeight));
  const y0=window.scrollY, dist=Math.abs(y-y0);
  let done=false;
  const off=()=>{ ["wheel","touchstart","keydown"].forEach(ev=>window.removeEventListener(ev,cancel)); };
  const finish=()=>{ if(done) return; done=true; off(); window.scrollTo(0,y); if(cb) cb(); };
  const cancel=()=>{ done=true; off(); };
  if(dist<4||matchMedia("(prefers-reduced-motion: reduce)").matches){ finish(); return; }
  const dur=Math.min(650,Math.max(280,dist*0.45)), t0=performance.now();
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  ["wheel","touchstart","keydown"].forEach(ev=>window.addEventListener(ev,cancel,{passive:true}));
  const step=now=>{ if(done) return; const p=Math.min(1,(now-t0)/dur); window.scrollTo(0,y0+(y-y0)*ease(p)); if(p<1) requestAnimationFrame(step); else finish(); };
  requestAnimationFrame(step); setTimeout(finish,dur+150);   // 画面が裏にあると合図が止まるので、時間切れの保険
}
function flash_(el){ if(!el) return; el.classList.remove("landed"); void el.offsetWidth; el.classList.add("landed"); setTimeout(()=>el.classList.remove("landed"),1700); }
function navToast_(msg){ const t=$("navtoast"); if(!t) return; t.textContent=msg; t.style.opacity=1; clearTimeout(t._h); t._h=setTimeout(()=>{ t.style.opacity=0; },1400); }

  if(top<w.scrollTop||top>w.scrollTop+w.clientHeight-hh-40) w.scrollTop=Math.max(0,top);
}

  }

/* 店舗事業部会議の表（前回の表を先に出す・PO 2026-11-10 案1）:
   ①覚えた表（管理者の先読みを含む）が届いていれば、それを出す（前回の表より新しい）

     取りに行けなかったら、前回の表のまま「更新できませんでした（前回の表です）」
   ③どちらも無ければ、今までどおり取りに行って出す。出した表は端末に覚える（jgcPut_） */
async function jigyoBody_(st){
  const [prod,sample]=jgPath_(S.area,S.ym,S.snap,st==="__total__"?"":st);
  const peek=jcPeek_("L|"+prod+"|"+sample), p=loadJson(prod,sample);
  const prev=peek==="done"?null:jgcGet_(prod);
  if(!prev){ const d=await p; jgcPut_(prod,d); return renderJigyo(d,{catx:true}); }
  p.then(d=>{ jgcPut_(prod,d); jgPrevDone_(prod,prev.d,d); },()=>jgPrevFail_(prod));
  return jgPrevBar_(prev.t)+renderJigyo(prev.d,{catx:true});
}
const jgWhen_=t=>{ const d=new Date(t), z=n=>String(n).padStart(2,"0"); return `${d.getMonth()+1}/${d.getDate()} ${z(d.getHours())}:${z(d.getMinutes())}`; };

function jgHere_(prod){ return S.mode==="店舗事業部会議"&&jgPath_(S.area,S.ym,S.snap,S.storeTab==="__total__"?"":S.storeTab)[0]===prod; }   // いまも同じ表を見ているか
function jgPrevDone_(prod,old,d){

/* サーバー（Code.gs）と同じ決まりの、手元だけのまね（店舗のアカウントの扱いは試験 test_code_gs.js で確かめる） */

/* 権限（入室担当 asg × いまの画面）。どこに書けるかは入口で選んだ担当で決める（PO 2026-10-14）。

function roleCanWriteHere_(){

function cKey(){

/* ── 週の並び ──
   ・「一つ前の週」はカレンダーではなく **実在するデータ期間（05-4）の並び** で決める
     → 週が抜けていれば飛ばして繋がり、月をまたいでつなぐ。後から週が追加されても、開き直せば常に正しい直前週を指す
   ・05-2（月末確定）は週に数えない（表示は、その月の最終週のまま・閲覧のみ）
   ・Sheets へ転記行を書かない（表示で解決）ので、「張り直し漏れ」という事故が原理的に起きない */
const SNAPS_CACHE={};
function prevYm_(ym){ const d=new Date(+String(ym).slice(0,4),+String(ym).slice(4,6)-2,1); return String(d.getFullYear())+String(d.getMonth()+1).padStart(2,"0"); }
async function snapsRaw_(area,ym){
  const k=area+"|"+ym; if(SNAPS_CACHE[k]) return SNAPS_CACHE[k];
  let src=null;
  if(area===S.area&&ym===S.ym&&S.snaps.length) src=S.snaps;             // 画面が既に持っている分を再利用（GAS往復なし）
  else { try{ src=(await API.snapshots(area,ym)).snapshots||[]; }catch(e){ src=[]; } }
  SNAPS_CACHE[k]=src; return src;
}
/* 週の途中の取り込み（PO 2026-11-02）: 05-4 のデータ期間が日曜でない（例: 10/31〈土〉を 11/1 を待たずに取り込んだ）とき、
   同じ週（月〜日）の後の 05-4（例: 11/1）が届いたら、その週の分として扱う＝週の並びから外し、そこに書いた A・PD は後の週に出す（ミラー）。
   シートの行は書き換えない（書いた週のまま残る・直すときもその行のキーで送る）。後の週がまだ無い間は、その日付のまま注意を出す */
function sun8_(s){ s=String(s); const d=new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8)); d.setDate(d.getDate()+(7-d.getDay())%7);
  return String(d.getFullYear())+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0"); }
async function closer_(area,snap8){
  const s=String(snap8||""); if(!/^\d{8}$/.test(s)) return null;
  const sun=sun8_(s); if(sun===s) return null;
  let best=null;
  for(const ym of [...new Set([s.slice(0,6),sun.slice(0,6)])]){
    (await snapsRaw_(area,ym)).forEach(o=>{ if(String(o.file_type||"")!=="05-4") return; const w=s8(o.snapshot);
      if(w>s&&w<=sun&&(!best||w>best.snap8)) best={snap8:w,ym:ym,snapshot:o.snapshot}; });
  }
  return best;
}
/* その月の週次（05-4）を古い順に {snap8, ym, snapshot}。同じ週の後の 05-4 が届いた「週の途中」の日付は入れない */
async function weekly_(area,ym){
  const seen={};
  const list=(await snapsRaw_(area,ym)).filter(o=>String(o.file_type||"")==="05-4").map(o=>({snap8:s8(o.snapshot),ym:ym,snapshot:o.snapshot}))
    .filter(w=>w.snap8&&!seen[w.snap8]&&(seen[w.snap8]=1)).sort((p,q)=>p.snap8<q.snap8?-1:1);
  const out=[];
  for(const w of list){ if(!(await closer_(area,w.snap8))) out.push(w); }
  return out;
}
/* 行の週を、届いた後の週に合わせる（表示だけ）。元のキーは kym・ksnap8 に残し、直す・済のときはそれで送る */
async function alignRows_(area,rows){
  const map={};
  for(const w of new Set(rows.map(r=>String(r.snap8||"")).concat(rows.map(r=>String(r.resolved_week||""))))){
    const c=await closer_(area,w); if(c) map[w]=c;
  }
  rows.forEach(r=>{
    const c=map[String(r.snap8||"")]; if(c){ r.kym=r.ym; r.ksnap8=r.snap8; r.ym=c.ym; r.snap8=c.snap8; }
    const rw=map[String(r.resolved_week||"")]; if(rw) r.resolved_week=rw.snap8;
  });
}
/* その週が月末確定(05-2)か。表示中の月に限らず判定できる */
async function isMonthEnd8_(area,ym,snap8){
  const hit=(await snapsRaw_(area,ym)).find(o=>s8(o.snapshot)===String(snap8));
  return !!hit&&String(hit.file_type||"")==="05-2";
}
/* 指定週より前の週次を「新しい順」に最大 n 件（月をさかのぼって集める。要る前の月は並べて先に読み、覚える）。
   月は、いまの月と前の5か月まで・前の月を3つ見て週が無くなったら打ち切り（GAS の _prevWeeks8_ と同じ） */
async function weeksBefore_(area,ym,snap8,n){
  const months=[ym]; for(let i=1;i<6;i++) months.push(prevYm_(months[i-1]));
  const have=(await weekly_(area,ym)).filter(w=>w.snap8<snap8).length;          // いまの月の分（多くは画面がもう持っている）
  await Promise.all(months.slice(1,1+Math.max(0,Math.min(5,Math.ceil((n-have)/4)))).map(m=>snapsRaw_(area,m)));   // 1か月に4〜5週
  const out=[];
  for(let g=0;g<months.length&&out.length<n;g++){
    const pool=(await weekly_(area,months[g])).filter(w=>w.snap8<snap8);
    for(let j=pool.length-1;j>=0&&out.length<n;j--) out.push(pool[j]);
    if(g>=3&&!pool.length) break;
  }
  return out;
}
function lbl8_(s){ return String(s).slice(4,6)+"/"+String(s).slice(6,8); }
function lblJa_(s){ return (+String(s).slice(4,6))+"月/"+(+String(s).slice(6,8))+"日"; }

/* ==== 週の組み立て（第3便）ここから ==== 画面（index.html）と GAS（Code.gs）に同じ文字のまま置く（試験 test_week_rule.js が、同じ文字か・同じ答えかを確かめる）
   ある場所（エリア・店・部門）の、ある欄の組（商品部＝A・PD／運営部＝UA・UPD）の、週 x の A・PD の表を、課題（issue_id）ごとに組み立てる。
   rows  … その場所の行（正本に並んだ順・消した行は入れない）。{snap8, section, item_id, issue_id, text, resolved, resolved_week, …}
   pair  … {a:"A", pd:"PD"} か {a:"UA", pd:"UPD"}
   prevW … x より前の週（05-4 のデータ期間の日付8桁。月をまたいで。05-2 は入れない）
   x     … 組み立てる週（05-4。月末確定〈05-2〉のときは、呼ぶ側がその月の最終週に置き換え、全欄を閲覧のみにする）
   決まり（PO 2026-10-16「1〜5 すべて A」）:
     出ている     … x より前に書き始め、「出す文」（いちばん新しい、字のある PD。無ければ A）の週が直近4週の中。済でないか、x で済
     今週生まれた … x に初めて字が書かれた課題
     済の報告     … 済にした週が、1つ前の週（w1）から x の前まで（A の表のいちばん下に1回・書けない・戻せる）
     出さない     … 済にした週が w1 より前／出す文が4週より前（履歴だけ。データは消さない）
   戻り値 {x, w1, live, born, report, warn, canWriteA}。並び＝書き始めた週の順、同じ週は正本の順 */
var PDCA_LOOKBACK = 4;
function pdcaWeek_(rows, pair, prevW, x) {
  x = String(x);
  var ws = [], seen = {};
  (prevW || []).forEach(function (w) { w = String(w); if (w < x && !seen[w]) { seen[w] = 1; ws.push(w); } });
  ws.sort();
  var w1 = ws.length ? ws[ws.length - 1] : "";
  var lim = ws.length ? ws[Math.max(0, ws.length - PDCA_LOOKBACK)] : x;
  var has = function (r) { return String(r.text == null ? "" : r.text).trim() !== ""; };
  var wk = function (r) { return String(r.snap8 == null ? "" : r.snap8); };
  var sec = function (r) { return String(r.section == null ? "" : r.section); };
  var nextOf = function (w) { for (var i = 0; i < ws.length; i++) if (ws[i] > w) return ws[i]; return x > w ? x : w + "+"; };   // x より後なら x より大きい値
  var resWeek = function (r) {        // 済にした週。移す前の行（済の週が空）は前の画面の決まりで読む: A の行＝その週・PD の行＝次の週
    if (!(r.resolved === true || String(r.resolved).toLowerCase() === "true")) return "";
    var w = String(r.resolved_week == null ? "" : r.resolved_week);

/* 場所（エリア・店・部門）の行を1回で読む（getCommentPlace）。need＝x より前に要る週の数（A・PD の欄＝5・履歴＝列の数＋4）。

  const mk=tr.querySelector(".cmmark"); if(mk) mk.textContent=MARKS[n-1]||String(n);
  const rs=tr.querySelector(".cmrs"); if(rs&&pl.o&&pl.o.res) rs.innerHTML=`<button type="button" class="btn cmres" data-cres="${esc(iss)}" data-on="1">✓ 済</button>`;
  tr.insertAdjacentHTML("afterend",cmNewRow_(pair_(),pl.o||{edA:false}));
  const nx=tr.nextElementSibling; if(nx) nx.querySelectorAll("textarea.cmcell").forEach(t=>{ t._pl=pl; });
}
function enqueueSave(id,pl){
  pl=pl||PL; const it=pl&&pl.rows.find(x=>x.item_id===id); if(!it) return;
  const key={ym:it.kym||it.ym,snap8:it.ksnap8||it.snap8,area:pl.area,store:pl.store,dept:pl.dept};   // 保存時点の場所・週を固定（後で画面を切り替えても正しい週へ書く）。週の途中の行は書いた週のキーのまま
  cmIndicator("saving","保存中…");
  saveQ=saveQ.then(async()=>{
    try{
      await capi("upsertComment",key,it.section,it.item_id,it.text,null,it.issue_id||"");   // 済は送らない（済・戻すは resolveComment）
      cmIndicator("ok","✓ 自動保存 "+new Date().toTimeString().slice(0,5));
    }catch(e){ cmIndicator("err","⚠ 保存失敗："+String(e&&e.message||e).slice(0,60)); }
  });
}
/* 消すのは、その欄（その週に書いた行）だけ。前の週の PD は消さない（PO 2026-10-16 Q5）。
   消した行はシートに印付きで残る（サーバーが消さずに印を付ける・記録も残る）。 */
function cDel(id){
  const pl=PL; if(!pl) return;
  const r=pl.rows.find(x=>x.item_id===id); if(!r) return;
  const lab=r.section===pair_().a?"A":"PD";
  if(!confirm(`この欄（${lab}・${lbl8_(r.snap8)} の週）を消します。\n前の週の PD は消えません（記録にも残ります）。よろしいですか？`)) return;
  pl.rows=pl.rows.filter(x=>x!==r);
  drawComments();
  saveQ=saveQ.then(async()=>{
    try{ await capi("deleteComment",id); toast("消しました（記録には残ります）"); }
    catch(e){ toast("消せませんでした："+String(e&&e.message||e).slice(0,40),true); if(PL===pl) renderComments(); }
