/* そのエリアに、月 pm の月末確定が届いているか（areas[].months）。届いていない月の問いは 0 ではなく「—（まだ）」と出す
   （0 と出すと「異常ではなかった」と取り違える）。months の無い 10/16 版の meta は分からないので、届いているとみる＝いままでどおり */
function wkAreaHasMonth_(area,pm){
  const a=(WK.meta.areas||[]).find(x=>x.area===area);
  if(!pm||!a) return true;
  if(Array.isArray(a.months)) return a.months.includes(pm);
  // months の無い 10/16 版の meta: いまのエリアは、エリアのファイルの月末確定（month）で分かる。ほかのエリアは分からないので、届いているとみる
  if(WK.A&&WK.A.area===area&&WK.A.month){ const m=WK.A.month[WK_AREA+"|"+WK_ALL]; return !!m&&m.some(x=>x.ym===pm); }
  return true;
}
function wkQPer_(qid){ return (wkQs_().find(x=>x.id===qid)||{}).per; }
/* 運営部全体の指標（週間）: 売上・粗利・粗利率・値引率・廃棄率のどれか（表の数字で選んだ額の指標は、売上に読み替える） */

function wkCount_(area,qid){
  const a=(WK.meta.areas||[]).find(x=>x.area===area); if(!a||!a.hit_counts) return null;
  const i=wkWi_(), pm=wkPeriodMonth_(), got=wkAreaHasMonth_(area,pm);
  if(qid&&!got&&wkQPer_(qid)==="m") return null;
  if(qid&&wkQPer_(qid)==="w"&&wkAreaHasWeek_(area,i)===false) return null;   // その週の受払がまだ（0 と言わない）
  return Object.entries(a.hit_counts).filter(([q])=>!qid||q===qid).reduce((t,[,v])=>t+((v.w||[])[i]||0)+((got&&pm&&v.m&&v.m[pm])||0),0);
}

function wkLastWeek_(s){ if(!s) return -1; for(let j=s.s.length-1;j>=0;j--) if(s.s[j]!=null) return j; return -1; }
function wkFirstWeek_(s){ if(!s) return -1; for(let j=0;j<s.s.length;j++) if(s.s[j]!=null) return j; return -1; }

  if(sm&&sm.end&&sm.end<W[i].start) return `<div class="note">この店・部門のこの週の数字はありません（閉店した店は、その週で表示を終えています。最後の回 ${wkMd_(sm.end)}）。</div>`;
  const s=wkSer_(st,dept), last=wkLastWeek_(s), first=wkFirstWeek_(s), wl=j=>`${wkMd_(W[j].start)}〜${wkMd_(W[j].end)}`;
  const sa=st!==WK_AREA?wkSer_(st,WK_ALL):null;   // 受払が上がっていない＝エリアか店の全部門に、その週の数字が無い

  if(i<first) return `<div class="note">${esc(subj)}は、この週の数字がありません（数字があるのは ${esc(wl(first))} の週から）。${go(first)}</div>`;
  let j=i-1; while(j>=0&&s.s[j]==null) j--;

    `<span class="k">差</span><span class="x ${gr!=null&&g4!=null?(gr>=g4?"up":"dn"):""}">${gr!=null&&g4!=null?wkFpt_(gr-g4):"—"}</span></div>`+

function wkInvWeek_(st,dept,i){

function wkAreaInvWeek_(dept,i){ return ((WK.A.inv||{})[WK_AREA+"|"+dept]||[]).filter(q=>q.ft==="05-4"&&wkWeekOf_(q.t)===i).pop()||null; }
function wkInvKpi_(st,dept){
  const i=wkWi_();

    }

/* ── 図の共通部品 ── */
function wkNice_(raw){ if(!(raw>0)) return 1; const p=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function wkBar_(x,y,w,h){ const r=Math.min(4,w/2,Math.abs(h)); if(Math.abs(h)<0.5) return `M${x} ${y}h${w}v0.5h${-w}z`;
  if(h>0) return `M${x} ${y+h}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+w-r}Q${x+w} ${y} ${x+w} ${y+r}V${y+h}Z`;
  const yb=y+h; return `M${x} ${y}V${yb-r}Q${x} ${yb} ${x+r} ${yb}H${x+w-r}Q${x+w} ${yb} ${x+w} ${yb-r}V${y}Z`; }
function wkFrame_(el,H,vmin,vmax,yfmt){
  const W=WK.meta.weeks, n=W.length, cw=el.clientWidth||900, narrow=cw<600;
  const Wd=narrow?Math.max(320,cw):Math.max(560,cw), mL=narrow?44:64, mR=narrow?8:14, mT=14, mB=44, pw=Wd-mL-mR, ph=H-mT-mB, sw=pw/n;
  let lo=Math.min(0,vmin), hi=Math.max(0,vmax); if(hi===lo) hi=lo+1;
  const step=wkNice_((hi-lo)/5), top=Math.ceil(hi/step)*step, bot=Math.floor(lo/step)*step;
  const y=v=>mT+ph-(v-bot)/(top-bot)*ph, x0=j=>mL+j*sw, wi=wkWi_();
  let g=`<svg viewBox="0 0 ${Wd} ${H}" role="img">`;
  for(let t=bot;t<=top+1e-9;t+=step) g+=`<line x1="${mL}" x2="${Wd-mR}" y1="${y(t)}" y2="${y(t)}" stroke="#e5e7eb"/><text x="${mL-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="#475569">${yfmt(t)}</text>`;
  g+=`<rect x="${x0(wi)}" y="${mT}" width="${sw}" height="${ph}" fill="#dbeafe" opacity=".7"/>`;
  let lastM=null; const every=narrow?4:2;
  W.forEach((w,j)=>{ const m=Number(w.end.split("-")[1]);
    if(j%every===(n-1)%every) g+=`<text x="${x0(j)+sw/2}" y="${H-mB+15}" text-anchor="middle" font-size="10.5" fill="#475569">${wkMd_(w.end)}</text>`;
    if(m!==lastM){ g+=`<text x="${x0(j)+2}" y="${H-mB+31}" font-size="11" font-weight="600" fill="#334155">${m}月</text><line x1="${x0(j)}" x2="${x0(j)}" y1="${H-mB+20}" y2="${H-mB+34}" stroke="#94a3b8"/>`; lastM=m; } });
  return {g,y,x0,sw,mT,ph,top,bot,end:()=>`<line x1="${mL}" x2="${Wd-mR}" y1="${y(0)}" y2="${y(0)}" stroke="#64748b" stroke-width="1.2"/>`};
}
function wkTip_(cx,cy,html){
  let t=$("wktip"); if(!t){ t=document.createElement("div"); t.id="wktip"; document.body.appendChild(t); }
  if(html==null){ t.style.display="none"; return; }
  t.innerHTML=html; t.style.display="block";
  const tw=t.offsetWidth, th=t.offsetHeight; let lx=cx+14, ly=cy+14;
  if(lx+tw>innerWidth-8) lx=cx-tw-14; if(ly+th>innerHeight-8) ly=cy-th-14;
  t.style.left=lx+"px"; t.style.top=ly+"px";
}
/* 週ごとの透明な帯: 指を当てると中身・押すとその週を選ぶ */
function wkHit_(F,el,tipFn){
  let g=""; for(let i=0;i<wkN_();i++) g+=`<rect class="wkhit" data-i="${i}" x="${F.x0(i)}" y="${F.mT}" width="${F.sw}" height="${F.ph}" fill="transparent" tabindex="0" style="cursor:pointer"/>`;
  return {svg:g, bind:()=>el.querySelectorAll("rect.wkhit").forEach(r=>{ const i=+r.dataset.i;
    r.addEventListener("mousemove",e=>wkTip_(e.clientX,e.clientY,tipFn(i)));
    r.addEventListener("mouseleave",()=>wkTip_(0,0,null));
    r.addEventListener("click",()=>{ wkTip_(0,0,null); if(i!==wkWi_()) wkSetWeek_(i,"wkc:trend"); });
    r.addEventListener("keydown",e=>{ if(e.key==="Enter"&&i!==wkWi_()) wkSetWeek_(i,"wkc:trend"); }); })};
}

/* ── 週の推移（売上・粗利・粗利率・値引率・廃棄率） ── */
function wkTrendHtml_(st,dept){

    :`<span><span class="ln" style="border-color:#2a78d6"></span>${WK_MLABEL[m]}</span><span><span class="ln" style="border-color:#eb6834"></span>4週の移動平均</span>`;

}
function wkDrawTrend_(st,dept){
  const el=$("wkchart"); if(!el) return;
  const s=wkSer_(st,dept); if(!s){ el.innerHTML=`<div class="note">この店・部門の数字はありません。</div>`; return; }
  const m=S.wmetric, n=wkN_(), vals=[], ma=[], py=[];
  for(let i=0;i<n;i++){ vals.push(wkMv_(s,i,m)); ma.push(wkMa4_(s,i,m)); py.push(m==="s"?s.py[i]:null); }
  const monR=((WK.A.month||{})[st+"|"+dept]||[]).map(r=>({ym:r.ym,r:r.s?r.g/r.s*100:null})).filter(r=>r.r!=null);
  const all=[...vals,...ma,...py].filter(v=>v!=null); if(m==="gpr") monR.forEach(r=>all.push(r.r));
  const fmt=wkIsRate_(m)?(t=>t.toFixed(0)):(t=>Math.round(t/1000).toLocaleString("ja-JP"));
  const F=wkFrame_(el,300,Math.min(...all,0),Math.max(...all,wkIsRate_(m)?1:10000),fmt);
  let g=F.g+`<defs><pattern id="wkhatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#2a78d6" stroke-width="2"/></pattern></defs>`;
  const wi=wkWi_();
  if(m==="s"||m==="g"){
    vals.forEach((v,i)=>{ if(v==null) return; const bw=Math.max(3,F.sw*0.62), bx=F.x0(i)+(F.sw-bw)/2, y0=F.y(0), y1=F.y(v);
      let fill="#2a78d6", extra="";
      if(m==="s"&&(s.sp[i]>0||s.days[i]<7)) fill="#9ec5f4";
      if(m==="g"){ const c=s.gc[i]; fill=c==="M"?"#9ec5f4":(c==="E"||c==="P")?"url(#wkhatch)":"#2a78d6"; if(c==="E"||c==="P") extra=` stroke="#2a78d6" stroke-dasharray="3 2"`; }
      if(i===wi&&fill==="#2a78d6") fill="#1c5cab";
      g+=`<path d="${wkBar_(bx,Math.min(y0,y1),bw,v>=0?(y0-y1):-(y1-y0))}" fill="${fill}"${extra}/>`; });
  } else {
    if(m==="gpr") monR.forEach(r=>{ const idx=WK.meta.weeks.map((w,j)=>j).filter(j=>WK.meta.weeks[j].end.slice(0,7).replace("-","")===r.ym); if(!idx.length) return;
      const xa=F.x0(idx[0]), xb=F.x0(idx[idx.length-1])+F.sw, yy=F.y(r.r);
      g+=`<line x1="${xa}" x2="${xb}" y1="${yy}" y2="${yy}" stroke="#334155" stroke-width="3" opacity=".75"/><text x="${xb-2}" y="${yy-5}" text-anchor="end" font-size="10.5" fill="#334155" paint-order="stroke" stroke="#fff" stroke-width="3">${wkYm_(r.ym)} 確定 ${r.r.toFixed(1)}%</text>`; });
    let pen=null;
    vals.forEach((v,i)=>{ if(v==null){ pen=null; return; } const px=F.x0(i)+F.sw/2, pyy=F.y(v);
      if(pen) g+=`<line x1="${pen.x}" y1="${pen.y}" x2="${px}" y2="${pyy}" stroke="#2a78d6" stroke-width="2"${m==="gpr"&&(s.gc[i]==="E"||s.gc[i]==="P")?' stroke-dasharray="5 4"':""}/>`;
      pen={x:px,y:pyy}; });
    vals.forEach((v,i)=>{ if(v==null) return; const px=F.x0(i)+F.sw/2, pyy=F.y(v), c=s.gc[i];
      if(m==="gpr"&&c==="M") g+=`<circle cx="${px}" cy="${pyy}" r="4" fill="#fff" stroke="#2a78d6" stroke-width="2"/>`;
      else if(m==="gpr"&&(c==="E"||c==="P")) g+=`<rect x="${px-4}" y="${pyy-4}" width="8" height="8" fill="#fff" stroke="#2a78d6" stroke-width="1.6" stroke-dasharray="2 1.5" transform="rotate(45 ${px} ${pyy})"/>`;
      else g+=`<circle cx="${px}" cy="${pyy}" r="${i===wi?5:4}" fill="#2a78d6" stroke="#fff" stroke-width="1.5"/>`; });
  }
  const ln=(arr,col,dash)=>{ let d="",on=false; arr.forEach((v,i)=>{ if(v==null){ on=false; return; } d+=(on?"L":"M")+(F.x0(i)+F.sw/2).toFixed(1)+" "+F.y(v).toFixed(1); on=true; });
    return d?`<path d="${d}" fill="none" stroke="${col}" stroke-width="2"${dash?' stroke-dasharray="5 4"':""} stroke-linejoin="round"/>`:""; };
  g+=ln(py,"#1baf7a",true)+ln(ma,"#eb6834",false)+F.end();

function wkSym_(p){
  if(!p) return `<span class="sym none" title="回なし">·</span>`;
  if(p.ft==="05-2") return `<span class="sym me" title="月末確定（実地棚卸）">◆</span>`;
  if(!p.st) return `<span class="sym none" title="棚卸を見るカテゴリが無い（委託・テナントだけ）">–</span>`;
  if(p.st==="入っている") return `<span class="sym ok" title="入っている">●</span>`;
  if(p.st==="一部") return `<span class="sym part" title="一部">◐</span>`;
  return `<span class="sym none" title="入っていない">○</span>`;
}

function wkLossTable_(dept){
  const am=wkAreaMeta_(), months=[...new Set(Object.values(WK.A.inv||{}).flat().filter(p=>p.ft==="05-2"&&p.t>=WK.meta.weeks[0].start).map(p=>p.t.slice(0,7).replace("-","")))].sort();

function wkDrawInv_(st,dept){
  const el=$("wkinv"); if(!el) return;
  const pts=((WK.A.inv||{})[st+"|"+dept]||[]).filter(p=>p.t>=WK.meta.weeks[0].start);
  const W=WK.meta.weeks;
  const xOf=(F,t)=>{ const j=wkWeekOf_(t), ws=new Date(W[j].start+"T00:00:00"), d=new Date(t+"T00:00:00"); return F.x0(j)+((d-ws)/864e5+0.5)/7*F.sw; };
  const kf=t=>Math.round(t/1000).toLocaleString("ja-JP");
  if(wkBook_().includes(dept)){
    const F=wkFrame_(el,240,0,Math.max(...pts.map(p=>p.book||0),10000),kf);
    let g=F.g, d="";
    pts.forEach(p=>{ d+=(d?"L":"M")+xOf(F,p.t).toFixed(1)+" "+F.y(p.book||0).toFixed(1); });
    g+=`<path d="${d}" fill="none" stroke="#2a78d6" stroke-width="2"/>`;
    pts.forEach(p=>{ const x=xOf(F,p.t), y=F.y(p.book||0); g+=p.ft==="05-2"?`<path d="M${x} ${y-6}L${x+6} ${y}L${x} ${y+6}L${x-6} ${y}Z" fill="#0f172a"/>`:`<circle cx="${x}" cy="${y}" r="3" fill="#2a78d6"/>`; });
    el.innerHTML=g+F.end()+`</svg>`;
    const el2=$("wkloss"), me=pts.filter(p=>p.ft==="05-2"), lv=me.map(p=>-(p.loss||0));
    const F2=wkFrame_(el2,180,Math.min(...lv,-10000),Math.max(...lv,10000),kf);
    let g2=F2.g;
    me.forEach(p=>{ const v=-(p.loss||0), x=xOf(F2,p.t), bw=Math.max(8,F2.sw*0.5), y0=F2.y(0), y1=F2.y(v);
      g2+=`<path d="${wkBar_(x-bw/2,Math.min(y0,y1),bw,v>=0?(y0-y1):-(y1-y0))}" fill="${v<0?"#c62828":"#1565c0"}"/><text x="${x}" y="${v<0?y1+13:y1-4}" text-anchor="middle" font-size="11" fill="#334155">${v<0?"差損 "+WK_MINUS:"差益 +"}${Math.round(Math.abs(v)/1000).toLocaleString()}</text>`; });
    el2.innerHTML=g2+F2.end()+`</svg>`;
    return;
  }
  const F=wkFrame_(el,240,0,Math.max(...pts.map(p=>p.v||0),10000),kf);
  let g=F.g, d="";
  pts.forEach(p=>{ if(p.v>0&&(p.ft==="05-2"||p.st==="入っている")) d+=(d?"L":"M")+xOf(F,p.t).toFixed(1)+" "+F.y(p.v).toFixed(1); });
  g+=`<path d="${d}" fill="none" stroke="#2a78d6" stroke-width="1.5" opacity=".6"/>`;
  pts.forEach(p=>{ const x=xOf(F,p.t), y=F.y(p.v||0);
    if(p.ft==="05-2") g+=`<path d="M${x} ${y-6}L${x+6} ${y}L${x} ${y+6}L${x-6} ${y}Z" fill="#0f172a"><title>${wkMd_(p.t)} 月末確定 ${wkK_(p.v)}千円</title></path>`;
    else if(p.st==="入っている") g+=`<circle cx="${x}" cy="${y}" r="4.5" fill="#2a78d6"><title>${wkMd_(p.t)} ${wkK_(p.v)}千円</title></circle>`;
    else if(p.st==="一部") g+=`<circle cx="${x}" cy="${y}" r="4" fill="#fff" stroke="#2a78d6" stroke-width="2"><title>${wkMd_(p.t)} 一部 ${wkK_(p.v)}千円・0: ${esc(p.miss||"")}</title></circle>`;
    else if(p.st){ const yb=F.y(0)-7; g+=`<path d="M${x-4} ${yb-4}L${x+4} ${yb+4}M${x+4} ${yb-4}L${x-4} ${yb+4}" stroke="#94a3b8" stroke-width="2"><title>${wkMd_(p.t)} 入っていない（0）</title></path>`; } });
  el.innerHTML=g+F.end()+`</svg>`;
}

  const fixN=hits.filter(x=>String(x.src||"").includes("人が補った")).length;
  const tail=(others.length?`${others.join("・")}は当たり 0（この期間は、この決まりでは異常ではなかった）。`:"")+(fixN?`当たりのうち ${fixN} か所は、9/8 の抜けを人が補った受払表の週（元の表で確かめてから判断）。`:"");
  const top=(arr,key)=>{ const c={}; arr.forEach(x=>{ const v=key(x); c[v]=(c[v]||0)+1; }); return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>`${e[0]} ${e[1]}`).join("・"); };
  const sn=slug=>wkStoreName_(slug), i=wkWi_(), pm=wkPeriodMonth_();
  if(q.id==="inv_week"){
    let n=0, ok=0, first=false;
    wkAreaMeta_().stores.forEach(s=>wkFresh_().forEach(d=>{ const x=wkInvWeek_(s.slug,d,i); if(!x) return; if(x.nth===1){ first=true; return; } n++; if(x.st==="入っている") ok++; }));
    if(first&&!n) return {now:`この週の回（${wkMd_(WK.meta.weeks[i].end)}）は月の最初の回で、どの店も生鮮の棚卸原価が入っていない（7月から毎月同じ＝店の入れ忘れではなく、仕組みの側の事情と見られる・推測）。`,next:"ひとつ前の週を選んで見る。",why:"月の最初の回に棚卸が無いと、月初の週の粗利は、次に棚卸の入った回まで確定しない。"};
    return {now:`${esc(S.area)}の生鮮 ${n} 店×部門のうち、入っている ${ok}・入っていない ${hits.filter(x=>x.k==="なし").length}・一部 ${hits.filter(x=>x.k==="一部").length}。部門ごと: ${esc(top(hits,x=>x.d))||"—"}。${tail}`,
      next:"入っていない店×部門に、週の棚卸をする運用か（月末だけにするか）を確かめる。一部の店は、0 のカテゴリ（新分類で分かれた冷惣菜・刺身・柵・その他精肉など）にも入れる。",
      why:"棚卸の入った回までの粗利は、受払の式でそのまま確定する。入っていない週の粗利は暫定（直近の確定の率 × 売上）になり、その週の売り方の工夫や値下げが粗利に見えない。"};
  }
  if(q.id==="inv_month"){ const longN=hits.filter(x=>(x.n||1)>=3).length;
    return {now:`${hits.length} か所（うち ${longN} か所は3か月以上続けて 0）。部門ごと: ${esc(top(hits,x=>x.d))||"—"}。${tail}`,
      next:"続けて 0 の所は、在庫を持たない売場（委託・テナント）かを確かめる（そうなら外す一覧に足す）。今月だけの所は、入力の漏れかを店に聞く。",
      why:"月末に棚卸原価が 0 だと、その月の在庫が無いものとして粗利が出る（確定の粗利が実際より低くなる）。続けて 0 なのは運用の型の合図で、入力漏れとは打ち手が違う。"}; }
  if(q.id==="inv_odd") return {now:`週 ${hits.filter(x=>x.k==="週").length} か所・月末 ${hits.filter(x=>x.k==="月末").length} か所。店ごと: ${esc(top(hits,x=>sn(x.s)))||"—"}。${tail}`,
      next:"当たった店×部門で、数えた日・数・単価の打ち間違いが無いかを確かめる。同じ店が何週も続けて当たるなら、数え方（時刻・範囲）を、ほかの店とそろえる。",
      why:"棚卸の数がずれると、その週と次の週の粗利が逆向きにずれる（足すと元に戻る）。続けて当たるのは数え方の癖の合図で、粗利の判断を誤らせる。"};
  if(q.id==="loss") return {now:`差損 ${hits.filter(x=>x.k==="差損").length} か所・差益 ${hits.filter(x=>x.k==="差益").length} か所（${pm?wkYm_(pm):""}）。カテゴリ: ${esc(top(hits,x=>x.c))||"—"}。${pm&&pm.endsWith("09")&&pm.startsWith("2026")?"9月は分類の切替の月で、帳簿がカテゴリの間を動いた分が混じる見込み（推測）。":""}${tail}`,
      next:"差損の大きいカテゴリから、値下げ・値引きの登録漏れと、破損・廃棄の記録を確かめる。差益は、数えすぎと仕入の計上漏れを確かめる。",
      why:"売価で在庫を持つ部門では、登録しなかった値下げも差損に出る。中身（登録漏れ・破損・万引き）が分かれば、ロスの打ち手（登録の徹底・陳列・発注）に分けられる。"};
  if(q.id==="missing") return {now:`${hits.length} か所。種類: ${esc(top(hits,x=>x.k))||"—"}。${tail}`,
      next:"欠け（回・店・カテゴリの行が無い）は、受払表の取り込みを確かめる（データの側）。0 や半分未満は、店に事情（休業・売場の改装・入力の漏れ）を聞く。",
      why:"欠けのまま差を取ると、その週が少なく、次の週が多く出る。欠けと 0 を分けると、データを直すのか、店に聞くのか、行き先が分かれる。"};
  if(q.id==="jump") return {now:`${hits.length} か所（値引き ${hits.filter(x=>x.k==="値引き").length}・廃棄 ${hits.filter(x=>x.k==="廃棄").length}）。部門ごと: ${esc(top(hits,x=>x.d))||"—"}。${tail}`,
      next:"まず、催事・特売の週か（狙った値引きか）を確かめる。狙っていない値引き・廃棄なら、入荷の量と見切りの時刻を、うまくいっている店のやり方と比べる。",
      why:"値引きは売り切るための手段で、多いこと自体が悪いとは限らない。狙った値引きか、売れ残りの値引きかで、次の手（発注を減らす・売り方を変える）が変わる。"};
  if(q.id==="neg") return {now:`${hits.length} か所（売上 ${hits.filter(x=>x.k.startsWith("売上")).length}・値引き ${hits.filter(x=>x.k.startsWith("値引き")).length}）。${tail}`,
      next:"前の週と足して打ち消しになっていれば、付け替え（実際の動き）なので、そのままでよい。打ち消しが無ければ、入力の誤りかを確かめる。",
      why:"マイナスの週をそのまま平均に入れると、ふだんの線（前4週の平均）がずれ、次の週が「急に増えた」に見える。"};
  return {now:`${hits.length} か所。部門ごと: ${esc(top(hits,x=>x.d))||"—"}。${tail}`,
    next:"まず、原価割れの特売（集客の目玉）だったかを確かめる。そうでなければ、仕入の単価・数量と月末の棚卸を確かめる。",
    why:"原価割れの特売は、粗利を削ってお客を呼ぶ手段で、悪いとは限らない（粗利を確かめてから続けるかを決める）。意図していない原価割れは、仕入か棚卸の誤り。"};
}
function wkTermsHtml_(){
  return `<details class="wk-card wkterms"><summary>ことば（週の数字・粗利の確定と暫定・棚卸）</summary><dl class="terms">`+
    `<div><dt>週の数字</dt><dd>受払表（05-4）は月初からの累計。前の回との差が、その週の数字（日曜締め）。月をまたぐ週は前月の月末確定とつなぐ。</dd></div>`+
    `<div><dt>週の粗利（確定）</dt><dd>受払の式（売上 −〔週の始めの在庫＋仕入 − 週の終わりの在庫〕）。月初の在庫は前の月末の実地棚卸。棚卸の入った回までは、月初からの粗利が確定する。</dd></div>`+
    `<div><dt>確定（まとめて）</dt><dd>回と回の間に棚卸が無い週は、棚卸の入った回までの合計（確定）を、売上の割合で週に割り振る。月末確定が届いた月も同じ。月の合計は月末確定の粗利と合う。</dd></div>`+
    `<div><dt>暫定</dt><dd>最後の棚卸の回より後の週。カテゴリの直近の確定の粗利率 × その週の売上。棚卸が入るか、月末確定が届くと替わる。</dd></div>`+
    `<div><dt>委託・テナント</dt><dd>生産者・テナント・生花など。在庫を持たず、売上に対して率が決まっている。週ではいつも率で当てる（仕入原価は月末にまとめて入る）。</dd></div>`+
    `<div><dt>棚卸が入っている</dt><dd>その回に、売上の9割以上を占めるカテゴリの棚卸原価が 0 でない。売上の無いカテゴリは外し、月の売上10万円未満のカテゴリは見ない。店の一覧は持たず、データで決まる。</dd></div>`+
    `<div><dt>差損・差益</dt><dd>帳簿 − 実施。正＝差損（帳簿より少ない）・負＝差益。日配・グロッサリー（売価で在庫を持つ部門）だけにある。</dd></div>`+
    `<div><dt>前4週の平均・4週の移動平均・前年同週</dt><dd>前4週の平均＝選んだ週の前の4週（今週と同じ範囲の店×カテゴリ）。4週の移動平均＝今週を含む4週。前年同週＝364日前の週（前年の月末確定を日数で割った推定）。</dd></div>`+
    `</dl></details>`;
}
