/* 済・戻す（課題ごと）。済＝その週の A に出している行に「この週に済」。戻す＝その課題の済を外す（済の週と済の報告の週だけ出る） */
function cResolve(iss,flag){
  const pl=PL; if(!pl||!canResolve_()) return;
  const v=cmView_(), it=v.live.concat(v.born,v.report).find(o=>o.key===iss); if(!it) return;
  const row=flag?it.target:(it.holder||it.target); if(!row) return;
  const P=pair_(), x=pl.x;
  pl.rows.forEach(r=>{ if((r.section===P.a||r.section===P.pd)&&(r.issue_id||r.item_id)===iss){ r.resolved=false; r.resolved_at=""; r.resolved_week=""; } });
  if(flag){ row.resolved=true; row.resolved_week=x; }
  drawComments();
  const key={ym:row.kym||row.ym,snap8:row.ksnap8||row.snap8,area:pl.area,store:pl.store,dept:pl.dept};
  cmIndicator("saving","保存中…");
  saveQ=saveQ.then(async()=>{
    try{ await capi("resolveComment",key,row.section,row.item_id,flag,x); cmIndicator("ok",(flag?"✓ 済にしました ":"戻しました ")+new Date().toTimeString().slice(0,5)); }
    catch(e){ cmIndicator("err","⚠ 保存失敗："+String(e&&e.message||e).slice(0,60)); if(PL===pl) renderComments(); }
  });
}

/* ── 🕘 週ごとの履歴（課題 × 週。直近8週・右がいまの週）──
   列ごとに同じ決まり（pdcaWeek_）で組み立て直し、その週の課題の様子を印にする（✎ 書いた／○ A に出ていた／✅ 済にした週／☑ 済の報告）。
   開く・閉じる・週を押して移るは「← ひとつ前に戻る」に積む（ブラウザの戻るも同じ）。読み足しが要るときだけ GAS へ行く。 */
function histCols_(){
  const all=[PL.xw].concat(PL.weeks);            // 新しい順
  return all.slice(0,HIST.span).map((w,i)=>({w:w,prev:all.slice(i+1).map(o=>o.snap8)})).reverse();
}
function histData_(){
  const P=pair_(), cols=histCols_(), byKey={}, order=[];
  cols.forEach((c,j)=>{
    const v=c.v=pdcaWeek_(PL.rows,P,c.prev,c.w.snap8);
    const put=(it,g,pos)=>{ if(!byKey[it.key]){ byKey[it.key]={key:it.key,birth:it.birth,head:it.head,cells:{}}; order.push(it.key); } byKey[it.key].cells[j]={g:g,it:it,pos:pos}; };
    v.live.forEach((it,p)=>put(it,"live",p)); v.born.forEach((it,p)=>put(it,"born",v.live.length+p)); v.report.forEach((it,p)=>put(it,"report",p));
  });
  // 並び: いまの週（右端）で出ている課題 → 済の報告 → ほか（新しく動いた順）
  const last=cols.length-1;
  const rank=k=>{ const c=byKey[k].cells[last]; return c?(c.g==="report"?1:0):2; };
  const seen=k=>Math.max.apply(null,Object.keys(byKey[k].cells).map(Number));
  order.sort((p,q)=>rank(p)-rank(q)||(rank(p)<2?byKey[p].cells[last].pos-byKey[q].cells[last].pos:(seen(q)-seen(p)||(byKey[q].birth>byKey[p].birth?1:-1))));
  return {cols:cols,rows:order.map(k=>byKey[k])};
}
function histMark_(cell){
  if(!cell) return "";
  if(cell.g==="report") return "☑";
  if(cell.it.here) return "✅";
  if(cell.g==="born") return "✎";
  return cell.it.pdRows.some(r=>String(r.text||"").trim())?"✎":"○";
}
function histHtml_(){
  const d=HIST.d=histData_(), cols=d.cols, last=cols.length-1;
  const me=j=>j>0&&cols[j].w.ym!==cols[j-1].w.ym;
  let h=`<div id="cmhist" class="hpanel"><div class="hhead"><b>🕘 週ごとの履歴</b><span class="lb">直近${cols.length}週（右がいまの週）。マスを押すと、その週の文が下に出ます。週を押すと、その週へ移ります</span>`+
    `<span class="hsp"></span><button type="button" class="btn" onclick="histMore_()" title="さらに前の8週を左に足します">◀ もっと前の8週</button><button type="button" class="btn" onclick="histToggle_()">閉じる</button></div>`+
    `<div class="legend"><span>✎ 書いた</span><span>○ A に出ていた（書かなかった）</span><span>✅ 済にした週</span><span>☑ 済の報告</span><span>太い線＝月の切れ目（月末確定）</span></div>`;
  if(!d.rows.length) return h+`<div class="note">この ${cols.length} 週に、課題はありません。</div></div>`;
  h+=`<div class="hwrap"><table class="hist"><thead><tr><th class="il">課題（書き始めた週）</th>`+
    cols.map((c,j)=>`<th class="${j===last?"cur":""}${me(j)?" me":""}"><button type="button" data-hweek="${j}" data-k="hw:${esc(c.w.snap8)}" title="押すと、データ期間を ${esc(lbl8_(c.w.snap8))} の週へ${me(j)?`（${+cols[j-1].w.ym.slice(4)}月の月末確定のあと）`:""}${j===last?"（いま見ている週）":""}">${esc(lbl8_(c.w.snap8))}</button></th>`).join("")+`</tr></thead><tbody>`;
  d.rows.forEach(r=>{
    const off=!(r.cells[last]&&r.cells[last].g!=="report"), head=String(r.head||"").replace(/\s+/g," ");
    const lab=`${lbl8_(r.birth)}〜 ${head.length>18?head.slice(0,18)+"…":head}`;
    h+=`<tr class="${off?"done":""}"><td class="il" title="${esc(head)}">${esc(lab)}</td>`+cols.map((c,j)=>{
      const m=histMark_(r.cells[j]);
      return `<td class="${me(j)?"me":""}">${m?`<button type="button" class="hc" data-hk="${esc(r.key)}" data-hj="${j}" aria-label="${esc(lab)}・${esc(lbl8_(c.w.snap8))}">${m}</button>`:""}</td>`;
    }).join("")+`</tr>`;
  });
  return h+`</tbody></table></div><div class="hdet empty" id="hdet" aria-live="polite">マスを押すと、その週の A・PD がここに出ます。</div></div>`;
}
/* マス → その週のその課題の A・PD の文を、表のすぐ下に */
function histShow_(key,j,btn){
  const d=HIST.d; if(!d) return;
  const r=d.rows.find(x=>x.key===key), c=d.cols[j]; if(!r||!c) return;
  const cell=r.cells[j], it=cell&&cell.it, P=pair_();
  const txt=rs=>rs.filter(x=>String(x.text||"").trim()).map(x=>String(x.text)).join("\n");
  const L=[];
  if(!it) L.push("この週は、A に出ていません。");
  else if(cell.g==="report"){ L.push("済の報告（この週だけ・書けません）"); L.push("A："+(it.a?it.a.text:"")); L.push("PD："+(it.pdRes?it.pdRes.text:"")); L.push("（"+lbl8_(it.rw)+" の週に済。次の週から A に出ません）"); }
  else{
    L.push("A："+(cell.g==="born"?(txt(it.aRows)||"（今週から書き始めた課題）"):it.a.text+"（"+lbl8_(it.a.w)+" の "+(it.a.row.section===P.a?"A":"PD")+"）"));
    L.push("PD："+(txt(it.pdRows)||"（書いていない）"));
    if(it.here) L.push("→ ✓ 済（"+lbl8_(it.rw)+" の週）");
  }
  const det=$("hdet"); det.classList.remove("empty");
  det.innerHTML=`<b>${esc(lbl8_(c.w.snap8))} の週 — ${esc(String(r.head||"").slice(0,40))}</b>\n`+esc(L.join("\n"));
  document.querySelectorAll("#cmhist button.hc.on").forEach(b=>b.classList.remove("on"));
  if(btn) btn.classList.add("on");
}

/* 取込状況パネルの再取得。アップロード直後は「取込状況」が固まって見え、反映済みかどうか

/* ── 取込追跡（2026-09-08 新設）──
   「取込状況」は直前に走ったバッチの結果しか出さないため、アップロード直後に見ると必ず
   「検出0件」と表示され、利用者は自分の分が取り込まれたのか判断できなかった（実際に誤認が発生）。
   そこで、送ったファイル名を画面側で覚えておき、取込結果の一覧に現れるまで自動で追いかける。
   ・判定は status.json の uke.details[].filename との突き合わせ（確実に本人の分だけを見る）
   ・追跡開始時の checked_at を基準にし、それより新しいバッチの結果だけを採用（前回分の誤検知を防ぐ）
   ・28件が複数バッチに分かれて取り込まれる場合があるため、確認済みを累積して数える */
const UKE_TRACK_POLL=30000, UKE_TRACK_MAX=20*60*1000;   // 30秒毎に確認・20分で打ち切り
let UKE_TRACK=null;
function ukeTrackStop_(){ if(UKE_TRACK){ clearInterval(UKE_TRACK.poll); clearInterval(UKE_TRACK.tick); UKE_TRACK=null; } }
async function startUkeTrack_(names){
  ukeTrackStop_();
  if(!$("dmUkeTrack")||!names.length) return;
  UKE_TRACK={ want:new Set(names), seen:new Set(), notes:{}, t0:Date.now(), since:"", at:"", errors:[], poll:null, tick:null };
  try{
    const st=await loadJson("status.json","status.json");
    UKE_TRACK.since=String(st.checked_at||"");
    const el=$("dmStatus"); if(el) el.innerHTML=dmStatusHtml(st);
  }catch(e){ /* 取れなくても追跡は続ける */ }
  if(!UKE_TRACK) return;
  ukeTrackRender_();
  UKE_TRACK.tick=setInterval(ukeTrackRender_,1000);       // 経過時間の表示だけ毎秒
  UKE_TRACK.poll=setInterval(ukeTrackPoll_,UKE_TRACK_POLL);
}
async function ukeTrackPoll_(){
  if(!UKE_TRACK) return;
  let st; try{ st=await loadJson("status.json","status.json"); }catch(e){ return; }
  if(!UKE_TRACK) return;
  const el=$("dmStatus"); if(el) el.innerHTML=dmStatusHtml(st);   // 上のパネルも一緒に最新化
  const at=String(st.checked_at||"");
  if(!at||at<=UKE_TRACK.since) return;                            // まだ新しいバッチが走っていない
  UKE_TRACK.since=at; UKE_TRACK.at=at;
  (((st.uke||{}).details)||[]).forEach(d=>{
    if(!UKE_TRACK.want.has(d.filename)) return;
    UKE_TRACK.seen.add(d.filename);
    if(d.note) UKE_TRACK.notes[d.filename]=d.note;   // 旧分類の機械変換・新分類優先で使わなかった 等（backend が付ける）
  });
  const errs=((st.uke||{}).errors)||[];
  if(errs.length) UKE_TRACK.errors=errs;
  ukeTrackRender_();
}
function ukeTrackRender_(){
  const box=$("dmUkeTrack"), t=UKE_TRACK; if(!box||!t) return;
  const sec=Math.floor((Date.now()-t.t0)/1000);
  const time=Math.floor(sec/60)+"分"+String(sec%60).padStart(2,"0")+"秒";
  const n=t.seen.size, N=t.want.size, pct=N?Math.round(n/N*100):0;
  const done=n>=N, over=(Date.now()-t.t0)>UKE_TRACK_MAX;
  let h=`<div class="upbox" style="margin-top:8px">`;
  if(done){
    h+=`<div class="uphead"><span>✅</span><span><b>${N} 件すべて取込完了</b>${t.at?`（${esc(t.at)}）`:""}</span></div>`+
       `<div class="upbar"><i style="width:100%"></i></div>`+
       `<div class="upnote">表示データも再生成されました。画面を再読み込みすると最新の数値が表示されます。</div>`;
  }else if(over){
    h+=`<div class="uphead"><span>⏱</span><span><b>${time}待っても ${N-n} 件が取込結果に現れませんでした</b></span></div>`+
       `<div class="upbar"><i style="width:${pct}%"></i></div>`+
       `<div class="upnote">お手数ですが本部（システム担当）へご連絡ください。アップロード自体は完了しています。</div>`;
  }else{
    h+=`<div class="uphead"><span class="spin dark"></span><span><b>自動処理を待っています</b>（経過 ${time}／取込は最大5分間隔）</span></div>`+
       `<div class="upbar"><i style="width:${pct}%"></i></div>`+
       `<div class="uplist"><div class="uprow ${n?"done":"wait"}"><span class="st">${n?"✅":"…"}</span><span>取込確認 <b>${n} / ${N}</b> 件</span></div></div>`+
       `<div class="upnote">アップロードは完了しています。この画面のままお待ちください（自動で更新されます）。</div>`;
  }
  const nk=Object.keys(t.notes);

function upProgress_(host, names, title){
  const rows=names.map((n,i)=>`<div class="uprow wait" id="up_${i}"><span class="st">…</span><span>${esc(n)}</span></div>`).join("");
  host.innerHTML=`<div class="upbox"><div class="uphead"><span class="spin dark"></span><span id="upTtl">${esc(title)}</span></div>`+
    `<div class="upbar"><i id="upBar"></i></div><div class="uplist">${rows}</div>`+
    `<div class="upnote">送信中です。完了までこのタブを閉じないでください。</div></div>`;
  const total=names.length;
  return {
    step(i, state, extra){
      const el=$("up_"+i); if(el){
        el.className="uprow "+state;
        el.querySelector(".st").textContent = state==="now"?"▶" : state==="done"?"✅" : state==="fail"?"❌" : "…";
        if(extra) el.innerHTML += ` <span style="opacity:.8">${esc(extra)}</span>`;
      }
      const doneCount=names.filter((_,k)=>{const e=$("up_"+k);return e&&(/done|fail/.test(e.className));}).length;
      const bar=$("upBar"); if(bar) bar.style.width=Math.round(doneCount/total*100)+"%";
      const t=$("upTtl"); if(t) t.textContent=`${title}（${doneCount}/${total}）`;
    },
    finish(okCount, failCount){
      const box=host.querySelector(".upbox"); if(!box) return;
      const sp=box.querySelector(".spin"); if(sp) sp.remove();
      const t=$("upTtl"); if(t) t.textContent = failCount? `完了（成功 ${okCount} / 失敗 ${failCount}）` : `完了（${okCount} 件すべて成功）`;
      const note=box.querySelector(".upnote");
      if(note) note.textContent = failCount ? "失敗した行は内容をご確認のうえ再度お試しください。" : "取込は5分毎の自動処理で行われます。";
    }
  };
}

/* ── 旧分類の受払表の確認（PO 2026-09-18）──
   旧分類の受払表（2026年8月以前の過去分など）は、取込時に新分類の名前へ機械的に置き換える（backend newclass_map）。
   送る前に中身の部門名で旧分類かを見分け、「新分類で入れ直すのが望ましい／このままなら参考データ」と確かめる。
   目印は backend の newclass_map.OLD_MARK_DEPTS / NEW_MARK_DEPTS と同じ（取込済み411本で確認: 旧382本・新29本とも例外なし）。 */
const UKE_OLD_DEPTS=new Set(["農産","畜産","一食","その他１","その他２","その他1","その他2"]);
const UKE_NEW_DEPTS=new Set(["青果","精肉","一般食品","その他"]);
async function ukeClassInfo_(f){
  let t="";
  try{
    const buf=await f.arrayBuffer();
    t=new TextDecoder("utf-8").decode(buf);
    if(t.includes("\uFFFD")) t=new TextDecoder("shift_jis").decode(buf);   // UTF-8 で読めない＝Shift_JIS
  }catch(e){ return {basis:"unknown"}; }
  const lines=t.replace(/^\uFEFF/,"").split(/\r?\n/);
  const head=lines[0]||"";
  const ym=((head.match(/\[年月\]\s*=\s*(\d{6})/)||head.match(/\[年月日\]\s*=\s*(\d{6})\d{2}/)||[])[1])||"";
  const store=((head.match(/\[店舗名\]\s*=\s*([^)]+?)\s*\)/)||[])[1])||"";
  // 同じ日付の警告に使う: エリア（グループ１名）・時点（05-4＝[年月日]／05-2＝[年月]＝月末）
  const area=((head.match(/\[グループ[１1]名\]\s*=\s*([^\s)　]+)/)||[])[1])||"";
  const day=((head.match(/\[年月日\]\s*=\s*(\d{8})/)||[])[1])||"";
  const kind=day?"05-4":(ym?"05-2":"");
  let hi=-1;
  for(let i=0;i<Math.min(6,lines.length);i++){
    if(/^"?分類[２2]名"?\s*,/.test(lines[i].trim())){ hi=i; break; }
  }
  if(hi<0) return {basis:"unknown",ym,store,area,day,kind};
  const ds=new Set();
  for(let i=hi+1;i<lines.length;i++){
    const d=(lines[i].split(",")[0]||"").replace(/"/g,"").replace(/[\s\u3000]/g,"");
    if(d) ds.add(d);
  }
  const basis=[...ds].some(d=>UKE_NEW_DEPTS.has(d))?"new":[...ds].some(d=>UKE_OLD_DEPTS.has(d))?"old":"new";
  return {basis,ym,store,area,day,kind};
}
/* 同じ店・同じ時点のデータが、もう画面にあるか（PO 2026-10-14「同じ日付のデータが入った場合は、警告を出して上書きも出来る」）。
   画面にあるデータ期間（snapshots）と、その期間の店（stores）で見る。画面の一覧に無い月は確かめられない（警告しない）。 */
async function ukeExisting_(infos){
  const norm=x=>String(x||"").normalize("NFKC").replace(/[\s\u3000]/g,"");
  const cache={}, out=[];
  for(const x of infos){
    if(!x.area||!x.ym||!x.store||!x.kind) continue;
    if(!(S.meta.areas||[]).includes(x.area)||!(S.meta.year_months||[]).includes(x.ym)) continue;
    const k=x.area+"|"+x.ym;
    if(!cache[k]){ try{ cache[k]=(await API.snapshots(x.area,x.ym)).snapshots||[]; }catch(e){ cache[k]=[]; } }
    const snap=cache[k].find(o=>x.kind==="05-2"?String(o.file_type||"")==="05-2":(String(o.file_type||"")==="05-4"&&s8(o.snapshot)===x.day));
    if(!snap) continue;
    const sk=k+"|"+snap.snapshot;
    if(!cache[sk]){ try{ cache[sk]=((await API.stores(x.area,x.ym,snap.snapshot)).stores)||[]; }catch(e){ cache[sk]=[]; } }
    if(cache[sk].some(st=>norm(st.full)===norm(x.store))) out.push(Object.assign({},x,{label:String(snap.label||"").replace("\uD83D\uDCCA","").replace("\uD83D\uDCCC","").trim()}));
  }
  return out;
}
/* 確認ダイアログ（同じ日付の上書き／旧分類）。取り込む→true／やめる・Esc→false。既定の選択は「やめる」（警告なので安全側） */
function ukeAsk_(olds, dups, total){
  return new Promise(resolve=>{
    const o=document.createElement("div"); o.id="ukeAsk";
    const ymTxt=ym=>ym?`${ym.slice(0,4)}年${Number(ym.slice(4,6))}月`:"年月不明";
    const rowsOld=olds.map(x=>`<div>・${esc(ymTxt(x.ym))}　${esc(x.store||"店舗不明")} <span class="fn">${esc(x.name)}</span></div>`).join("");
    const rowsDup=dups.map(x=>`<div>・${esc(ymTxt(x.ym))} ${esc(x.label||"")}　${esc(x.store)} <span class="fn">${esc(x.name)}</span></div>`).join("");
    const secDup=dups.length?
      `<p><b>同じ店・同じ時点のデータが、すでにあります（${dups.length} / ${total} 件）。</b>取り込むと、今回のデータで上書きされます。</p>`+
      `<div class="alist">${rowsDup}</div>`+
      `<div class="anote">新分類のデータは、旧分類のデータより優先されます（旧分類で上げ直しても、新分類のデータが残ります）。月中（速報）と月末確定は別の時点として扱います。</div>`:"";
    const secOld=olds.length?
      `<p style="margin-top:10px"><b>旧分類の受払表が含まれています（${olds.length} / ${total} 件）。</b>2026年8月以前の過去分は旧分類のデータです。新分類のデータで改めて入れてください。</p>`+
      `<div class="alist">${rowsOld}</div>`+
      `<p>新分類のデータが無い場合も、このまま取り込めます。その場合は、<b>旧分類を新分類へ機械的に置き換えた参考データ</b>になります（温惣菜と冷惣菜など、新分類で分かれたカテゴリは分けられません）。</p>`+
      `<div class="anote">あとから同じ店・同じ月の新分類のデータを入れると、自動でそちらに置き換わります。</div>`:"";
    const title=dups.length&&olds.length?"上書きと旧分類を確かめてください":dups.length?"同じ日付のデータがあります（上書き）":`旧分類の受払表が含まれています（${olds.length} / ${total} 件）`;
    const yes=dups.length?"上書きして取り込む":"参考データとして取り込む";
    o.innerHTML=`<div class="acard" role="alertdialog" aria-modal="true" aria-labelledby="ukeAskT">`+
      `<div class="ahead" id="ukeAskT"><span>⚠️</span>${esc(title)}</div>`+
      `<div class="abody">${secDup}${secOld}<p style="margin-top:8px">よろしいですか？</p></div>`+
      `<div class="afoot"><button class="btn" id="ukeAskNo">やめる</button><button class="btn primary" id="ukeAskYes">${esc(yes)}</button></div></div>`;
    document.body.appendChild(o);
    const done=v=>{ document.removeEventListener("keydown",onKey); o.remove(); resolve(v); };
    const onKey=e=>{ if(e.key==="Escape") done(false); };
    document.addEventListener("keydown",onKey);
    $("ukeAskNo").onclick=()=>done(false);
    $("ukeAskYes").onclick=()=>done(true);
    $("ukeAskNo").focus();
  });
}
let UKEUP=false;  // 二重実行ガード
let UKECHK=false; // 旧分類の確認中（ファイルを読む間・ダイアログを開いている間）の二度押しガード
async function dmUpUke(btn){
  if(UKEUP){ toast("アップロード処理中です。完了までお待ちください",true); return; }
  if(UKECHK) return;
  const fs=[...($("dmUke").files||[])];
  if(!fs.length){ toast("CSVファイルを選択してください",true); return; }
  UKECHK=true;
  let go=true;
  try{
    const infos=await Promise.all(fs.map(f=>ukeClassInfo_(f).then(x=>({...x,name:f.name}))));
    const olds=infos.filter(x=>x.basis==="old");
    const dups=await ukeExisting_(infos);
    if(olds.length||dups.length) go=await ukeAsk_(olds, dups, fs.length);
  } finally { UKECHK=false; }
  if(!go){ toast("アップロードをやめました（ファイルは選んだままです）"); return; }
  UKEUP=true;
  btn=btn||$("dmUkeBtn");
  btnBusy_(btn,true,"送信中…");
  busyOverlay_(true,"受払CSVを送信中です",`0 / ${fs.length} 件`);
  const pg=upProgress_($("dmUkeMsg"), fs.map(f=>f.name), "アップロード中");
  let ok=0, ng=0; const sent=[];              // sent = 送信できたファイル名（取込追跡の対象）
  try{
    for(let i=0;i<fs.length;i++){
      const f=fs[i];
      pg.step(i,"now");
      busyOverlay_(true,"受払CSVを送信中です",`${i+1} / ${fs.length} 件目：${f.name}`);
      try{
        const r=await capi("uploadInbox","uke",f.name,await fileB64(f),"text/csv");
        ok++; sent.push(f.name); pg.step(i,"done",`（${r.by||""}）`);
      }catch(e){ ng++; pg.step(i,"fail",String(e&&e.message||e)); }
    }
  } finally {
    UKEUP=false; btnBusy_(btn,false); busyOverlay_(false);
    pg.finish(ok,ng);
    $("dmUke").value="";
  }
  if(ok){ toast(ok+" 件をアップロードしました（自動取込を待っています）"); startUkeTrack_(sent); }
}
/* \u2500\u2500 予算取込キュー: ファイル選択のたびに積み上げ、名前から年度・エリアを自動判定して
     「{年度}_{エリア}.xlsx」へ正規化。同一ファイル・同一 年度\u00D7エリア は自動排除。
     （ファイル取込UIの標準形＝積み上げ式・自動正規化・重複排除） \u2500\u2500 */
const _XLSX_MIME="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
const _BUD_AREAS=["北東北","北関東","首都圏","宮城","山形","東北"]; // 部分一致の優先順（「北東北」を「東北」より先に判定）
const _budLabel=a=>a==="東北"?"東北（北東北・宮城・山形 一括）":a;
let BQ=[]; // 積み上げキュー {f, key, year, area}
function budParse(name){
  const n=String(name).normalize("NFC");
  let area=""; for(const a of _BUD_AREAS){ if(n.includes(a)){ area=a; break; } }
  const y=n.match(/20\d{2}/);
  return { year: y?y[0]:"", area };
}
function budAdd(){
  const inp=$("dmBud");
  for(const f of inp.files){
    const key=f.name.normalize("NFC")+"|"+f.size;
    if(BQ.some(x=>x.key===key)) continue;
    BQ.push(Object.assign({f,key,name:f.name},budParse(f.name)));
  }
  inp.value=""; budRenderQ();
}
/* ドライブ選択ピッカー（xlsx・スプシのみ表示。選んだら同じ自動判定キューへ積む） */

function budPickAdd(i){

function budRenderQ(){

  const seen={};
  q.innerHTML=BQ.map((x,i)=>{

    const areaSel=`<select onchange="BQ[${i}].area=this.value;budRenderQ()"><option value=""${x.area?"":" selected"}>エリア?</option>${_BUD_AREAS.map(a=>`<option value="${esc(a)}"${a===x.area?" selected":""}>${esc(_budLabel(a))}</option>`).join("")}</select>`;
    const state=dup?`<b style="color:#b8860b">重複（自動排除）</b>`
      :dest?`\u2192 <b>${esc(dest)}</b>${x.area==="東北"?"（3エリアへ自動分割）":""}`
      :`<b style="color:#c00">年度・エリアを判定できません\u2014\u2014選んでください</b>`;
    return `<div class="cmadd" style="margin-top:4px"><span class="lb">${x.driveId?"\u2601\uFE0F":"\uD83D\uDCC4"} ${esc(x.name)}</span> ${yearIn} ${areaSel} <span class="lb">${state}</span> <button class="btn" onclick="BQ.splice(${i},1);budRenderQ()">\u2715</button></div>`;
  }).join("");
}
let BUP=false; // 二重実行ガード（連打・処理中の再クリックを無効化）
async function dmUpBud(btn){
  if(BUP){ toast("アップロード処理中です。完了までお待ちください",true); return; }
  if(!BQ.length){ toast("ファイルを選択（またはドライブから追加）してください",true); return; }
  if(BQ.some(x=>!(x.year&&x.area))){ toast("年度・エリア未確定（赤）の行を修正してください",true); return; }
  const items=BQ.filter(x=>!x.done);
  btn=btn||$("dmBudBtn");
  BUP=true; btnBusy_(btn,true,"送信中…");
  busyOverlay_(true,"年度予算を送信中です",`0 / ${items.length} 件`);
  const pg=upProgress_($("dmBudMsg"), items.map(x=>x.name), "アップロード中");
  const seen={}; let ok=0, ng=0;
  try{
    for(let i=0;i<items.length;i++){
      const x=items[i];
      const dest=`${x.year}_${x.area}.xlsx`;
      if(seen[dest]){ x.done=true; pg.step(i,"done","（重複のため送信省略）"); continue; }
      seen[dest]=1;
      pg.step(i,"now");
      busyOverlay_(true,"年度予算を送信中です",`${i+1} / ${items.length} 件目：${dest}`);
      try{
        if(x.driveId) await capi("uploadInboxFromDrive",x.driveId,dest);
        else await capi("uploadInbox","budget",dest,await fileB64(x.f),_XLSX_MIME);
        ok++; x.done=true;
        pg.step(i,"done",`→ ${dest}${x.area==="東北"?"（3エリアへ自動分割）":""}`);
      }catch(e){ ng++; pg.step(i,"fail",String(e&&e.message||e)); }
    }
  } finally {
    BUP=false; btnBusy_(btn,false); busyOverlay_(false);
    pg.finish(ok,ng);
    BQ=BQ.filter(x=>!x.done); budRenderQ();
  }
  if(ok){ toast(ok+" 件をアップロードしました（取込は5分毎の自動処理→上の「取込状況」で確認）"); refreshDmStatus_(); }
}

  // 静的配信（GitHub Pages/ローカル）なので URL クエリを直接読める

/* ══ 週間モード（第5便・2026-10-16 PO 決定）══
   受払表の「月初からの累計」を、日曜締めの1週ずつに直した表。HQ の outbox 生成が weekly/ に作る
   （作り方＝acoop-platform の hissuru_core/weekly_table.py・形＝hissuru_weekly_mode_design/weekly_json_仕様.md）。
   - 画面は読むだけ（計算し直さない。率だけ額から出す）。weekly/meta.json が無い・知らない版なら「累計｜週間」を出さない（いまの画面のまま）
   - エリア・店のファイルは、meta.json と build が同じときだけ使う（置き換えの途中で、古い週と新しい週を混ぜない）
   - 本部用の入口だけ（店舗用 ?mode=viewer は今のまま・PO 9/29 Q8）。A・PD は累計の画面で書く（週間では書かない）
   - 見方を変える操作（週・段・店・部門・指標・問い）は、いままでと同じく「← ひとつ前に戻る」1本で戻れる（nav_） */
const WK={meta:null,A:null,C:null};   // meta＝目次・A＝いまのエリア・C＝いまの店（カテゴリ）
const WK_VERSION="weekly-1", WK_ALL="全部門", WK_AREA="AREA";
const WK_MINUS="−";
/* 部門の組（fresh＝週の棚卸を見る生鮮・book＝売価で在庫を持つ）と、問いごとの対象の部門（q_depts）は、
   作る側が meta.rules に書く（weekly_table.py の FRESH・BOOK_DEPTS・Q_DEPTS・2026-10-20）。画面は読むだけ。
   このキーが無い 10/16 版の meta のときだけ、そのときの作る側と同じ決まり（WK_RULES_1016）で動く（いままでと同じ画面）。
   HQ が週の表の第2回を入れたら、WK_RULES_1016 と wkQIn_ の後ろ半分は消す */
const WK_RULES_1016={fresh:["農産","畜産","水産","惣菜"],book:["日配","グロッサリー"]};
function wkRule_(k){ const r=(WK.meta&&WK.meta.rules)||{}; return Array.isArray(r[k])?r[k]:WK_RULES_1016[k]; }
const wkFresh_=()=>wkRule_("fresh"), wkBook_=()=>wkRule_("book");
/* 問い qid の対象に、部門 d（全部門＝店全体の行）が入るか。外のマスは「対象外」 */
function wkQIn_(qid,d){
  const qd=((WK.meta.rules||{}).q_depts||{})[qid];
  if(Array.isArray(qd)) return qd.includes(d);
  if(d===WK_ALL) return qid==="missing";
  return qid==="inv_week"?wkFresh_().includes(d):qid==="loss"?wkBook_().includes(d):true;
}
const WK_MLABEL={s:"売上",g:"粗利",gpr:"粗利率",dr:"値引率",wr:"廃棄率",d:"値引き",w:"廃棄額"};
function wkOn_(){ return !!WK.meta && S.viewMode!=="viewer"; }
/* 目次が入室のあとに届いたとき: 「累計｜週間」と 🔎 を、取っておいた所（帯の右端・段の地図の右）に足す。
   左の物は動かない（入室は待たない＝PO 速さが最優先。届かなければ何も足さない） */
function wkAttach_(){
  if(!S.entered||!wkOn_()) return;
  const f=$("wkFindSlot"); if(f&&!f.firstChild) f.innerHTML=wkFindBox_();
  const g=$("wkSegSlot"); if(g&&!g.firstChild&&TREE.includes(S.mode)) g.innerHTML=wkSeg_();
}
/* 選ぶ帯の右端: 「累計｜週間」（段の地図の4つのときだけ）と印刷。累計でも週間でも同じ所に出す */
function wkSelRight_(){
  return `<span class="selright"><span id="wkSegSlot" style="display:contents">${wkOn_()&&TREE.includes(S.mode)?wkSeg_():""}</span>`+
    `<button class="btn" onclick="printHq_()" title="表示中の画面を印刷します">🖨 印刷</button></span>`;
}
/* 週間・気になる所は、週の表があって段の地図の4つのときだけ（無ければ累計に戻す）。週間なら true */
function wkFix_(){ if(S.view!=="cum"&&!(wkOn_()&&TREE.includes(S.mode))) S.view="cum"; return S.view!=="cum"; }
/* 段の地図の小さな字: A・PD を書けるのは累計の画面だけ */
function wkApd_(){ return S.view==="cum"?"・A・PD":""; }
async function wkLoadMeta_(){
  try{ const m=await loadJsonStrict("weekly/meta.json"); WK.meta=(m&&m.version===WK_VERSION&&Array.isArray(m.weeks)&&m.weeks.length)?m:null; }
  catch(e){ WK.meta=null; }
}
/* エリア・店のファイルを読む。meta と build が違えば、覚えた物を捨てて1回だけ読み直す（それでも違えば、更新中と出す） */
async function wkLoad_(file){
  for(let k=0;k<2;k++){
    const m=await loadJsonStrict("weekly/meta.json"), d=await loadJsonStrict("weekly/"+file);
    if(m&&d&&m.build===d.build&&d.n_weeks===m.weeks.length){ WK.meta=m; return d; }
    JCACHE.delete("S|weekly/meta.json"); JCACHE.delete("S|weekly/"+file);
  }
  throw new Error("週の表を更新中です。少したってから開き直してください。");
}
function wkAreaMeta_(){ return ((WK.meta&&WK.meta.areas)||[]).find(x=>x.area===S.area)||null; }
function wkN_(){ return WK.meta.weeks.length; }
function wkWi_(){ const n=wkN_(); return (S.wi>=0&&S.wi<n)?S.wi:n-1; }
function wkStoreKey_(){ return (S.mode==="商品部全体"||S.mode==="運営部全体"||S.storeTab==="__total__")?WK_AREA:S.storeTab; }
function wkDeptKey_(){ return (S.mode==="運営部詳細"||S.mode==="運営部全体"||isAll_(S.dept)||!S.dept)?WK_ALL:S.dept; }   // 部門を選んでいない（閲覧者が全部門から来たとき）は全部門
function wkStoreName_(slug){ if(slug===WK_AREA||slug==="__total__") return "エリア合計"; const a=wkAreaMeta_(); const s=a&&a.stores.find(x=>x.slug===slug); return s?s.name:slug; }
function wkSer_(st,d){ return WK.A&&WK.A.series[st+"|"+d]; }

function wkWeekOf_(iso){ const W=WK.meta.weeks; for(let i=0;i<W.length;i++) if(W[i].start<=iso&&iso<=W[i].end) return i; return iso<W[0].start?0:W.length-1; }

function wkMv_(s,i,m){
  if(!s) return null;

  const sa=s.s[i];
  if(m==="s") return sa; if(m==="g") return s.g[i]; if(m==="d") return s.d[i]; if(m==="w") return s.w[i];
  if(sa==null||Math.abs(sa)<100000) return null;
  const num=m==="gpr"?s.g[i]:m==="dr"?s.d[i]:s.w[i];
  return num==null?null:num/sa*100;
}
/* 前4週の平均（売上・値引き・廃棄は作る側で今週と同じ範囲にそろえたもの。粗利・カテゴリは前の4週の値の平均） */
function wkPrev4_(s,i,m){
  if(!s) return null;
  if(s.p4&&["s","d","w","dr","wr"].includes(m)){
    const a=s.p4[i];
    if(m==="s") return a; if(m==="d") return s.p4d[i]; if(m==="w") return s.p4w[i];
    if(a==null||Math.abs(a)<100000) return null;
    return (m==="dr"?s.p4d[i]:s.p4w[i])/a*100;
  }
  let num=0, den=0;
  for(let j=i-4;j<i;j++){
    if(j<0||(s.days&&s.days[j]!==7)) return null;
    if(wkIsRate_(m)){ const n=m==="gpr"?s.g[j]:m==="dr"?s.d[j]:s.w[j]; if(n==null||s.s[j]==null) return null; num+=n; den+=s.s[j]; }
    else { const v=wkMv_(s,j,m); if(v==null) return null; num+=v; }
  }
  return wkIsRate_(m)?(Math.abs(den)<100000?null:num/den*100):num/4;
}
/* 4週の移動平均（今週を含む4週。率は額を足してから割る） */
function wkMa4_(s,i,m){
  if(!s||i<3) return null;
  if(m==="s"&&s.a4) return s.a4[i];
  let num=0, den=0;
  for(let j=i-3;j<=i;j++){

    if(wkIsRate_(m)){ const n=m==="gpr"?s.g[j]:m==="dr"?s.d[j]:s.w[j]; if(n==null||s.s[j]==null) return null; num+=n; den+=s.s[j]; }
    else { const v=wkMv_(s,j,m); if(v==null) return null; num+=v; }
  }
  return wkIsRate_(m)?(Math.abs(den)<100000?null:num/den*100):num/4;
}

/* 当たりの数（meta の hit_counts・エリアのファイルを読まずに）。週の問いは選んだ週・月の問いは、その週までに締まった月。
   月は meta.months（どこかのエリアで月末確定が届いた月・作る側が 05-2 から決める）から選ぶ＝当たりが 0 の月も選べる。
   months が無い 10/16 版の meta は、いままでどおり当たりの数に出てくる月から選ぶ（当たりの無い月は選べず、その前の月になる） */
function wkPeriodMonth_(){
  const e=WK.meta.weeks[wkWi_()].end;
  let ms=WK.meta.months;
  if(!Array.isArray(ms)){ const s=new Set(); ((WK.meta.areas)||[]).forEach(a=>Object.values(a.hit_counts||{}).forEach(q=>Object.keys(q.m||{}).forEach(m=>s.add(m)))); ms=[...s]; }
  let r=null; [...ms].sort().forEach(m=>{ if(wkYmEnd_(m)<=e) r=m; }); return r;
}
/* そのエリアに、月 pm の月末確定が届いているか（areas[].months）。届いていない月の問いは 0 ではなく「—（まだ）」と出す
   （0 と出すと「異常ではなかった」と取り違える）。months の無い 10/16 版の meta は分からないので、届いているとみる＝いままでどおり */
function wkAreaHasMonth_(area,pm){
  const a=(WK.meta.areas||[]).find(x=>x.area===area);
  if(!pm||!a) return true;
  if(Array.isArray(a.months)) return a.months.includes(pm);
  // months の無い 10/16 版の meta: いまのエリアは、エリアのファイルの月末確定（month）で分かる。ほかのエリアは分からないので、届いているとみる
  if(WK.A&&WK.A.area===area&&WK.A.month){ const m=WK.A.month[WK_AREA+"|"+WK_ALL]; return !!m&&m.some(x=>x.ym===pm); }
  return true;
}
function wkQPer_(qid){ return (wkQs_().find(x=>x.id===qid)||{}).per; }
/* 運営部全体の指標（週間）: 売上・粗利・粗利率・値引率・廃棄率のどれか（表の数字で選んだ額の指標は、売上に読み替える） */
function wkUMetric_(){ return ["s","g","gpr","dr","wr"].includes(S.wtmetric)?S.wtmetric:"s"; }
function wkCount_(area,qid){
  const a=(WK.meta.areas||[]).find(x=>x.area===area); if(!a||!a.hit_counts) return null;
  const i=wkWi_(), pm=wkPeriodMonth_(), got=wkAreaHasMonth_(area,pm);
  if(qid&&!got&&wkQPer_(qid)==="m") return null;
  if(qid&&wkQPer_(qid)==="w"&&wkAreaHasWeek_(area,i)===false) return null;   // その週の受払がまだ（0 と言わない）
  const hid=wkHidHits_(area).filter(h=>(!qid||h.q===qid)&&((h.w!=null&&h.w===i)||(got&&pm&&h.ym===pm))).length;   // 抜いた愛知の分類の当たり
  return Math.max(0,Object.entries(a.hit_counts).filter(([q])=>!qid||q===qid).reduce((t,[,v])=>t+((v.w||[])[i]||0)+((got&&pm&&v.m&&v.m[pm])||0),0)-hid);
}

function wkLastWeek_(s){ if(!s) return -1; for(let j=s.s.length-1;j>=0;j--) if(s.s[j]!=null) return j; return -1; }

/* ── 図の共通部品 ── */
function wkNice_(raw){ if(!(raw>0)) return 1; const p=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function wkBar_(x,y,w,h){ const r=Math.min(4,w/2,Math.abs(h)); if(Math.abs(h)<0.5) return `M${x} ${y}h${w}v0.5h${-w}z`;
  if(h>0) return `M${x} ${y+h}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+w-r}Q${x+w} ${y} ${x+w} ${y+r}V${y+h}Z`;
  const yb=y+h; return `M${x} ${y}V${yb-r}Q${x} ${yb} ${x+r} ${yb}H${x+w-r}Q${x+w} ${yb} ${x+w} ${yb-r}V${y}Z`; }
function wkFrame_(el,H,vmin,vmax,yfmt){
  const W=WK.meta.weeks, n=W.length, cw=el.clientWidth||900, narrow=cw<600;
  const Wd=narrow?Math.max(320,cw):Math.max(560,cw), mL=narrow?44:64, mR=narrow?8:14, mT=14, mB=44, pw=Wd-mL-mR, ph=H-mT-mB, sw=pw/n;
  let lo=Math.min(0,vmin), hi=Math.max(0,vmax); if(hi===lo) hi=lo+1;
  const step=wkNice_((hi-lo)/5), top=Math.ceil(hi/step)*step, bot=Math.floor(lo/step)*step;
  const y=v=>mT+ph-(v-bot)/(top-bot)*ph, x0=j=>mL+j*sw, wi=wkWi_();
  let g=`<svg viewBox="0 0 ${Wd} ${H}" role="img">`;
  for(let t=bot;t<=top+1e-9;t+=step) g+=`<line x1="${mL}" x2="${Wd-mR}" y1="${y(t)}" y2="${y(t)}" stroke="#e5e7eb"/><text x="${mL-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="#475569">${yfmt(t)}</text>`;
  g+=`<rect x="${x0(wi)}" y="${mT}" width="${sw}" height="${ph}" fill="#dbeafe" opacity=".7"/>`;
  let lastM=null; const every=narrow?4:2;
  W.forEach((w,j)=>{ const m=Number(w.end.split("-")[1]);
    if(j%every===(n-1)%every) g+=`<text x="${x0(j)+sw/2}" y="${H-mB+15}" text-anchor="middle" font-size="10.5" fill="#475569">${wkMd_(w.end)}</text>`;
    if(m!==lastM){ g+=`<text x="${x0(j)+2}" y="${H-mB+31}" font-size="11" font-weight="600" fill="#334155">${m}月</text><line x1="${x0(j)}" x2="${x0(j)}" y1="${H-mB+20}" y2="${H-mB+34}" stroke="#94a3b8"/>`; lastM=m; } });
  return {g,y,x0,sw,mT,ph,top,bot,end:()=>`<line x1="${mL}" x2="${Wd-mR}" y1="${y(0)}" y2="${y(0)}" stroke="#64748b" stroke-width="1.2"/>`};
}
function wkTip_(cx,cy,html){
  let t=$("wktip"); if(!t){ t=document.createElement("div"); t.id="wktip"; document.body.appendChild(t); }
  if(html==null){ t.style.display="none"; return; }
  t.innerHTML=html; t.style.display="block";
  const tw=t.offsetWidth, th=t.offsetHeight; let lx=cx+14, ly=cy+14;
  if(lx+tw>innerWidth-8) lx=cx-tw-14; if(ly+th>innerHeight-8) ly=cy-th-14;

/* 週ごとの透明な帯: 指を当てると中身・押すとその週を選ぶ */
function wkHit_(F,el,tipFn){

  return {svg:g, bind:()=>el.querySelectorAll("rect.wkhit").forEach(r=>{ const i=+r.dataset.i;
    r.addEventListener("mousemove",e=>wkTip_(e.clientX,e.clientY,tipFn(i)));

}

function wkDrawTrend_(st,dept){

function wkSym_(p){

  if(!p.st) return `<span class="sym none" title="棚卸を見るカテゴリが無い（委託・テナントだけ）">–</span>`;
  if(p.st==="入っている") return `<span class="sym ok" title="入っている">●</span>`;

function wkLossTable_(dept){
  const am=wkAreaMeta_(), months=[...new Set(Object.values(WK.A.inv||{}).flat().filter(p=>p.ft==="05-2"&&p.t>=WK.meta.weeks[0].start).map(p=>p.t.slice(0,7).replace("-","")))].sort();

function wkDrawInv_(st,dept){
  const el=$("wkinv"); if(!el) return;
  const pts=((WK.A.inv||{})[st+"|"+dept]||[]).filter(p=>p.t>=WK.meta.weeks[0].start);
  const W=WK.meta.weeks;
  const xOf=(F,t)=>{ const j=wkWeekOf_(t), ws=new Date(W[j].start+"T00:00:00"), d=new Date(t+"T00:00:00"); return F.x0(j)+((d-ws)/864e5+0.5)/7*F.sw; };
  const kf=t=>Math.round(t/1000).toLocaleString("ja-JP");
  if(wkBook_().includes(dept)){
    const F=wkFrame_(el,240,0,Math.max(...pts.map(p=>p.book||0),10000),kf);
    let g=F.g, d="";
    pts.forEach(p=>{ d+=(d?"L":"M")+xOf(F,p.t).toFixed(1)+" "+F.y(p.book||0).toFixed(1); });
    g+=`<path d="${d}" fill="none" stroke="#2a78d6" stroke-width="2"/>`;
    pts.forEach(p=>{ const x=xOf(F,p.t), y=F.y(p.book||0); g+=p.ft==="05-2"?`<path d="M${x} ${y-6}L${x+6} ${y}L${x} ${y+6}L${x-6} ${y}Z" fill="#0f172a"/>`:`<circle cx="${x}" cy="${y}" r="3" fill="#2a78d6"/>`; });
    el.innerHTML=g+F.end()+`</svg>`;
    const el2=$("wkloss"), me=pts.filter(p=>p.ft==="05-2"), lv=me.map(p=>-(p.loss||0));
    const F2=wkFrame_(el2,180,Math.min(...lv,-10000),Math.max(...lv,10000),kf);
    let g2=F2.g;
    me.forEach(p=>{ const v=-(p.loss||0), x=xOf(F2,p.t), bw=Math.max(8,F2.sw*0.5), y0=F2.y(0), y1=F2.y(v);
      g2+=`<path d="${wkBar_(x-bw/2,Math.min(y0,y1),bw,v>=0?(y0-y1):-(y1-y0))}" fill="${v<0?"#c62828":"#1565c0"}"/><text x="${x}" y="${v<0?y1+13:y1-4}" text-anchor="middle" font-size="11" fill="#334155">${v<0?"差損 "+WK_MINUS:"差益 +"}${Math.round(Math.abs(v)/1000).toLocaleString()}</text>`; });
    el2.innerHTML=g2+F2.end()+`</svg>`;
    return;
  }
  const F=wkFrame_(el,240,0,Math.max(...pts.map(p=>p.v||0),10000),kf);
  let g=F.g, d="";
  pts.forEach(p=>{ if(p.v>0&&(p.ft==="05-2"||p.st==="入っている")) d+=(d?"L":"M")+xOf(F,p.t).toFixed(1)+" "+F.y(p.v).toFixed(1); });
  g+=`<path d="${d}" fill="none" stroke="#2a78d6" stroke-width="1.5" opacity=".6"/>`;
  pts.forEach(p=>{ const x=xOf(F,p.t), y=F.y(p.v||0);
    if(p.ft==="05-2") g+=`<path d="M${x} ${y-6}L${x+6} ${y}L${x} ${y+6}L${x-6} ${y}Z" fill="#0f172a"><title>${wkMd_(p.t)} 月末確定 ${wkK_(p.v)}千円</title></path>`;
    else if(p.st==="入っている") g+=`<circle cx="${x}" cy="${y}" r="4.5" fill="#2a78d6"><title>${wkMd_(p.t)} ${wkK_(p.v)}千円</title></circle>`;
    else if(p.st==="一部") g+=`<circle cx="${x}" cy="${y}" r="4" fill="#fff" stroke="#2a78d6" stroke-width="2"><title>${wkMd_(p.t)} 一部 ${wkK_(p.v)}千円・0: ${esc(p.miss||"")}</title></circle>`;
    else if(p.st){ const yb=F.y(0)-7; g+=`<path d="M${x-4} ${yb-4}L${x+4} ${yb+4}M${x+4} ${yb-4}L${x-4} ${yb+4}" stroke="#94a3b8" stroke-width="2"><title>${wkMd_(p.t)} 入っていない（0）</title></path>`; } });
  el.innerHTML=g+F.end()+`</svg>`;
}

    let n=0, ok=0, first=false;
    wkAreaMeta_().stores.forEach(s=>wkFresh_().forEach(d=>{ const x=wkInvWeek_(s.slug,d,i); if(!x) return; if(x.nth===1){ first=true; return; } n++; if(x.st==="入っている") ok++; }));
    if(first&&!n) return {now:`この週の回（${wkMd_(WK.meta.weeks[i].end)}）は月の最初の回で、どの店も生鮮の棚卸原価が入っていない（7月から毎月同じ＝店の入れ忘れではなく、仕組みの側の事情と見られる・推測）。`,next:"ひとつ前の週を選んで見る。",why:"月の最初の回に棚卸が無いと、月初の週の粗利は、次に棚卸の入った回まで確定しない。"};
    return {now:`${esc(S.area)}の生鮮 ${n} 店×部門のうち、入っている ${ok}・入っていない ${hits.filter(x=>x.k==="なし").length}・一部 ${hits.filter(x=>x.k==="一部").length}。部門ごと: ${esc(top(hits,x=>x.d))||"—"}。${tail}`,
      next:"入っていない店×部門に、週の棚卸をする運用か（月末だけにするか）を確かめる。一部の店は、0 のカテゴリ（新分類で分かれた冷惣菜・刺身・柵・その他精肉など）にも入れる。",
      why:"棚卸の入った回までの粗利は、受払の式でそのまま確定する。入っていない週の粗利は暫定（直近の確定の率 × 売上）になり、その週の売り方の工夫や値下げが粗利に見えない。"};
  }
  if(q.id==="inv_month"){ const longN=hits.filter(x=>(x.n||1)>=3).length;
    return {now:`${hits.length} か所（うち ${longN} か所は3か月以上続けて 0）。部門ごと: ${esc(top(hits,x=>x.d))||"—"}。${tail}`,
      next:"続けて 0 の所は、在庫を持たない売場（委託・テナント）かを確かめる（そうなら外す一覧に足す）。今月だけの所は、入力の漏れかを店に聞く。",
      why:"月末に棚卸原価が 0 だと、その月の在庫が無いものとして粗利が出る（確定の粗利が実際より低くなる）。続けて 0 なのは運用の型の合図で、入力漏れとは打ち手が違う。"}; }
  if(q.id==="inv_odd") return {now:`週 ${hits.filter(x=>x.k==="週").length} か所・月末 ${hits.filter(x=>x.k==="月末").length} か所。店ごと: ${esc(top(hits,x=>sn(x.s)))||"—"}。${tail}`,
      next:"当たった店×部門で、数えた日・数・単価の打ち間違いが無いかを確かめる。同じ店が何週も続けて当たるなら、数え方（時刻・範囲）を、ほかの店とそろえる。",
      why:"棚卸の数がずれると、その週と次の週の粗利が逆向きにずれる（足すと元に戻る）。続けて当たるのは数え方の癖の合図で、粗利の判断を誤らせる。"};
  if(q.id==="loss") return {now:`差損 ${hits.filter(x=>x.k==="差損").length} か所・差益 ${hits.filter(x=>x.k==="差益").length} か所（${pm?wkYm_(pm):""}）。カテゴリ: ${esc(top(hits,x=>x.c))||"—"}。${pm&&pm.endsWith("09")&&pm.startsWith("2026")?"9月は分類の切替の月で、帳簿がカテゴリの間を動いた分が混じる見込み（推測）。":""}${tail}`,
      next:"差損の大きいカテゴリから、値下げ・値引きの登録漏れと、破損・廃棄の記録を確かめる。差益は、数えすぎと仕入の計上漏れを確かめる。",
      why:"売価で在庫を持つ部門では、登録しなかった値下げも差損に出る。中身（登録漏れ・破損・万引き）が分かれば、ロスの打ち手（登録の徹底・陳列・発注）に分けられる。"};
  if(q.id==="missing") return {now:`${hits.length} か所。種類: ${esc(top(hits,x=>x.k))||"—"}。${tail}`,
      next:"欠け（回・店・カテゴリの行が無い）は、受払表の取り込みを確かめる（データの側）。0 や半分未満は、店に事情（休業・売場の改装・入力の漏れ）を聞く。",
      why:"欠けのまま差を取ると、その週が少なく、次の週が多く出る。欠けと 0 を分けると、データを直すのか、店に聞くのか、行き先が分かれる。"};
  if(q.id==="jump") return {now:`${hits.length} か所（値引き ${hits.filter(x=>x.k==="値引き").length}・廃棄 ${hits.filter(x=>x.k==="廃棄").length}）。部門ごと: ${esc(top(hits,x=>x.d))||"—"}。${tail}`,
      next:"まず、催事・特売の週か（狙った値引きか）を確かめる。狙っていない値引き・廃棄なら、入荷の量と見切りの時刻を、うまくいっている店のやり方と比べる。",
      why:"値引きは売り切るための手段で、多いこと自体が悪いとは限らない。狙った値引きか、売れ残りの値引きかで、次の手（発注を減らす・売り方を変える）が変わる。"};
  if(q.id==="neg") return {now:`${hits.length} か所（売上 ${hits.filter(x=>x.k.startsWith("売上")).length}・値引き ${hits.filter(x=>x.k.startsWith("値引き")).length}）。${tail}`,
      next:"前の週と足して打ち消しになっていれば、付け替え（実際の動き）なので、そのままでよい。打ち消しが無ければ、入力の誤りかを確かめる。",
      why:"マイナスの週をそのまま平均に入れると、ふだんの線（前4週の平均）がずれ、次の週が「急に増えた」に見える。"};
  return {now:`${hits.length} か所。部門ごと: ${esc(top(hits,x=>x.d))||"—"}。${tail}`,
    next:"まず、原価割れの特売（集客の目玉）だったかを確かめる。そうでなければ、仕入の単価・数量と月末の棚卸を確かめる。",
    why:"原価割れの特売は、粗利を削ってお客を呼ぶ手段で、悪いとは限らない（粗利を確かめてから続けるかを決める）。意図していない原価割れは、仕入か棚卸の誤り。"};
}
function wkTermsHtml_(){
  return `<details class="wk-card wkterms"><summary>ことば（週の数字・粗利の確定と暫定・棚卸）</summary><dl class="terms">`+
    `<div><dt>週の数字</dt><dd>受払表（05-4）は月初からの累計。前の回との差が、その週の数字（日曜締め）。月をまたぐ週は前月の月末確定とつなぐ。</dd></div>`+
    `<div><dt>週の粗利（確定）</dt><dd>受払の式（売上 −〔週の始めの在庫＋仕入 − 週の終わりの在庫〕）。月初の在庫は前の月末の実地棚卸。棚卸の入った回までは、月初からの粗利が確定する。</dd></div>`+
    `<div><dt>確定（まとめて）</dt><dd>回と回の間に棚卸が無い週は、棚卸の入った回までの合計（確定）を、売上の割合で週に割り振る。月末確定が届いた月も同じ。月の合計は月末確定の粗利と合う。</dd></div>`+
    `<div><dt>暫定</dt><dd>最後の棚卸の回より後の週。カテゴリの直近の確定の粗利率 × その週の売上。棚卸が入るか、月末確定が届くと替わる。</dd></div>`+
    `<div><dt>委託・テナント</dt><dd>生産者・テナント・生花など。在庫を持たず、売上に対して率が決まっている（仕入原価は月末にまとめて入る）。週ではいつも率で当てる＝月末確定が届くまでは、その店の過去の月末確定の粗利率 × 売上（「暫」）。累計の画面で委託の粗利に付く「(推定)」と同じ考え方。</dd></div>`+
    `<div><dt>棚卸が入っている</dt><dd>その回に、売上の9割以上を占めるカテゴリの棚卸原価が 0 でない。売上の無いカテゴリは外し、月の売上10万円未満のカテゴリは見ない。店の一覧は持たず、データで決まる。</dd></div>`+
    `<div><dt>差損・差益</dt><dd>帳簿 − 実施。正＝差損（帳簿より少ない）・負＝差益。日配・グロッサリー（売価で在庫を持つ部門）だけにある。</dd></div>`+
    `<div><dt>前4週の平均・4週の移動平均・前年同週</dt><dd>前4週の平均＝選んだ週の前の4週（今週と同じ範囲の店×カテゴリ）。4週の移動平均＝今週を含む4週。前年同週＝364日前の週（前年の月末確定を日数で割った推定）。</dd></div>`+
    `</dl></details>`;
}
