<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 多層防御(第零条実践規範§7-4): 出口封鎖CSP。connect/imgを自ドメイン＋Google認証系だけに限定し、
     万一XSSが通っても盗んだデータを外部へ送れない状態を作る。script/frameはGoogleログインを壊さぬよう寛容に。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://accounts.google.com https://apis.google.com; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://www.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com">
<title>ヒッスル（PDCA）</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  /* 前回開発機（acoop-platform /pdca・c-section-table.tsx）の見た目を踏襲 */
  :root{
    --border:#e2e8f0; --muted:#64748b; --fg:#0f172a; --card:#fff; --bg-muted:#f1f5f9;
    --sky50:#f0f9ff; --sky100:#e0f2fe; --sky700:#0369a1; --sky800:#075985;
    --emer100:#dcfce7; --emer800:#166534; --violet100:#ede9fe; --violet800:#5b21b6;
    --good:#1565c0; --bad:#c62828; --amber:#b45309;
    --total-dark:#263238; --subtotal:#f1f5f9;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;color:var(--fg);background:#fff;}
  header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40;}
  header .logo{background:#0f172a;color:#fff;font-weight:700;font-size:12px;border-radius:6px;padding:5px 7px;}
  header h1{font-size:15px;margin:0;} header .sub{font-size:11px;color:var(--muted);}
  header .user{margin-left:auto;font-size:11px;color:var(--muted);}
  .page{transition:background-color .3s;min-height:calc(100vh - 55px);}
  main{max-width:1400px;margin:0 auto;padding:20px 16px 40px;}
  h2.title{font-size:20px;font-weight:600;margin:0;} .subtitle{font-size:13px;color:var(--muted);margin:2px 0 0;}
  .btn{border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-size:13px;padding:6px 12px;color:#334155;}
  .btn.primary{background:#0284c7;border-color:#0284c7;color:#fff;font-weight:600;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  select{font-size:13px;padding:5px 7px;border:1px solid var(--border);border-radius:6px;background:#fff;}
  label.lb{font-size:11px;color:var(--muted);}

  /* 入室ゲート */
  .gate-wrap{display:flex;min-height:70vh;align-items:center;justify-content:center;padding:16px;}
  .card{width:100%;max-width:640px;border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .card .chead{padding:20px 20px 6px;text-align:center;}
  .card .cico{margin:0 auto 6px;width:40px;height:40px;border-radius:999px;background:var(--sky100);display:flex;align-items:center;justify-content:center;color:var(--sky700);font-size:20px;}
  .card h3{font-size:18px;margin:4px 0;} .card .cdesc{font-size:13px;color:var(--muted);}
  .card .cbody{padding:8px 20px 20px;}
  .roles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0;}
  .role{border:1px solid var(--border);border-radius:10px;padding:12px;text-align:left;cursor:pointer;background:#fff;transition:.15s;}
  .role:hover{background:#f8fafc;} .role.on{border-color:#0ea5e9;background:var(--sky50);box-shadow:0 0 0 1px #0ea5e9 inset;}
  .role .rt{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;}
  .role .rd{margin:6px 0 0;font-size:11px;line-height:1.4;color:var(--muted);}
  .gate-selects{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0;}
  .warn{color:var(--amber);font-size:12px;text-align:center;} .hint{color:var(--muted);font-size:12px;text-align:center;}

  /* 入室後バー */
  .asgbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:13px;}
  .asgbar .role-badge{border-radius:6px;padding:2px 8px;font-weight:600;}
  .rb-buyer{background:var(--sky100);color:var(--sky800);} .rb-admin{background:#fef3c7;color:#92400e;} .rb-viewer{background:#f1f5f9;color:#475569;} .rb-unei{background:#dcfce7;color:#166534;}

  /* モードタブ */
  .modes{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:18px 0 0;}
  .modes button{border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-size:13px;padding:6px 11px;color:#334155;}
  .modes button.on{background:#0284c7;border-color:#0284c7;color:#fff;font-weight:600;}
  /* 管理者用（データ管理）は閲覧系タブと明確に別物と分かるよう、右端へ隔離＋琥珀色の枠 */
  .modes .admin-sep{margin-left:auto;display:flex;align-items:center;gap:6px;padding-left:14px;border-left:2px dashed #e2e8f0;}
  .modes .admin-sep .lbl{font-size:10px;color:#b45309;font-weight:700;letter-spacing:.04em;white-space:nowrap;}
  .modes button.admin{border:1px solid #f59e0b;background:#fffbeb;color:#92400e;font-weight:700;}
  .modes button.admin:hover{background:#fef3c7;}
  .modes button.admin.on{background:#b45309;border-color:#b45309;color:#fff;}

  /* 選択バー・タブ */
  .selbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0;}
  .tabs2{display:flex;flex-wrap:wrap;gap:3px;margin:10px 0;}
  .tabs2 button{border:1px solid var(--border);border-radius:7px;background:#fff;cursor:pointer;font-size:12px;padding:4px 9px;color:#475569;}
  .tabs2 button.on{background:#0369a1;border-color:#0369a1;color:#fff;font-weight:600;}
  .chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;margin:10px 0;}
  .chip{border-radius:6px;padding:2px 8px;font-weight:700;}
  .chip.a{background:var(--sky100);color:var(--sky800);} .chip.d{background:var(--emer100);color:var(--emer800);} .chip.s{background:var(--violet100);color:var(--violet800);}
  .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:11px;color:var(--muted);margin:8px 0;align-items:center;}
  .legend .sw{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:middle;margin-right:3px;}
  .splitnote{font-size:12px;color:var(--muted);margin:6px 0 0;}
  .sokuho{display:flex;gap:8px;border-left:4px solid #f59e0b;background:#fffbeb;color:#78350f;padding:10px 14px;border-radius:8px;font-size:13px;margin:8px 0;}
  .note{font-size:13px;color:var(--muted);background:#fff;border:1px dashed var(--border);border-radius:10px;padding:14px;}
  .err{color:var(--bad);font-size:13px;padding:12px;}
  /* 注記（青）と警告（黄）。従来 .gnote は #guide 内にしか定義がなくガイド外で無装飾だったため、共通定義を置く */
  .gnote{background:var(--sky50);border:1px solid var(--sky100);border-radius:8px;padding:8px 11px;font-size:12.5px;line-height:1.7;color:var(--sky800);margin:8px 0 0;}
  .cmwarn{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 11px;font-size:12.5px;line-height:1.7;color:#78350f;margin:8px 0 0;}

  /* C表 */
  .tbl-wrap{max-height:70vh;overflow:auto;border:1px solid var(--border);border-radius:10px;background:#fff;}
  table.c{width:100%;border-collapse:collapse;font-size:12px;}
  table.c thead th{position:sticky;top:0;z-index:20;background:var(--bg-muted);color:var(--muted);font-weight:600;padding:6px 10px;text-align:right;border-left:1px solid var(--border);white-space:nowrap;}
  table.c thead th.h{text-align:left;left:0;z-index:30;} table.c thead th .u{font-size:10px;font-weight:400;color:#94a3b8;margin-left:2px;}
  table.c td{border-left:1px solid var(--border);border-top:1px solid var(--border);padding:2px 10px;vertical-align:top;text-align:right;}
  table.c td.h{text-align:left;font-weight:600;position:sticky;left:0;background:#fff;z-index:10;white-space:nowrap;}
  tr.total td{background:var(--total-dark);color:#fff;font-weight:700;border-top:2px solid #0f172a;}
  tr.total td.h{background:var(--total-dark);color:#fff;}
  tr.subtotal td{background:var(--subtotal);font-weight:600;} tr.subtotal td.h{background:var(--subtotal);}
  tr.datarow:hover td{background:#f8fafc;}
  .cell{display:flex;flex-direction:column;gap:1px;text-align:right;line-height:1.25;font-variant-numeric:tabular-nums;padding:3px 0;}
  .cell .act{font-weight:700;font-size:12px;background:rgba(224,242,254,.6);margin:0 -10px;padding:0 10px;}
  tr.total .cell .act{background:transparent;color:#fff;} .cell .prev{color:var(--muted);font-size:11px;}
  tr.total .cell .prev{color:#cbd5e1;}
  .cell .bud{color:var(--amber);font-size:11px;} tr.total .cell .bud{color:#fcd34d;}
  .g{color:var(--good);} .b{color:var(--bad);} .n{color:var(--muted);}
  tr.total .g{color:#7dd3fc;} tr.total .b{color:#fca5a5;}
  .badge{display:inline-block;border-radius:4px;padding:0 4px;font-size:10px;font-weight:500;margin-top:2px;}
  .bd-loss{background:#ffe4e6;color:#be123c;} .bd-inv{background:#ffedd5;color:#c2410c;}
  td.gp-neg{background:#fff7ed;} td.gp-loss{background:#fefce8;}
  .catcol{color:var(--muted);}
  input[type=number]{width:64px;font-size:13px;padding:4px 6px;border:1px solid var(--border);border-radius:6px;}

  /* コメントパネル（G2）・データ管理（G3） */
  .cmcard{border:1px solid var(--border);border-radius:12px;background:#fff;padding:12px 14px;margin-top:14px;}
  .cmhead{display:flex;gap:8px;align-items:baseline;margin-bottom:4px;flex-wrap:wrap;}
  .cmsechead{font-weight:600;font-size:13px;margin-bottom:6px;}
  .cmempty{color:var(--muted);font-size:12px;}
  /* 課題グリッド: 行=課題（①②…）× 列=A/P/D。済は行単位 */
  table.cmt{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}
  table.cmt th{background:var(--bg-muted);color:var(--muted);font-weight:600;padding:6px 8px;text-align:left;border:1px solid var(--border);}
  table.cmt td{border:1px solid var(--border);padding:6px 8px;vertical-align:top;background:#fff;}
  table.cmt td.cmmark{width:26px;text-align:center;}
  tr.cmresolved td{background:#f0fdf4;}
  .cmmark{font-size:13px;color:var(--sky700);padding-top:2px;}
  .cmtext{font-size:13px;white-space:pre-wrap;line-height:1.5;}
  .cmmeta{font-size:11px;color:var(--muted);margin-top:2px;}
  .cmbtns{display:flex;gap:4px;margin-top:2px;} .cmbtns .btn{padding:2px 8px;font-size:12px;}
  .cmadd{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap;}
  .cmcell{width:100%;min-height:26px;border:none;background:transparent;font-family:inherit;font-size:13px;line-height:1.5;resize:none;padding:2px 3px;outline:none;box-sizing:border-box;display:block;}
  .cmcell:focus{background:#fff;box-shadow:0 0 0 2px #7dd3fc inset;border-radius:4px;}
  .badge.bd-ok{background:#dcfce7;color:#166534;}

  /* アップロード進捗（フリーズ誤認の防止）: 押下感・スピナー・進捗バー・処理中オーバーレイ */
  .btn:active:not(:disabled){transform:scale(.97);}
  .btn.busy{position:relative;color:transparent !important;}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px;}
  .spin.dark{border-color:rgba(2,132,199,.3);border-top-color:#0284c7;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .upbox{margin-top:10px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#f8fafc;}
  .upbox .uphead{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#0f172a;}
  .upbar{height:8px;border-radius:999px;background:#e2e8f0;overflow:hidden;margin-top:8px;}
  .upbar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0284c7,#38bdf8);transition:width .25s;}
  .uplist{margin-top:8px;font-size:12px;line-height:1.7;}
  .uprow{display:flex;align-items:center;gap:6px;}
  .uprow .st{width:18px;text-align:center;}
  .uprow.done{color:#166534;} .uprow.fail{color:#b91c1c;} .uprow.wait{color:#94a3b8;} .uprow.now{color:#0369a1;font-weight:600;}
  .upnote{font-size:11px;color:var(--muted);margin-top:6px;}
  /* データ鮮度の警告バー（HQ側の同期・取込が止まった時に気づけるように） */
  #freshBar{display:flex;align-items:flex-start;gap:10px;background:#fef2f2;border-bottom:2px solid #fecaca;color:#7f1d1d;padding:10px 16px;font-size:13px;line-height:1.6;}
  #freshBar.warn{background:#fffbeb;border-bottom-color:#fde68a;color:#78350f;}
  #freshBar b{font-weight:700;}
  #busyOverlay{position:fixed;inset:0;background:rgba(15,23,42,.35);display:flex;align-items:center;justify-content:center;z-index:200;}
  #busyOverlay .bcard{background:#fff;border-radius:14px;padding:20px 26px;box-shadow:0 10px 30px rgba(0,0,0,.2);text-align:center;min-width:260px;}
  #busyOverlay .bttl{font-weight:700;font-size:14px;margin-top:10px;color:#0f172a;}
  #busyOverlay .bsub{font-size:12px;color:var(--muted);margin-top:4px;}
  /* ご利用ガイド（ヘッダー右上から開く） */
  header .ghelp{margin-left:10px;padding:4px 10px;font-size:12px;white-space:nowrap;border-color:var(--sky700);color:var(--sky800);background:var(--sky50);font-weight:600;}
  header .ghelp:hover{background:var(--sky100);}
  #guide{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;}
  #guide .gcard{background:#fff;border-radius:14px;width:100%;max-width:880px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.28);}
  #guide .ghead{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--border);}
  #guide .ghead h2{font-size:16px;margin:0;} #guide .ghead .gsub{font-size:11px;color:var(--muted);}
  #guide .gclose{margin-left:auto;}
  #guide .gbody{overflow:auto;padding:14px 20px 26px;}
  #guide h3{font-size:14px;margin:20px 0 6px;color:var(--sky800);border-left:4px solid var(--sky700);padding-left:8px;}
  #guide h3:first-child{margin-top:4px;}
  #guide p,#guide li{font-size:13px;line-height:1.75;color:#334155;margin:4px 0;}
  #guide ul{margin:4px 0 6px 20px;padding:0;}
  #guide .gnote{background:var(--sky50);border:1px solid var(--sky100);border-radius:8px;padding:9px 12px;font-size:12.5px;line-height:1.7;color:var(--sky800);margin:8px 0;}
  #guide .gwarn{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:9px 12px;font-size:12.5px;line-height:1.7;color:#92400e;margin:8px 0;}
  #guide .gadmin{display:inline-block;background:#fffbeb;border:1px solid #f59e0b;color:#92400e;font-size:10px;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle;}
  #guide table{border-collapse:collapse;width:100%;margin:8px 0;font-size:12.5px;}
  #guide th,#guide td{border:1px solid var(--border);padding:5px 9px;text-align:left;vertical-align:top;}
  #guide th{background:var(--bg-muted);white-space:nowrap;}
  #guide .gcell{display:inline-block;border:1px dashed var(--border);border-radius:6px;padding:6px 10px;background:#fff;line-height:1.5;}
  #guide .gcell .bud{color:var(--amber);font-size:11px;} #guide .gcell .act{font-weight:700;font-size:12px;}
  #guide .gcell .prev{color:var(--muted);font-size:11px;}
  /* 旧分類の受払表をアップロードするときの確認（PO 2026-09-18） */
  #ukeAsk{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:150;display:flex;align-items:center;justify-content:center;padding:16px;}
  #ukeAsk .acard{background:#fff;border-radius:14px;width:100%;max-width:620px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.28);}
  #ukeAsk .ahead{display:flex;align-items:center;gap:8px;padding:13px 18px;border-bottom:1px solid var(--border);font-size:15px;font-weight:700;color:#92400e;background:#fffbeb;border-radius:14px 14px 0 0;}
  #ukeAsk .abody{overflow:auto;padding:12px 18px;font-size:13px;line-height:1.75;color:#334155;}
  #ukeAsk .abody p{margin:6px 0;}
  #ukeAsk .alist{margin:6px 0;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:#f8fafc;font-size:12.5px;max-height:180px;overflow:auto;}
  #ukeAsk .alist .fn{color:var(--muted);font-size:11px;}
  #ukeAsk .anote{background:var(--sky50);border:1px solid var(--sky100);border-radius:8px;padding:7px 10px;font-size:12px;color:var(--sky800);}
  #ukeAsk .afoot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--border);}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;font-size:13px;padding:8px 16px;border-radius:8px;opacity:0;transition:opacity .3s;z-index:99;pointer-events:none;}
  #toast.bad{background:#b91c1c;}
  /* 店舗閲覧者の「閲覧/印刷」用・独自印刷機能（4ドメインのスプシ直開き不可への対応）。
     画面のUIはそのまま、印刷時だけ操作系を隠し内容を紙向けに整える。 */
  #printTitle{display:none;}
  #printTitle .ptitle{font-size:16px;font-weight:700;color:#0f172a;}
  #printTitle .psub{font-size:11px;color:#334155;margin-top:2px;}
  @media print{
    header, h2.title, .subtitle, .selbar, .asgbar, .modes, #storetabs, #scope .chips, #vSheetBox, #busyOverlay, #guide, #ukeAsk, #toast, .btn{display:none !important;}
    .page-break{page-break-before:always;}
    #printTitle{display:block !important;margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid #0f172a;}
    .page{background:#fff !important;min-height:auto !important;}
    main{padding:0 !important;max-width:none !important;}
    .cmcard{box-shadow:none !important;border:1px solid #94a3b8;break-inside:avoid;page-break-inside:avoid;margin-bottom:8px;}
    /* 印刷の重なり防止: 画面用の高さ制限(70vh)と sticky を解除（印刷では位置ずれ＝重なりの原因） */
    .tbl-wrap{overflow:visible !important;max-height:none !important;border:none !important;}
    table.c thead th, table.c td.h{position:static !important;}
    table.c thead th{background:#eef2f7 !important;}
    table.c, table.cmt{width:100% !important;}
    table.c td, table.c th{padding:1px 6px !important;}
    .cmcard{padding:8px !important;}
    body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    @page{size:A4 landscape;margin:10mm;}
  }

  /* ── 第2便: 押して掘り下げる（2026-10-16） ── */
  /* 段の地図（4つのモードを、押してつながる形で並べる。押せば直接その段へ） */
  .modes{align-items:stretch;}
  .tree{display:grid;grid-template-columns:auto 74px auto;grid-template-rows:auto 18px auto;align-items:center;padding:5px 10px;border:1px solid var(--border);border-radius:10px;background:#fff;}
  .lvbtn{display:flex;align-items:baseline;gap:6px;white-space:nowrap;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-size:13px;padding:3px 10px;color:#334155;text-align:left;min-height:30px;line-height:1.25;}
  .lvbtn:hover{background:#f0f9ff;border-color:#7dd3fc;}
  .lvbtn.on{background:#0284c7;border-color:#0284c7;color:#fff;font-weight:600;}
  .lvbtn .lvs{display:inline-block;font-size:11.5px;color:#475569;font-weight:400;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lvbtn.on .lvs{color:#e0f2fe;}
  .lvarr{font-size:11px;color:#475569;text-align:center;white-space:nowrap;line-height:1.2;}
  .lvarr b{display:block;font-size:14px;color:#0369a1;font-weight:700;}
  .lvdown{font-size:11px;color:#475569;padding-left:18px;white-space:nowrap;}
  .lvdown b{color:#0369a1;}
  .othermodes{display:flex;flex-direction:column;justify-content:center;gap:6px;}
  .modes .othermodes button{text-align:left;}

<script>
/* 起動エラー可視化＋該当ソース取得: エラー行の実物を画面に出す（同一オリジンの生HTMLをfetch）。 */
window.addEventListener("error", function(ev){
  var ln = ev.lineno || 0;
  var esc2 = function(s){ return String(s).replace(/[&<>]/g, function(c){ return c==="&"?"&amp;":c==="<"?"&lt;":"&gt;"; }); };
  var show = function(src){
    var a = document.getElementById("app");
    if (a) a.innerHTML = '<div class="err" style="white-space:pre-wrap;font-size:11px;line-height:1.5">起動エラー：' + esc2(ev.message||"不明") + '\n行' + ln + '\n--- 該当ソース（前後） ---\n' + src + '</div>';
  };
  try{
    fetch(location.href).then(function(r){ return r.text(); }).then(function(t){
      var lines = t.split("\n");
      var out = [];
      for (var i = Math.max(0, ln-4); i < Math.min(lines.length, ln+2); i++){ out.push((i+1) + ": " + esc2(lines[i])); }
      show(out.join("\n"));
    }).catch(function(e){ show("(ソース取得失敗: " + esc2(e.message) + ")"); });
  }catch(e){ show("(取得例外: " + esc2(e.message) + ")"); }
});
</script>
<script>

/* ── OAuth2 認証（スマレコ方式: アクセストークン＋silent更新＋端末保存） ── */
let currentAccessToken=null, accessTokenExpiry=0, oauthTokenClient=null, tokenRefreshTimer=null, authedEmail="";
const TOKEN_STORE_KEY = "hissuru_oauth_token_v1";
function persistAccessToken_(){ try{ if(currentAccessToken&&accessTokenExpiry) localStorage.setItem(TOKEN_STORE_KEY, JSON.stringify({t:currentAccessToken,e:accessTokenExpiry})); }catch(e){} }
function restoreAccessToken_(){ try{ const raw=localStorage.getItem(TOKEN_STORE_KEY); if(!raw) return false; const o=JSON.parse(raw); if(!o||!o.t||!o.e||Date.now()>o.e-60000) return false; currentAccessToken=o.t; accessTokenExpiry=o.e; scheduleAccessTokenRefresh_(Math.floor((o.e-Date.now())/1000)+30); return true; }catch(e){ return false; } }
function clearStoredToken_(){ try{ localStorage.removeItem(TOKEN_STORE_KEY); }catch(e){} }
function ensureOAuthTokenClient_(){
  if(oauthTokenClient) return;
  if(!(window.google && google.accounts && google.accounts.oauth2)) throw new Error("Googleログイン部品が読み込めていません。ページを再読み込みしてください");
  oauthTokenClient = google.accounts.oauth2.initTokenClient({ client_id: CONFIG.GOOGLE_CLIENT_ID, scope: "openid email profile", callback: ()=>{} });
}
function requestAccessTokenOnce_(opts){
  return new Promise((resolve,reject)=>{
    try{ ensureOAuthTokenClient_(); }catch(e){ return reject(e); }
    const silent = !!(opts && opts.silent);
    let settled=false, guard=null;
    if(silent) guard=setTimeout(()=>{ if(!settled){ settled=true; reject(new Error("silent token timeout")); } }, 10000);
    oauthTokenClient.callback = (resp)=>{
      if(settled) return; settled=true; if(guard) clearTimeout(guard);
      if(!resp || resp.error || !resp.access_token) return reject(new Error((resp&&(resp.error_description||resp.error))||"トークン取得失敗"));
      currentAccessToken = resp.access_token;
      const ei = Number(resp.expires_in)||3600;
      accessTokenExpiry = Date.now() + (ei-30)*1000;
      persistAccessToken_(); scheduleAccessTokenRefresh_(ei);
      resolve(resp);
    };
    try{ const req={}; if(silent) req.prompt=""; oauthTokenClient.requestAccessToken(req); }
    catch(e){ if(!settled){ settled=true; if(guard) clearTimeout(guard); reject(e); } }

function scheduleAccessTokenRefresh_(expiresInSec){
  if(tokenRefreshTimer) clearTimeout(tokenRefreshTimer);

}
async function fetchUserInfo_(){
  if(!currentAccessToken) throw new Error("未ログイン");

  if(!res.ok) throw new Error("userinfo HTTP "+res.status);

}

/* ── GAS API 呼び出し（POST text/plain＝プリフライト回避・毎回トークン添付・期限切れは自動再取得） ── */
async function gsCall(fn, ...args){
  const noToken = !currentAccessToken, near = accessTokenExpiry && Date.now() > accessTokenExpiry - 60000;
  if(noToken || near){ try{ await requestAccessTokenOnce_({silent:true}); }catch(e){} }
  if(!currentAccessToken){ renderLogin_("セッションの有効期限が切れました。再度ログインしてください。"); throw new Error("セッション切れです"); }
  const res = await fetch(CONFIG.GAS_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=UTF-8" }, body: JSON.stringify({ action:fn, args:args, accessToken: currentAccessToken }), redirect:"follow" });
  if(!res.ok) throw new Error("HTTP "+res.status);
  const json = await res.json();
  if(json && json.error){
    if(String(json.error).indexOf("認証失敗")>=0){ currentAccessToken=null; accessTokenExpiry=0; clearStoredToken_(); }
    throw new Error(json.error);
  }
  return json.result;
}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* URLスキーム検証(第零条実践規範§7-2): href/src は引用符エスケープだけでなくスキームも許可リスト。

function safeUrl_(u){ u=String(u==null?"":u).trim(); return (/^https:\/\//i.test(u)||/^mailto:/i.test(u))?u:"#"; }

/* \u2500\u2500 データアダプタ（本番outbox命名＝HQ確定 / ローカルはサンプル） \u2500\u2500 */

const FB={area:{"北東北":"kitatohoku","北関東":"kitakanto","宮城":"miyagi","山形":"yamagata","首都圏":"shutoken"},
          dept:{"農産":"nosan","畜産":"chikusan","水産":"suisan","惣菜":"sozai","日配":"nippai","グロッサリー":"grocery","ベーカリー":"bakery"}};
const aslug=a=>SLUG.area[a]||FB.area[a]||a, dslug=d=>SLUG.dept[d]||FB.dept[d]||d, s8=s=>(s||"").slice(0,8);
/* 第2便: 読んだ表は、このページを開いている間だけ覚える（5分）。戻る・同じ店を開き直すときに、GAS へ取りに行かない＝すぐ出る。
   取込状況（status.json）は追いかけて読み直すので覚えない。失敗したものは覚えない（次に押したとき取り直す）。 */
// 覚える数は 200 まで（全部門の店の明細は1店で6つ読む＝17店で約100）。あふれたら、いちばん長く使っていないものから捨てる
const JCACHE=new Map(), JCACHE_TTL=5*60*1000, JCACHE_MAX=200;
function cached_(key,fn){
  if(/status\.json$/.test(key)) return fn();
  const now=Date.now(), hit=JCACHE.get(key);
  if(hit&&now-hit.t<JCACHE_TTL){ JCACHE.delete(key); JCACHE.set(key,hit); return hit.p; }   // 使ったものを後ろへ（捨てる順を、使っていない順に）
  const p=fn(); JCACHE.set(key,{t:now,p});
  p.catch(()=>{ if(JCACHE.get(key)&&JCACHE.get(key).p===p) JCACHE.delete(key); });
  if(JCACHE.size>JCACHE_MAX) JCACHE.delete(JCACHE.keys().next().value);

function loadJson(prod,sample){ return cached_("L|"+prod+"|"+sample,()=>loadJson0_(prod,sample)); }

/* 新分類（2026-09）で分かれた中分類は、前年は分かれていないので前年比を出さない（PO 決定 2026-09-22）。
   分け方は backend tools/convert_budget_newclass.py の SPLITS・FISH_TO と同じ。added＝新しくできた中分類。
   判定: added に今年の売上があり、前年の売上が無い → その組の全員を「—」にする（部門計の前年比はそのまま）。
   旧分類のデータ（added の行が無い）や、前年も分かれている年は、ふつうに前年比を出す。 */
const SPLIT_GROUPS=[
  {members:["温惣菜","冷惣菜"],added:["冷惣菜"]},
  {members:["一般食品","酒８％"],added:["酒８％"]},
  {members:["刺身・柵","鮮魚","塩干"],added:["刺身・柵"]},
];
/* salesOf(中分類名) → {current, yoy}（その部門・その列の売上）。無ければ null。前年比を出さない中分類の Set を返す */
function splitNoYoy(salesOf){
  const out=new Set();
  SPLIT_GROUPS.forEach(g=>{
    const cs=g.added.map(salesOf).filter(Boolean);
    const now=cs.some(c=>Math.abs(c.current||0)>=1), last=cs.some(c=>Math.abs(c.yoy||0)>=1);
    if(now&&!last) g.members.forEach(m=>out.add(m));
  });
  return out;
}
/* 部門ごとに行をまとめて、前年比を出さない (部門, 中分類) の Set を返す。sales(r) → {current, yoy} */
function splitNoYoyRows(rows,sales){
  const byDept={}; rows.forEach(r=>{ if(r.category!=null) (byDept[r.dept||""]=byDept[r.dept||""]||{})[r.category]=r; });
  const out=new Set();
  Object.entries(byDept).forEach(([d,cats])=>splitNoYoy(c=>cats[c]?sales(cats[c]):null).forEach(c=>out.add(d+"|"+c)));
  return out;
}
/* 前年が「推定」の月（POS の単品で新分類へ振り分け直した受払表。meta.json の estimated_months・2026-09-22）。
   分かれた組の前年に「前(推定)」を付け、表の下に注記を出す。推定の月そのものを見るときも注記を出す。 */
const estMonths=()=>{ const m=S.meta||{}; if(!m._estSet) m._estSet=new Set(m.estimated_months||[]); return m._estSet; };  // meta を読み直すと作り直される
const priorYm=ym=>ym?String(Number(String(ym).slice(0,4))-1)+String(ym).slice(4):"";
const SPLIT_MEMBERS=new Set(SPLIT_GROUPS.flatMap(g=>g.members));
const estPrior=(ym,cat)=>estMonths().has(priorYm(ym))&&SPLIT_MEMBERS.has(cat);
function estNote(ym){
  const e=estMonths(), lab=y=>`${String(y).slice(0,4)}年${Number(String(y).slice(4))}月`;
  if(e.has(ym)) return `<div class="splitnote">この月（${lab(ym)}）の数字は、POS の単品で新分類へ振り分け直した推定です（売上・値引はほぼ実績、粗利などは推定）。</div>`;
  if(e.has(priorYm(ym))) return `<div class="splitnote">前年（${lab(priorYm(ym))}）は、POS の単品で新分類へ振り分け直した推定です（売上・値引はほぼ実績、粗利などは推定）。「前(推定)」は新分類で分かれた中分類です。</div>`;
  return "";
}
function splitNote(cats){
  if(!cats.size) return "";
  return `<div class="splitnote">前年比が「—」の中分類（${esc([...cats].join("・"))}）は、新分類で分かれたものです。前年は分かれていないため比べられません。部門計の前年比で比べてください。</div>`;
}

/* 縦積みセル（金額=計/実績/前/計比/前比、率=実績/前/前差/計差） */
/* セルは全列とも「計 → 実績 → 前年 → 計画差 → 前年差」の5段固定。
   計画が無い列は空欄を置いて段数を揃える（列をまたいで実績が必ず同じ行に来るように）。 */
function cellHtml(cell,col,dark,noYoy,estP){
  if(!cell||cell.current==null) return `<div class="cell n">—</div>`;
  const hib=col.higher_is_better, cur=cell.current, yoy=cell.yoy, bud=cell.budget;
  const isRate=(col.type==="rate");
  const hasB=(bud!=null && bud!==0);
  const yDiff=cur-(yoy||0), pDiff=hasB?cur-bud:0;
  const fmt=v=>isRate?pct(v):kyen(v);
  let h=`<div class="cell">`;
  // ①計画
  h+= hasB ? `<div class="bud">計 ${fmt(bud)}</div>` : `<div class="bud">&nbsp;</div>`;
  // ②実績（この行が全列で揃う）
  h+=`<div class="act">${fmt(cur)}</div>`;
  // ③前年（新分類で分かれた中分類は前年と比べられないので「—」）
  h+=`<div class="prev">前${estP?"(推定)":""} ${noYoy?"—":fmt(yoy)}</div>`;
  // ④計画との差（上）
  h+= hasB
    ? `<div class="${judge(hib,pDiff)}">${isRate?`計差 ${ppt(pDiff)}`:`計比 ${ratio(cur,bud)} <span style="opacity:.8">${dkyen(pDiff)}</span>`}</div>`
    : `<div class="n">&nbsp;</div>`;
  // ⑤前年との差（下）
  h+= noYoy
    ? `<div class="n">${isRate?"前差":"前比"} —</div>`
    : `<div class="${judge(hib,yDiff)}">${isRate?`前差 ${ppt(yDiff)}`:`前比 ${ratio(cur,yoy)} <span style="opacity:.8">${dkyen(yDiff)}</span>`}</div>`;
  return h+`</div>`;
}

function legend(){
  return `<div class="legend"><span>セル: <b style="color:var(--fg)">実績</b> / 前年 / 前比（差分）・計＝予算</span>`+
    `<span><span class="sw" style="background:var(--good)"></span>改善</span>`+
    `<span><span class="sw" style="background:var(--bad)"></span>悪化</span>`+
    `<span class="badge bd-loss">\u26A0差損%</span><span class="badge bd-inv">\u26A0棚卸原価ゼロ</span></div>`;
}

/* カテゴリ縦積み表（shohin_detail）: \u25C6全体合計\u2192\u25B6部門小計\u2192カテゴリ行 */
/* opts.deptGo（第2便・運営部詳細の店）: 部門の小計の行を押すと、下の運営部の A・PD がその部門に替わる
   opts.deptGo==="sdept"（全部門・商品部詳細）: 部門の小計の行を押すと、その部門の明細と A・PD へ下りる
   opts.fold（全部門）: カテゴリの行をはじめたたむ（表の上の釦で出す） */
function renderSection(d,opts){
  const o=opts||{}, cols=d.columns;
  const dg=dept=>!o.deptGo?null:(o.deptGo==="sdept"
    ? {go:"sdept",a:dept,k:"d:"+dept,title:`押すと、${dept}の明細と A・PD（商品部詳細）`}
    : {go:"cdept",a:dept,k:"d:"+dept,title:`押すと、下の運営部の A・PD を ${dept} に替えます`});
  let h=(o.fold?`<div style="margin:0 0 6px"><button class="btn" data-fold>▸ カテゴリも出す</button> <span class="lb">部門の行を押すと、その部門の明細と A・PD へ</span></div>`:"")+
    `<div class="tbl-wrap"><table class="c${o.fold?" foldcats":""}"><thead><tr>`+
    `<th class="h" style="left:0">部門</th><th class="h" style="left:56px">カテゴリ</th>`+
    cols.map(c=>`<th>${esc(c.label)}<span class="u">${c.type==="amount"?"千円":"%"}</span></th>`).join("")+`</tr></thead><tbody>`;
  /* 部門絞込データの grand_total は部門合計の重複（ラベルだけ「全部門合計」）のため表示しない */
  const dup=d.grand_total&&(d.dept_totals||[]).length===1&&
    (d.grand_total.cells.sales_month||{}).current===(d.dept_totals[0].cells.sales_month||{}).current;
  if(d.grand_total&&!dup) h+=totalRow(d.grand_total,cols,true,2);
  const dtMap={}; (d.dept_totals||[]).forEach(t=>dtMap[t.dept]=t);
  const noYoy=splitNoYoyRows(d.rows,r=>(r.cells||{}).sales_month||null), noted=new Set();
  let prevDept=null;
  d.rows.forEach(r=>{
    if(r.dept!==prevDept && dtMap[r.dept]){ h+=totalRow(dtMap[r.dept],cols,false,2,dg(r.dept),
      (r.dept===S.dept&&o.deptGo)?" curdept":""); }
    prevDept=r.dept;
    const ny=noYoy.has((r.dept||"")+"|"+r.category); if(ny) noted.add(r.category);
    const ep=estPrior(d.ym,r.category);
    h+=`<tr class="datarow${o.fold?" catrow":""}"><td class="h" style="left:0"></td><td class="h catcol" style="left:56px">${esc(r.category)}`;
    if(r.alerts&&r.alerts.loss_alert) h+=`<br><span class="badge bd-loss">\u26A0差損${(r.alerts.loss_rate||0).toFixed(1)}%</span>`;
    if(r.alerts&&r.alerts.inv_cost_zero) h+=`<br><span class="badge bd-inv">\u26A0棚卸原価ゼロ</span>`;
    h+=`</td>`;
    h+=cols.map(c=>{
      let cls=""; if(c.key==="gross_profit_month"&&r.alerts){ cls=r.alerts.gp_negative?" gp-neg":(r.alerts.loss_alert?" gp-loss":""); }
      return `<td class="${cls}">${cellHtml(r.cells[c.key],c,false,ny,ep)}</td>`;
    }).join("");
    h+=`</tr>`;
  });
  return h+`</tbody></table></div>`+splitNote(noted)+estNote(d.ym);
}
function totalRow(t,cols,dark,hspan,g,cls){
  return `<tr class="${dark?"total":"subtotal"}${g?" go":""}${cls||""}"${goAttr_(g)}><td class="h" colspan="${hspan}" style="left:0">${goLabel_(t.label,g)}</td>`+
    cols.map(c=>`<td>${cellHtml(t.cells[c.key],c,dark)}</td>`).join("")+`</tr>`;
}
/* 集計表（by_store 行=店舗 / by_dept 行=部門）: \u25C6合計\u2192行 */
/* ── 全部門（計）（2026-10-16b・PO「全部門計もわかるように」）──
   部門の選ぶ欄の「全部門（計）」。数は、部門ごとの数（届いている表の数）を足し、率は足した額から出し直す（前年・予算も同じ）。
   率の分母は売上（粗利率＝粗利÷売上・値引率＝値引÷売上・廃棄率＝廃棄÷売上。届いている表の率と同じ出し方。分母が 0 なら 0）。
   A・PD は部門ごとの欄なので、全部門の画面では書かない（部門を選ぶ近道を出す）。 */
const ALL_DEPT="__all__";
const isAll_=d=>d===ALL_DEPT;
const deptLabel_=d=>isAll_(d)?"全部門":d;
const RATE_OF={gross_profit_rate_month:["gross_profit_month","sales_month"],discount_rate:["discount_amount","sales_month"],discard_rate:["discard_amount","sales_month"]};
function sumCells_(list,cols){
  const F=["current","yoy","budget"], out={};
  const keys=new Set(cols.filter(c=>c.type!=="rate").map(c=>c.key)); Object.values(RATE_OF).forEach(p=>p.forEach(k=>keys.add(k)));
  keys.forEach(k=>{ const o={type:"amount"}; let any=false;
    F.forEach(f=>{ let s=null; list.forEach(cs=>{ const v=((cs||{})[k]||{})[f]; if(v!=null) s=(s||0)+v; }); if(s!=null){ o[f]=s; any=true; } });
    out[k]=any?o:null; });
  cols.filter(c=>c.type==="rate").forEach(c=>{ const p=RATE_OF[c.key], o={type:"rate"}; let any=false;
    if(p) F.forEach(f=>{ const n=(out[p[0]]||{})[f], d=(out[p[1]]||{})[f]; if(n!=null&&d!=null){ o[f]=d?n/d*100:0; any=true; } });
    out[c.key]=any?o:null; });
  return out;
}
/* 6部門の表をそろえて読む（無い部門は飛ばす）。手元ではサンプルへ落とさない（足し算に別のデータを混ぜない） */
const allPath_={
  byStore:(d)=>`c/by_store__${aslug(S.area)}__${dslug(d)}__${S.ym}__${s8(S.snap)}.json`,
  detail:(d,slug)=>`c/shohin_detail__${aslug(S.area)}__${dslug(d)}__${S.ym}__${s8(S.snap)}${slug?"__"+slug:""}.json`
};
function loadAllDepts_(pathOf){ return Promise.all(S.meta.departments.map(d=>loadJsonStrict(pathOf(d)).catch(e=>{ if(isNoFile(e)) return null; throw e; }))); }
/* 商品部全体 × 全部門: 行＝店（＋◆全店舗合計）・列＝いまと同じ指標 */
async function allByStore_(){
  const parts=(await loadAllDepts_(allPath_.byStore)).filter(Boolean);
  if(!parts.length) throw new Error("未収載: 全部門の店の表");
  const cols=parts[0].columns, by={}, order=[];
  parts.forEach(p=>(p.rows||[]).forEach(r=>{ const k=r.store_full||r.store; if(!by[k]){ by[k]={store:r.store,store_full:r.store_full,label:r.label,list:[]}; order.push(k); } by[k].list.push(r.cells); }));
  const rank=k=>{ const i=(S.stores||[]).findIndex(s=>s.full===k); return i<0?9999:i; };
  order.sort((a,b)=>rank(a)-rank(b));
  return {dept:"全部門",columns:cols,ym:parts[0].ym,
    rows:order.map(k=>({store:by[k].store,store_full:by[k].store_full,label:by[k].label,cells:sumCells_(by[k].list,cols)})),
    grand_total:{label:"◆ 全店舗合計（全部門）",cells:sumCells_(parts.map(p=>(p.grand_total||{}).cells),cols)}};
}
/* 商品部詳細 × 全部門: 行＝部門（その下のカテゴリはたたむ）＋◆全部門合計。店（slug）かエリア合計（slug 無し） */
async function allDetail_(slug){
  const parts=(await loadAllDepts_(d=>allPath_.detail(d,slug))).filter(Boolean);
  if(!parts.length) throw new Error("未収載: 全部門の明細");
  const cols=parts[0].columns, dts=parts.flatMap(p=>p.dept_totals||[]);
  return {...parts[0], rows:parts.flatMap(p=>p.rows||[]), dept_totals:dts,
    grand_total:{label:"◆ 全部門合計",cells:sumCells_(dts.map(t=>t.cells),cols)}};
}
/* 全部門の画面で A・PD の欄の代わりに出す一言と、部門を選ぶ近道（押すとその部門の欄へ） */
function allDeptNote_(){
  const who=S.mode==="運営部詳細"?"運営部":"商品部";
  return `<div class="allnote"><span>✎ ${who}の A・PD は部門ごとです。部門を選ぶと、ここに出ます（書ける担当は、そのまま書けます）：</span>`+
    S.meta.departments.map(d=>`<button class="btn" data-go="cdept" data-a="${esc(d)}" data-k="n:${esc(d)}">${esc(d)}</button>`).join("")+`</div>`;
}

/* 押して下りる所の印（第2便）。data-go＝行き先の種類・data-a/b＝引数・data-k＝戻ったときに光らせる目印 */
function goAttr_(g){ return g?` data-go="${esc(g.go)}" data-a="${esc(g.a||"")}" data-b="${esc(g.b||"")}" data-k="${esc(g.k||"")}" title="${esc(g.title||"")}"`:""; }
function goLabel_(t,g){ return g?`<span class="gl">${esc(t)}</span><span class="gch" aria-hidden="true">›</span>`:esc(t); }
/* opts（第2便）: rowGo(r)＝その行を押した先（無ければ押せない）・totalGo＝合計の行・headGo(c)＝列の見出しを押した先・rowCls(r)＝行に足すクラス */
function renderRollup(d,headLabel,labelOf,opts){
  const o=opts||{}, cols=d.columns;
  let h=`<div class="tbl-wrap"><table class="c"><thead><tr><th class="h" style="left:0">${esc(headLabel)}</th>`+
    cols.map(c=>{ const g=o.headGo?o.headGo(c):null;
      return `<th${g?` class="go"`:""}${goAttr_(g)}>${esc(c.label)}<span class="u">${c.type==="amount"?"千円":"%"}</span>${g?`<span class="gch" aria-hidden="true">›</span>`:""}</th>`; }).join("")+`</tr></thead><tbody>`;
  const tg=o.totalGo||null;
  if(d.grand_total) h+=`<tr class="total${tg?" go":""}"${goAttr_(tg)}><td class="h" style="left:0">${goLabel_(d.grand_total.label||"\u25C6 合計",tg)}</td>`+cols.map(c=>`<td>${cellHtml(d.grand_total.cells[c.key],c,true)}</td>`).join("")+`</tr>`;
  d.rows.forEach(r=>{
    const g=o.rowGo?o.rowGo(r):null;
    h+=`<tr class="datarow${g?" go":""}${o.rowCls?o.rowCls(r):""}"${goAttr_(g)}><td class="h" style="left:0">${goLabel_(labelOf(r),g)}</td>`+cols.map(c=>{
      let cls=""; if(c.key==="gross_profit_month"&&r.alerts){ cls=r.alerts.gp_negative?" gp-neg":(r.alerts.loss_alert?" gp-loss":""); }
      return `<td class="${cls}">${cellHtml(r.cells[c.key],c,false)}</td>`;
    }).join("")+`</tr>`;
  });
  return h+`</tbody></table></div>`;
}
/* 運営部全体（逆ピボット 行=部門/カテゴリ \u00D7 列=店舗・指標選択） */
let _uneibu=null;
/* 第2便: 指標は切り替えのタブ（7つ）。商品部全体で押した列の見出しが、ここで選ばれた状態で開く */
function renderUneibu(d){
  _uneibu=d;
  if(!d.columns.some(c=>c.key===S.metric)) S.metric=d.columns[0].key;
  const tabs=d.columns.map(c=>`<button class="${c.key===S.metric?"on":""}" data-go="umetric" data-a="${esc(c.key)}" data-k="m:${esc(c.key)}">${esc(c.label)}</button>`).join("");
  return `<div class="mtabs" id="uMetricTabs"><span class="lb">指標</span>${tabs}<span class="lb" style="margin-left:6px">行＝部門・カテゴリ × 列＝店</span></div><div id="uTbl"></div>`;
}
function drawUneibu(mkey){
  const d=_uneibu,col=d.columns.find(c=>c.key===mkey)||d.columns[0],st=d.stores||[];
  mkey=col.key;
  const hd=(full,label)=>{ const g={go:"unei",a:full,k:"h:"+(full||"__total__"),title:`押すと、${full?label:"エリア合計"}の全部門の明細と、運営部の A・PD（運営部詳細）`};
    return `<th class="go"${goAttr_(g)}>${esc(label)}<span class="gch" aria-hidden="true">›</span></th>`; };
  let h=`<div class="tbl-wrap"><table class="c"><thead><tr><th class="h" style="left:0">部門・カテゴリ</th>${hd("","合計")}`+st.map(s=>hd(s.full,s.short)).join("")+`</tr></thead><tbody>`;
  /* 前年比を出さない中分類は、列（合計・店舗）ごとに判定する（店によって分かれ方が違うため） */
  const cats=d.rows.filter(r=>r.type!=="dept");
  const nyGrand=splitNoYoyRows(cats,r=>(r.grand||{}).sales_month||null), nyStore={};
  st.forEach(s=>nyStore[s.short]=splitNoYoyRows(cats,r=>((r.stores||{})[s.short]||{}).sales_month||null));
  const noted=new Set();
  /* マスを押す＝その店の運営部詳細を、その行の部門で開く（部門の行・カテゴリの行とも）。合計の行は部門を変えない */
  const cell=(full,dept,inner,k)=>`<td class="gocell" data-go="unei" data-a="${esc(full)}" data-b="${esc(dept||"")}" data-k="${esc(k)}">${inner}</td>`;
  /* 全部門計（2026-10-16b）: いちばん上に。6部門の行の足し算（率は足した額から）＝商品部全体の全部門と同じ数。
     届いた表の下の合計の行は出さない（回によっては ＳＭ外・経費 など6部門の外の行を含むため。その行は表には残し、下に一言） */
  const deptRows=d.rows.filter(r=>r.type==="dept"&&S.meta.departments.includes(r.dept));
  const outside=[...new Set(d.rows.filter(r=>r.type==="dept"&&!S.meta.departments.includes(r.dept)).map(r=>r.dept))];
  if(deptRows.length){
    const gAll=sumCells_(deptRows.map(r=>r.grand),d.columns);
    h+=`<tr class="total${isAll_(S.dept)?" curdept":""}" data-k="d:${ALL_DEPT}"><td class="h" style="left:0">◆ 全部門計</td>${cell("","",cellHtml(gAll[mkey],col,true),"c:__total__|all")}`+
      st.map(s=>{ const c=sumCells_(deptRows.map(r=>(r.stores||{})[s.short]),d.columns); return cell(s.full,"",cellHtml(c[mkey],col,true),"c:"+s.full+"|all"); }).join("")+`</tr>`;
  } else if(d.grand_total){ const gt=d.grand_total;   // 部門の行が無い表は、届いた合計の行をそのまま
    h+=`<tr class="total" data-k="d:${ALL_DEPT}"><td class="h" style="left:0">◆ 全部門計</td>${cell("","",cellHtml((gt.grand||{})[mkey],col,true),"c:__total__|all")}`+st.map(s=>cell(s.full,"",cellHtml((gt.stores&&gt.stores[s.short]||{})[mkey],col,true),"c:"+s.full+"|all")).join("")+`</tr>`; }
  d.rows.forEach((r,ri)=>{
    const k=(r.dept||"")+"|"+r.category, isCat=r.type!=="dept";
    const ny=set=>{ const v=isCat&&set.has(k); if(v) noted.add(r.category); return v; };
    const cur=(r.dept===S.dept)?" curdept":"";

/* 事業部会議（18列2段＋前年比較3列） */
function cmpCell(cur,prev,isRate,hib,noYoy,estP){
  if(cur==null) return `<div class="cell n">\u2014</div>`;
  if(noYoy) prev=null;  // 新分類で分かれた中分類は前年と比べない
  const cls=prev!=null?judge(hib,cur-prev):"n";
  let h=`<div class="cell"><div class="act ${cls}">${isRate?pct(cur):kyen(cur)}</div>`;
  if(prev!=null){ const c=isRate?ppt(cur-prev):ratio(cur,prev); h+=`<div class="prev">前${estP?"(推定)":""} ${isRate?pct(prev):kyen(prev)}（${c}）</div>`; }
  else if(noYoy) h+=`<div class="prev">前 \u2014</div>`;
  return h+`</div>`;
}
function renderJigyo(d){
  const cols=d.columns, cmp=d.compare||[]; const grp=[];
  cols.forEach(c=>{ const g=c.group||""; if(g===""&&grp.length) grp[grp.length-1].span++; else grp.push({g,span:1}); });
  const fv=(c,v)=>v==null?"\u2014":(c.type==="rate"?pct(v):kyen(v));
  let h=`<div class="tbl-wrap"><table class="c"><thead><tr><th class="h" rowspan="2" style="left:0">部門・カテゴリ</th>`+
    grp.map(g=>`<th colspan="${g.span}" style="text-align:center">${esc(g.g)}</th>`).join("")+(cmp.length?`<th colspan="${cmp.length}" style="text-align:center">前年比較</th>`:"")+`</tr><tr>`+
    cols.map(c=>`<th>${esc(c.sub_header||"")}</th>`).join("")+cmp.map(c=>`<th>${esc(c.label)}</th>`).join("")+`</tr></thead><tbody>`;
  const noYoy=splitNoYoyRows(d.rows.filter(r=>r.type!=="dept"),r=>({current:(r.values||{}).sales_month,yoy:(r.yoy||{}).sales_month})), noted=new Set();
  const row=(r,cls)=>{ const v=r.values||{},y=r.yoy||{};
    const ny=r.type==="category"&&noYoy.has((r.dept||"")+"|"+r.category); if(ny) noted.add(r.category);
    const ep=r.type==="category"&&estPrior(d.ym,r.category);
    return `<tr class="${cls}"><td class="h" style="left:0">${esc(r.label)}</td>`+cols.map(c=>`<td>${fv(c,v[c.key])}</td>`).join("")+cmp.map(c=>`<td>${cmpCell(v[c.key],y[c.key],c.type==="rate",c.higher_is_better,ny,ep)}</td>`).join("")+`</tr>`; };
  d.rows.forEach(r=>h+=row(r,r.type==="dept"?"subtotal":"datarow"));
  if(d.grand) h+=row({label:d.grand.label||"\u25C6 合計",values:d.grand.values,yoy:d.grand.yoy},"total");
  return h+`</tbody></table></div>`+splitNote(noted)+estNote(d.ym);
}
/* 仕入分析（目標粗利率・在庫日数\u2192計算・\u00B110%色） */
const BDAYS=25; let _shiire=null;
const shKey=()=>`sh_${S.area}_${S.dept}`;
function renderShiire(d){
  _shiire=d; let cfg={gp:30,inv:2}; try{const s=localStorage.getItem(shKey());if(s)cfg=JSON.parse(s);}catch(e){}
  setTimeout(()=>{ if($("shGp")){ $("shGp").value=cfg.gp; $("shInv").value=cfg.inv; const on=()=>{const gp=parseFloat($("shGp").value)||0,inv=parseFloat($("shInv").value)||0;try{localStorage.setItem(shKey(),JSON.stringify({gp,inv}));}catch(e){}drawShiire(gp,inv);}; $("shGp").oninput=on;$("shInv").oninput=on; drawShiire(cfg.gp,cfg.inv);} },0);
  return `<div class="note" style="margin-bottom:8px">目標粗利率と在庫日数から「月間原価・目標在庫・目標仕入」を計算（営業日数=${BDAYS}）。仕入が目標\u00B110%外は色付き（青=少/赤=多/緑=適正）。</div>`+
    `<div style="margin-bottom:8px">目標粗利率 <input id="shGp" type="number" step="0.1">%　在庫日数 <input id="shInv" type="number" step="0.1">日</div><div id="shTbl"></div>`;
}
function drawShiire(gp,inv){
  const d=_shiire; const calc=r=>{const mc=(r.sales||0)*(1-gp/100);const ti=mc/BDAYS*inv;return{mc,ti,tp:mc+ti-(r.carryover||0)};};
  const cols=["店舗","売上","繰越","在庫原価","仕入","実績粗利率","月間原価","目標在庫","目標仕入"];
  let h=`<div class="tbl-wrap"><table class="c"><thead><tr>`+cols.map((c,i)=>`<th class="${i===0?'h':''}" ${i===0?'style="left:0"':''}>${c}</th>`).join("")+`</tr></thead><tbody>`;
  const row=(r,g)=>{const c=calc(r);let pc="";if(c.tp>0){const rt=(r.purchase||0)/c.tp;pc=rt>1.1?"background:#ffe4e6":rt<0.9?"background:#e0f2fe":"background:#dcfce7";}
    return `<tr class="${g?'total':(r.is_merged?'subtotal':'datarow')}"><td class="h" style="left:0">${esc(r.label||(g?"\u25C6 合計":r.short||""))}</td>`+
      `<td>${kyen(r.sales||0)}</td><td>${kyen(r.carryover||0)}</td><td>${kyen(r.inv_cost||0)}</td><td>${kyen(r.purchase||0)}</td>`+
      `<td>${r.actual_gp_rate!=null?r.actual_gp_rate.toFixed(2)+"%":"\u2014"}</td><td>${kyen(c.mc)}</td><td>${kyen(c.ti)}</td><td style="${pc}">${kyen(c.tp)}</td></tr>`;};
  d.rows.forEach(r=>h+=row(r,false)); if(d.grand) h+=row(d.grand,true);
  $("shTbl").innerHTML=h+`</tbody></table></div>`;
}

/* ── 表示データの鮮度チェック ──
   outbox(meta.json) の最終更新が古い＝HQ側の同期/取込が止まっている可能性。
   2026-07-18 に同期が4日間停止し、ユーザーが「アップロードしたのに反映されない」と気づけなかった事故を受けて追加。 */
/* 判定と描画（純粋関数・単体で検証可能）: 24時間以上古ければバーを出す。3日以上は赤 */
function renderFreshBar_(metaUpdated){
  const old=$("freshBar"); if(old) old.remove();
  if(!metaUpdated) return false;
  const t=new Date(String(metaUpdated).replace(/-/g,"/"));   // "yyyy-MM-dd HH:mm:ss"
  if(isNaN(t)) return false;
  const hours=(Date.now()-t.getTime())/36e5;
  if(hours<24) return false;                // 1日以内は正常（通常は5分毎に更新される）
  const days=Math.floor(hours/24);
  const bar=document.createElement("div");
  bar.id="freshBar"; bar.className = hours>=72 ? "" : "warn";   // 3日以上は赤・それ未満は黄
  bar.innerHTML=`<span>${hours>=72?"🔴":"⚠️"}</span><span><b>表示中のデータは ${esc(metaUpdated)} 時点のものです（約${days}日前）。</b>`+
    `本部側のデータ更新が停止している可能性があります。新しくアップロードした受払CSV・予算はまだ反映されていません。`+
    `<br>お手数ですが、この表示が続く場合は本部（システム担当）へご連絡ください。</span>`;
  const page=$("page");
  if(page && page.parentNode) page.parentNode.insertBefore(bar, page);
  return true;
}

  catch(e){ /* 鮮度が取れなくても本体の利用は妨げない */ }
}

  if(S.role==="lead") S.dept=ALL_DEPT;   // 責任者は、はじめから全部門（計）（PO 2026-10-16）。ほかの担当は担当部門から
  S.entered=true; navInit_(); show_({why:"入室"});
}

/* ══ 第2便: 押して掘り下げる ══
   段: 商品部全体（基本）─店を押す→ 商品部詳細
        └ 列の見出し（指標）を押す → 運営部全体 ─店を押す→ 運営部詳細
   戻る: 「← ひとつ前に戻る」1本。見方を変える操作（下りる・段の地図・店のタブ・エリア・年月・期間・部門・指標）は、
         すべてブラウザの履歴に1つずつ積む。ブラウザの戻ると同じ動き。戻ると、押した所へ帰って光る。 */
const TREE=["商品部全体","商品部詳細","運営部全体","運営部詳細"];
const START_BY_ROLE={buyer:"商品部全体",lead:"商品部全体",viewer:"商品部全体",unei:"運営部全体"};
const METRICS=[{key:"sales_month",label:"売上"},{key:"gross_profit_month",label:"粗利"},{key:"gross_profit_rate_month",label:"粗利率"},
  {key:"discount_amount",label:"値引き"},{key:"discount_rate",label:"値引率"},{key:"discard_amount",label:"廃棄額"},{key:"discard_rate",label:"廃棄率"}];
const LV_TIP={
  "商品部全体":"店ごとに、選んだ部門（または全部門の計）の数字を並べます（はじめの画面）",
  "商品部詳細":"店（またはエリア合計）× 部門の、カテゴリの明細と、商品部の A・PD",
  "運営部全体":"部門・カテゴリ × 店で、1つの指標を並べます",
  "運営部詳細":"店（またはエリア合計）の全部門の明細と、運営部の A・PD"
};
const NAV={seq:0,land:null,trail:[],cmDrawn:-1,histLand:null};   // cmDrawn＝A・PD の欄を描いた番号・histLand＝欄が出てから着く所（履歴）
function metricLabel_(k){ const m=METRICS.find(x=>x.key===(k||S.metric)); return m?m.label:"売上"; }
function storeShortOf_(slug){ if(!slug||slug==="__total__") return "エリア合計"; const s=(S.stores||[]).find(x=>x.slug===slug); return s?s.short:"店"; }
function slugOfFull_(full){ if(!full) return "__total__"; const s=(S.stores||[]).find(x=>x.full===full); return s?s.slug:null; }
function viewState_(){ return {mode:S.mode,area:S.area,ym:S.ym,snap:S.snap,dept:S.dept,storeTab:S.storeTab,metric:S.metric,hist:!!S.hist}; }
function describe_(v){
  if(!v) return "";
  const st=storeShortOf_(v.storeTab);
  if(v.mode==="商品部全体") return `商品部全体（${deptLabel_(v.dept)}）`;
  if(v.mode==="商品部詳細") return `商品部詳細（${st}・${deptLabel_(v.dept)}）${v.hist&&!isAll_(v.dept)?"・🕘 履歴":""}`;
  if(v.mode==="運営部全体") return `運営部全体（${metricLabel_(v.metric)}）`;
  if(v.mode==="運営部詳細") return `運営部詳細（${st}）${v.hist&&!isAll_(v.dept)?"・🕘 履歴":""}`;
  if(v.mode==="店舗事業部会議") return `店舗事業部会議（${st}）`;
  return v.mode;
}
function curNav_(){ try{ return (history.state&&history.state.hissuru)||null; }catch(e){ return null; } }
function navInit_(){
  NAV.trail=[viewState_()];
  try{ history.replaceState({hissuru:{v:viewState_(),d:0}},""); }catch(e){}
}
function scrollState_(){ const w=document.querySelector("#body .tbl-wrap"); return {y:window.scrollY,tx:w?w.scrollLeft:0,ty:w?w.scrollTop:0}; }
/* 見方を変える: いまの見方（と、いまの位置・押した所）を履歴に残してから変える */
function nav_(patch,o){
  o=o||{};
  const cur=curNav_()||{v:viewState_(),d:0}, d=cur.d||0;
  const here=Object.assign({},cur,{v:viewState_(),sc:scrollState_(),from:o.from||""});
  try{ history.replaceState({hissuru:here},""); }catch(e){}
  NAV.trail[d]=here.v;
  Object.assign(S,patch);
  try{ history.pushState({hissuru:{v:viewState_(),d:d+1}},""); }catch(e){}
  NAV.trail.length=d+1; NAV.trail[d+1]=viewState_();
  if(o.light){ drawNav_(); o.light(); return; }   // 見方の一部だけ（🕘 履歴の開け閉め）: 表は描き直さず、A・PD の欄だけ組み直す
  show_({why:o.why||"",land:o.land||"",from:o.from||""});
}
/* ブラウザが覚える履歴は 50 まで（Chrome）。それより前の所は消えているので、戻れなかったら釦を薄くする（押しても動かない、にしない） */
function goBack_(){
  const c=curNav_(); if(!(c&&c.d>0)) return;
  const d=c.d; history.back();
  setTimeout(()=>{ const n=curNav_(), b=$("navBack"); if(n&&n.d===d&&b){ b.disabled=true; b.title="これより前には戻れません（ブラウザが覚えている所まで）"; } },800);
}
window.addEventListener("popstate",e=>{
  const h=e.state&&e.state.hissuru;

  const cur=viewState_(), nv=Object.assign({},h.v,{hist:!!h.v.hist});
  const onlyHist=cur.hist!==nv.hist&&Object.keys(cur).every(k=>k==="hist"||cur[k]===nv[k]);
  Object.assign(S,nv); NAV.trail[h.d]=nv;
  if(onlyHist&&PL&&$("cpanel")&&cmHere_()){ drawNav_(); histApply_({back:true}); navToast_("← 元の場所へ戻りました"); return; }   // 🕘 履歴の開け閉めだけを戻す
  show_({why:"戻る",restore:true,sc:h.sc,from:h.from});
});

/* 押して下りる（表の行・列の見出し・マス・指標のタブ・部門の行）。印は goAttr_ が付ける */

  const q=s=>e.target.closest&&e.target.closest(s);

  if(go==="shohin"||go==="unei"){

    const patch={mode:go==="shohin"?"商品部詳細":"運営部詳細",storeTab:slug};
    if(go==="unei"&&b) patch.dept=b;
    nav_(patch,{from:k,why:go==="shohin"?"店の行":"店（運営部）"});
  }
  else if(go==="metric") nav_({mode:"運営部全体",metric:a},{from:k,why:"指標の見出し"});
  else if(go==="umetric"){ if(a!==S.metric) nav_({metric:a},{from:k,why:"指標のタブ"}); }
  else if(go==="cdept"){ if(a!==S.dept) nav_({dept:a},{from:k,why:"部門の行",land:"comments"}); else { const el=$("cpanel"); if(el) glideTo_(el.getBoundingClientRect().top+window.scrollY-stickyH_()-8,()=>flash_(el)); } }
  else if(go==="sdept"){ if(a!==S.dept) nav_({dept:a},{from:k,why:"部門の行"}); }
});
/* 全部門の明細: カテゴリを出す・たたむ（見方は変えないので、戻るには積まない） */

/* 移動は滑らせて、着いた所を光らせる（0.28〜0.65秒・動きを減らす設定では即座に） */
function stickyH_(){ const hd=document.querySelector("header"), nb=$("navbar"); return (hd?hd.offsetHeight:0)+(nb?nb.offsetHeight:0); }
function glideTo_(y,cb){
  y=Math.max(0,Math.min(Math.round(y),document.documentElement.scrollHeight-window.innerHeight));
  const y0=window.scrollY, dist=Math.abs(y-y0);
  let done=false;
  const off=()=>{ ["wheel","touchstart","keydown"].forEach(ev=>window.removeEventListener(ev,cancel)); };
  const finish=()=>{ if(done) return; done=true; off(); window.scrollTo(0,y); if(cb) cb(); };
  const cancel=()=>{ done=true; off(); };
  if(dist<4||matchMedia("(prefers-reduced-motion: reduce)").matches){ finish(); return; }
  const dur=Math.min(650,Math.max(280,dist*0.45)), t0=performance.now();
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  ["wheel","touchstart","keydown"].forEach(ev=>window.addEventListener(ev,cancel,{passive:true}));
  const step=now=>{ if(done) return; const p=Math.min(1,(now-t0)/dur); window.scrollTo(0,y0+(y-y0)*ease(p)); if(p<1) requestAnimationFrame(step); else finish(); };
  requestAnimationFrame(step); setTimeout(finish,dur+150);   // 画面が裏にあると合図が止まるので、時間切れの保険
}
function flash_(el){ if(!el) return; el.classList.remove("landed"); void el.offsetWidth; el.classList.add("landed"); setTimeout(()=>el.classList.remove("landed"),1700); }
function navToast_(msg){ const t=$("navtoast"); if(!t) return; t.textContent=msg; t.style.opacity=1; clearTimeout(t._h); t._h=setTimeout(()=>{ t.style.opacity=0; },1400); }
/* 表の枠の中で、その行が見える所まで送る（ページは動かさない） */
function revealInTable_(row){
  const w=row&&row.closest(".tbl-wrap"); if(!w) return;
  const th=w.querySelector("thead"), hh=th?th.offsetHeight:0;
  const top=row.getBoundingClientRect().top-w.getBoundingClientRect().top+w.scrollTop-hh-6;
  if(top<w.scrollTop||top>w.scrollTop+w.clientHeight-hh-40) w.scrollTop=Math.max(0,top);
}
function byKey_(k){ if(!k) return null; try{ return document.querySelector(`#app [data-k="${CSS.escape(k)}"]`); }catch(e){ return null; } }
/* 表が出たあとの着地 */
function land_(seq){
  if(seq!==NAV.seq) return;
  const o=NAV.land||{}; NAV.land=null;
  const ms=Math.round(performance.now()-(o.t0||performance.now()));
  // 押してから表が出るまでの時間（速さを数字で見るため・新しい 200 件だけ持つ。__navN は通しの回数）
  const L=(window.__navlog=window.__navlog||[]); L.push({why:o.why||"",mode:S.mode,store:storeShortOf_(S.storeTab),dept:S.dept,metric:S.metric,ms});
  if(L.length>200) L.splice(0,L.length-200);
  window.__navN=(window.__navN||0)+1;
  // 🕘 履歴へ着く・履歴を開いていた所へ戻る: A・PD の欄は表より後に出るので、欄が出てから（renderComments）着く
  if(cmHere_()&&(o.land==="hist"||(o.restore&&S.hist))){
    const w=document.querySelector("#body .tbl-wrap"), sc=o.sc||{};
    if(o.restore&&w){ w.scrollLeft=sc.tx||0; w.scrollTop=sc.ty||0; }
    if(NAV.cmDrawn===seq) histLand_(o); else NAV.histLand=Object.assign({seq:seq},o);
    return;
  }
  if(o.restore){
    const sc=o.sc||{}, w=document.querySelector("#body .tbl-wrap");
    if(w){ w.scrollLeft=sc.tx||0; w.scrollTop=sc.ty||0; }
    const el=byKey_(o.from);
    glideTo_(sc.y||0,()=>flash_(el));
    navToast_("← 元の場所へ戻りました");
    return;
  }
  if(o.why==="入室"){ revealDept_(); return; }   // 入ったときは動かさない（担当の部門の行だけ、表の中で見せる）
  if(o.land==="comments"){
    const el=$("cpanel"); if(el) glideTo_(el.getBoundingClientRect().top+window.scrollY-stickyH_()-8,()=>flash_(el));
    navToast_("→ "+(S.mode==="運営部詳細"?"運営部":"商品部")+"の A・PD（"+deptLabel_(S.dept)+"）");
    return;
  }
  const v=$("view"); if(!v) return;
  const top=v.getBoundingClientRect().top+window.scrollY-stickyH_()-6;
  if(window.scrollY>top) glideTo_(top);
  flash_(document.querySelector("#navbar .crumb.cur"));
  revealDept_();
  if(S.mode==="運営部全体") flash_(document.querySelector(`#uMetricTabs button.on`));
  navToast_("→ "+describe_(viewState_()));
}
/* 来た文脈を見せる: 運営部全体＝いまの部門の行・運営部詳細（店）＝その部門の小計の行。表の枠の中だけ送って光らせる */

  if(!(S.mode==="運営部全体"||(S.mode==="運営部詳細"&&S.storeTab!=="__total__"))) return;
  const row=byKey_("d:"+S.dept); if(row){ revealInTable_(row); flash_(row); }
}

/* 担当の帯のひとこと: どこに書けるか */
function writeHint_(){

/* いま見ている所（パンくず）と「ひとつ前に戻る」 */
function drawNav_(){
  const el=$("navbar"); if(!el) return;
  const h=curNav_(), d=h?h.d:0, prev=d>0?NAV.trail[d-1]:null;
  const tip=prev?("戻る先: "+describe_(prev)):"まだ戻る先はありません（押して見方を変えると、ここで1つずつ戻れます）";
  const sel=S.snaps.find(x=>x.snapshot===S.snap);
  const snapTxt=sel?String(sel.label||"").replace(/\(.*?\)/,"").replace(/\s+/g," ").trim():"";
  const showDept=!["店舗事業部会議","データ管理"].includes(S.mode);
  const ctx=S.mode==="データ管理"?"":`<span class="ctx">${esc(S.area)}${showDept?"・"+esc(deptLabel_(S.dept)):""}${snapTxt?"・"+esc(snapTxt):""}</span>`;
  el.innerHTML=`<button class="btn back" id="navBack" onclick="goBack_()" ${d>0?"":"disabled"} title="${esc(tip)}">← ひとつ前に戻る</button>`+
    `<div class="crumbs" aria-label="いま見ている所">${ctx}${crumbs_()}</div>`;
}
function crumbs_(){
  const st=storeShortOf_(S.storeTab), m=S.mode, hist=S.hist&&cmHere_();
  // 🕘 履歴を開いている間は、末尾に「🕘 履歴」。いまの段の名前を押すと、履歴を閉じる（1つ上へ）
  const c=(mode,label)=>mode!==m?`<button class="crumb" onclick="setMode('${mode}')" title="${esc(LV_TIP[mode]||"")}">${esc(label)}</button>`
    :hist?`<button class="crumb" onclick="histToggle_()" title="週ごとの履歴を閉じる">${esc(label)}</button>`
    :`<span class="crumb cur" aria-current="page">${esc(label)}</span>`;
  const sep=`<span class="sep">›</span>`;
  const tail=hist?sep+`<span class="crumb cur" aria-current="page">🕘 履歴</span>`:"";
  const top=c("商品部全体","🛒 商品部全体");
  if(m==="商品部全体") return top;
  if(m==="商品部詳細") return top+sep+c("商品部詳細",`🛒 商品部詳細：${st}`)+tail;
  if(m==="運営部全体") return top+sep+c("運営部全体",`🏢 運営部全体：${metricLabel_()}`);
  if(m==="運営部詳細") return top+sep+c("運営部全体",`🏢 運営部全体：${metricLabel_()}`)+sep+c("運営部詳細",`🏢 運営部詳細：${st}`)+tail;
  if(m==="店舗事業部会議") return `<span class="crumb cur">🏪 店舗事業部会議：${esc(st)}</span>`;
  if(m==="仕入分析") return `<span class="crumb cur">📦 仕入分析</span>`;
  return `<span class="crumb cur">⚙️ データ管理</span>`;

    const ik=r=>mockPair_(r.section)+"|"+(r.issue_id||r.item_id);

    return Promise.resolve({rows:mine.filter(r=>!from||String(r.year_month)>=from||near[ik(r)]).map(r=>({ym:String(r.year_month),snap8:String(r.snapshot8),
      section:r.section,item_id:r.item_id,issue_id:r.issue_id||"",text:r.text,resolved:!!r.resolved,resolved_at:r.resolved_at||"",
      resolved_week:r.resolved_week||"",author:r.author||"",updated_at:r.updated_at||""}))}); }
  if(fn==="upsertComment"){ const [key,sec,id,text,resolved,iss]=args, now=mockNow(), kk=mockKey_({year_month:key.ym,snapshot8:key.snap8,area:key.area,store:key.store,dept:key.dept});
    if(!SECS4.includes(sec)) return Promise.reject(new Error("この欄には書けません: "+sec));
    const ex=rows.find(r=>r.item_id===id);
    if(ex){
      if(mockKey_(ex)!==kk||ex.section!==sec) return Promise.reject(new Error("このコメントは、この画面の欄のものではありません"));
      if(ex.deleted_at) return Promise.reject(new Error("このコメントは削除されています"));
      if(resolved!=null&&!!resolved!==!!ex.resolved) return Promise.reject(new Error("画面が古い版です。読み込み直してください"));
      ex.text=text; ex.updated_at=now; ex.author="ローカル開発";
    }else{
      if(resolved===true) return Promise.reject(new Error("画面が古い版です。読み込み直してください"));
      const place=[key.area,key.store||"",key.dept].join("|");
      if(iss&&iss!==id&&!rows.some(r=>!r.deleted_at&&mockPlace_(r)===place&&SECS4.includes(r.section)&&mockPair_(r.section)===mockPair_(sec)&&(r.issue_id||r.item_id)===iss))
        return Promise.reject(new Error("この課題は、この画面の欄にありません"));
      rows.push({year_month:key.ym,snapshot8:key.snap8,area:key.area,store:key.store||"",dept:key.dept,section:sec,item_id:id,text:text,resolved:false,resolved_at:"",
        author:"ローカル開発",updated_at:now,source:"mock",deleted_at:"",deleted_by:"",issue_id:iss||"",resolved_week:""});
    }
    mockSave(rows); return Promise.resolve({item_id:id}); }
  if(fn==="resolveComment"){ const [key,sec,id,flag,week]=args;
    const t=rows.find(r=>r.item_id===id);
    if(!t||t.deleted_at||mockKey_(t)!==mockKey_({year_month:key.ym,snapshot8:key.snap8,area:key.area,store:key.store,dept:key.dept})||t.section!==sec) return Promise.reject(new Error("このコメントは、この画面の欄のものではありません"));
    if(flag&&!(/^\d{8}$/.test(String(week))&&String(week)>=String(t.snapshot8))) return Promise.reject(new Error("済の週が不正です"));
    const iss=t.issue_id||t.item_id, place=mockPlace_(t), pr=mockPair_(t.section);
    rows.forEach(r=>{ if(r.deleted_at||mockPlace_(r)!==place||!SECS4.includes(r.section)||mockPair_(r.section)!==pr||(r.issue_id||r.item_id)!==iss) return;
      const on=flag&&r===t; r.resolved=on; r.resolved_at=on?mockNow():""; r.resolved_week=on?String(week):""; });
    mockSave(rows); return Promise.resolve({item_id:id,resolved:flag}); }
  if(fn==="deleteComment"){ const ex=rows.find(r=>r.item_id===args[0]);
    if(ex&&!ex.deleted_at){ ex.deleted_at=mockNow(); ex.deleted_by="ローカル開発"; }
    mockSave(rows); return Promise.resolve({deleted:!!ex}); }
  if(fn==="uploadInbox") return Promise.resolve({ok:true,name:args[1],by:"ローカル開発",at:"(モック)"});
  if(fn==="getCommentsSheetUrl") return Promise.resolve("");  // ローカルは正本Sheetへのリンクなし（実IDは公開しない）
  if(fn==="getMyRights") return Promise.resolve({hq:true,admin:true});
  if(fn==="buildPdcaSheet"){ window.__lastSpec=args[0]; return Promise.resolve({url:"https://docs.google.com/spreadsheets/d/MOCK_"+encodeURIComponent(args[0].fileName)+"/edit",id:"mock"}); }
  return Promise.reject(new Error("mock未対応: "+fn));
}

/* 権限（入室担当 asg × いまの画面）。どこに書けるかは入口で選んだ担当で決める（PO 2026-10-14）。
   サーバーは「本部ドメインか」を確かめる（店舗ドメインは書けない）。 */
function roleCanWriteHere_(){
  const a=S.asg; if(!a||a.role==="viewer"||!S.snap||isAll_(S.dept)) return false;   // 全部門（計）の欄は無い
  if(a.area!==S.area) return false;
  if(S.mode==="商品部詳細") return a.role==="lead"||(a.role==="buyer"&&a.dept===S.dept);
  if(S.mode==="運営部詳細") return a.role==="lead"||(a.role==="unei"&&a.dept===S.dept);
  return false;
}
/* 書ける欄: 月末確定(05-2)＝確定値が出る時点で既に翌月のサイクルが始まっており書いても反映先がない → 全欄 閲覧のみ。
   A に直接書けるのは、前の週までの課題が出ていない週だけ（出ている週は、A＝前の週までの PD・書くのは PD） */
function canEditSec(sec,v){
  if(!roleCanWriteHere_()||!PL||PL.monthEnd) return false;
  const P=pair_();
  if(sec===P.pd) return true;
  return sec===P.a&&!!(v&&v.canWriteA);
}
function canResolve_(){ return roleCanWriteHere_()&&!!PL&&!PL.monthEnd; }
function cKey(){
  const store=S.storeTab!=="__total__"?((S.stores.find(x=>x.slug===S.storeTab)||{}).full||""):"";
  return {ym:S.ym,snap8:s8(S.snap),snap:S.snap,area:S.area,store:store,dept:S.dept};
}

/* ── 週の並び ──
   ・「一つ前の週」はカレンダーではなく **実在するデータ期間（05-4）の並び** で決める
     → 週が抜けていれば飛ばして繋がり、月をまたいでつなぐ。後から週が追加されても、開き直せば常に正しい直前週を指す
   ・05-2（月末確定）は週に数えない（表示は、その月の最終週のまま・閲覧のみ）
   ・Sheets へ転記行を書かない（表示で解決）ので、「張り直し漏れ」という事故が原理的に起きない */
const SNAPS_CACHE={};
function prevYm_(ym){ const d=new Date(+String(ym).slice(0,4),+String(ym).slice(4,6)-2,1); return String(d.getFullYear())+String(d.getMonth()+1).padStart(2,"0"); }
async function snapsRaw_(area,ym){
  const k=area+"|"+ym; if(SNAPS_CACHE[k]) return SNAPS_CACHE[k];
  let src=null;
  if(area===S.area&&ym===S.ym&&S.snaps.length) src=S.snaps;             // 画面が既に持っている分を再利用（GAS往復なし）
  else { try{ src=(await API.snapshots(area,ym)).snapshots||[]; }catch(e){ src=[]; } }
  SNAPS_CACHE[k]=src; return src;
}
/* その月の週次（05-4）を古い順に {snap8, ym, snapshot} */
async function weekly_(area,ym){
  const seen={};
  return (await snapsRaw_(area,ym)).filter(o=>String(o.file_type||"")==="05-4").map(o=>({snap8:s8(o.snapshot),ym:ym,snapshot:o.snapshot}))
    .filter(w=>w.snap8&&!seen[w.snap8]&&(seen[w.snap8]=1)).sort((p,q)=>p.snap8<q.snap8?-1:1);
}
/* その週が月末確定(05-2)か。表示中の月に限らず判定できる */
async function isMonthEnd8_(area,ym,snap8){
  const hit=(await snapsRaw_(area,ym)).find(o=>s8(o.snapshot)===String(snap8));
  return !!hit&&String(hit.file_type||"")==="05-2";
}
/* 指定週より前の週次を「新しい順」に最大 n 件（月をさかのぼって集める。要る前の月は並べて先に読み、覚える）。
   月は、いまの月と前の5か月まで・前の月を3つ見て週が無くなったら打ち切り（GAS の _prevWeeks8_ と同じ） */
async function weeksBefore_(area,ym,snap8,n){
  const months=[ym]; for(let i=1;i<6;i++) months.push(prevYm_(months[i-1]));
  const have=(await weekly_(area,ym)).filter(w=>w.snap8<snap8).length;          // いまの月の分（多くは画面がもう持っている）
  await Promise.all(months.slice(1,1+Math.max(0,Math.min(5,Math.ceil((n-have)/4)))).map(m=>snapsRaw_(area,m)));   // 1か月に4〜5週
  const out=[];
  for(let g=0;g<months.length&&out.length<n;g++){
    const pool=(await weekly_(area,months[g])).filter(w=>w.snap8<snap8);
    for(let j=pool.length-1;j>=0&&out.length<n;j--) out.push(pool[j]);
    if(g>=3&&!pool.length) break;
  }
  return out;
}
function lbl8_(s){ return String(s).slice(4,6)+"/"+String(s).slice(6,8); }
function lblJa_(s){ return (+String(s).slice(4,6))+"月/"+(+String(s).slice(6,8))+"日"; }

/* ==== 週の組み立て（第3便）ここから ==== 画面（index.html）と GAS（Code.gs）に同じ文字のまま置く（試験 test_week_rule.js が、同じ文字か・同じ答えかを確かめる）
   ある場所（エリア・店・部門）の、ある欄の組（商品部＝A・PD／運営部＝UA・UPD）の、週 x の A・PD の表を、課題（issue_id）ごとに組み立てる。
   rows  … その場所の行（正本に並んだ順・消した行は入れない）。{snap8, section, item_id, issue_id, text, resolved, resolved_week, …}
   pair  … {a:"A", pd:"PD"} か {a:"UA", pd:"UPD"}
   prevW … x より前の週（05-4 のデータ期間の日付8桁。月をまたいで。05-2 は入れない）
   x     … 組み立てる週（05-4。月末確定〈05-2〉のときは、呼ぶ側がその月の最終週に置き換え、全欄を閲覧のみにする）
   決まり（PO 2026-10-16「1〜5 すべて A」）:
     出ている     … x より前に書き始め、「出す文」（いちばん新しい、字のある PD。無ければ A）の週が直近4週の中。済でないか、x で済
     今週生まれた … x に初めて字が書かれた課題
     済の報告     … 済にした週が、1つ前の週（w1）から x の前まで（A の表のいちばん下に1回・書けない・戻せる）
     出さない     … 済にした週が w1 より前／出す文が4週より前（履歴だけ。データは消さない）
   戻り値 {x, w1, live, born, report, warn, canWriteA}。並び＝書き始めた週の順、同じ週は正本の順 */
var PDCA_LOOKBACK = 4;
function pdcaWeek_(rows, pair, prevW, x) {
  x = String(x);
  var ws = [], seen = {};
  (prevW || []).forEach(function (w) { w = String(w); if (w < x && !seen[w]) { seen[w] = 1; ws.push(w); } });
  ws.sort();
  var w1 = ws.length ? ws[ws.length - 1] : "";
  var lim = ws.length ? ws[Math.max(0, ws.length - PDCA_LOOKBACK)] : x;
  var has = function (r) { return String(r.text == null ? "" : r.text).trim() !== ""; };
  var wk = function (r) { return String(r.snap8 == null ? "" : r.snap8); };
  var sec = function (r) { return String(r.section == null ? "" : r.section); };
  var nextOf = function (w) { for (var i = 0; i < ws.length; i++) if (ws[i] > w) return ws[i]; return x > w ? x : w + "+"; };   // x より後なら x より大きい値
  var resWeek = function (r) {        // 済にした週。移す前の行（済の週が空）は前の画面の決まりで読む: A の行＝その週・PD の行＝次の週
    if (!(r.resolved === true || String(r.resolved).toLowerCase() === "true")) return "";
    var w = String(r.resolved_week == null ? "" : r.resolved_week);
    if (/^\d{8}$/.test(w)) return w;
    return sec(r) === pair.a ? wk(r) : nextOf(wk(r));
  };
  var pick = function (rs, s, from, to) {   // 欄 s の字のある行のうち、from ≦ 週 < to でいちばん新しい週の行（同じ週に2つあれば、つなぐ）
    var best = "", list = [];
    rs.forEach(function (r) {
      var w = wk(r);
      if (sec(r) !== s || !has(r) || w < from || w >= to) return;
      if (w > best) { best = w; list = [r]; } else if (w === best) list.push(r);
    });
    return list.length ? { w: best, text: list.map(function (r) { return String(r.text); }).join("\n"), row: list[0] } : null;
  };
  var groups = {}, order = [];
  (rows || []).forEach(function (r, i) {
    var s = sec(r);
    if ((s !== pair.a && s !== pair.pd) || !wk(r) || wk(r) > x || r.deleted_at) return;
    var k = String(r.issue_id || "") || String(r.item_id || "");
    if (!k) return;
    if (!groups[k]) { groups[k] = { n: i, rows: [] }; order.push(k); }
    groups[k].rows.push(r);
  });
  var out = { x: x, w1: w1, live: [], born: [], report: [], warn: null, canWriteA: true };
  order.forEach(function (k) {
    var rs = groups[k].rows, birth = "", R = "", holder = null;
    rs.forEach(function (r) { if (has(r) && (!birth || wk(r) < birth)) birth = wk(r); });
    if (!birth) return;                                            // 字のある行が無い課題は出さない
    rs.forEach(function (r) { var w = resWeek(r); if (w && w <= x && (!R || w < R)) { R = w; holder = r; } });
    var first = pick(rs, pair.a, birth, birth + "~") || pick(rs, pair.pd, birth, birth + "~");
    var at = function (s) { return rs.filter(function (r) { return wk(r) === x && sec(r) === s; }); };
    var it = { key: k, n: groups[k].n, birth: birth, head: first ? first.text : "", rw: R, here: R === x, holder: holder,
               a: null, aRows: [], pdRows: at(pair.pd), pdRes: null, noPd: false, target: null };
    if (R && R < x) {
      if (R < w1) return;                                          // 済の報告の週を過ぎた → 出さない（履歴だけ）
      it.a = pick(rs, pair.pd, "", R) || pick(rs, pair.a, "", R + "~");
      it.pdRes = pick(rs, pair.pd, R, x);
      out.report.push(it);
      return;
    }
    if (birth === x) {
      it.aRows = at(pair.a);
      it.target = (pick(rs, pair.a, x, x + "~") || pick(rs, pair.pd, x, x + "~") || {}).row || null;
      out.born.push(it);
      return;
    }
    it.a = pick(rs, pair.pd, "", x) || pick(rs, pair.a, "", x);
    if (!it.a || it.a.w < lim) return;                             // 4週 PD が無い → 出さない（履歴だけ）
    it.noPd = it.a.w < w1;
    it.target = it.a.row;
    out.live.push(it);
  });
  var byBirth = function (p, q) { return p.birth < q.birth ? -1 : (p.birth > q.birth ? 1 : p.n - q.n); };
  out.live.sort(byBirth); out.born.sort(byBirth); out.report.sort(byBirth);
  out.canWriteA = out.live.length === 0;
  var wrote = out.live.concat(out.born).some(function (it) { return it.pdRows.some(has); });
  if (out.live.length && !wrote) {
    var from = "";
    out.live.forEach(function (it) { if (it.a.w > from) from = it.a.w; });
    out.warn = { from: from, stale: from < w1 };
  }
  return out;
}
/* ==== 週の組み立て（第3便）ここまで ==== */

/* 場所（エリア・店・部門）の行を1回で読む（getCommentPlace）。need＝x より前に要る週の数（A・PD の欄＝5・履歴＝列の数＋4）。
   月末確定は、その月の最終週（x）で組み立て、閲覧のみ（me＝その週の MM/DD） */
async function loadPlace_(k,need){
  let x=k.snap8, xym=k.ym, xsnap=k.snap, me="", monthEnd=false;
  if(await isMonthEnd8_(k.area,k.ym,k.snap8)){
    monthEnd=true;
    const p=await weeksBefore_(k.area,k.ym,k.snap8,1);
    if(p.length){ x=p[0].snap8; xym=p[0].ym; xsnap=p[0].snapshot; me=lbl8_(x); }
  }
  const weeks=await weeksBefore_(k.area,xym,x,need);
  const from=weeks.length?weeks[weeks.length-1].ym:xym;
  const r=await capi("getCommentPlace",k.area,k.store,k.dept,from);
  return {area:k.area,store:k.store,dept:k.dept,rows:(r&&r.rows)||[],need,weeks,from,xw:{snap8:x,ym:xym,snapshot:xsnap},x,me,monthEnd,o:null};
}
async function renderComments(seq){
  const el=$("cpanel"); if(!el||!cmHere_()) return;   // 全部門（計）の画面では読まない（失敗のあとの読み直しが、全部門の一言を上書きしないように）
  if(!S.snap){ el.innerHTML=""; return; }
  const t0=performance.now(), g0=window.__gasN||0, k=cKey();
  if(!PL||PL.area!==k.area||PL.store!==k.store||PL.dept!==k.dept) HIST.span=8;
  let r;
  try{ r=await loadPlace_(k,S.hist?HIST.span+PDCA_LOOKBACK:PDCA_LOOKBACK+1); }
  catch(e){
    if(seq!=null&&seq!==NAV.seq) return;
    PL=null; const m=String(e&&e.message||e);
    el.innerHTML=m.includes("COMMENTS_SHEET_ID")
      ? `<div class="note">コメント機能は初期化前です（管理者が GAS エディタで <b>setupCommentSheet</b> を実行すると有効になります）。</div>`
      : `<div class="err">コメントを取得できません：${esc(m)}</div>`;
    return;
  }
  if(seq!=null&&seq!==NAV.seq) return;   // 待っている間に別の所が押された（前の画面のコメントで上書きしない）
  PL=r; drawComments();
  // A・PD の欄が出るまでの時間と、サーバーへの往復の数（新しい 200 件だけ持つ）
  const L=(window.__cmlog=window.__cmlog||[]); L.push({ms:Math.round(performance.now()-t0),gas:(window.__gasN||0)-g0,rows:r.rows.length,hist:!!S.hist});
  if(L.length>200) L.splice(0,L.length-200);
  NAV.cmDrawn=seq;
  if(NAV.histLand&&NAV.histLand.seq===seq){ const o=NAV.histLand; NAV.histLand=null; histLand_(o); }
}
function cmView_(){ return pdcaWeek_(PL.rows,pair_(),PL.weeks.map(w=>w.snap8),PL.x); }
/* 行＝課題（①②…）× 列＝A/PD。セル直接入力→自動保存（スプシ同然）。
   タイピング中はDOMを再構築しない（フォーカス・日本語の変換を保つ）。済・消すのあとは表を組み直す。 */
function drawComments(){
  const el=$("cpanel"); if(!el||!PL||!cmHere_()) return;
  const secs=SECS(), P=pair_(), v=cmView_();
  const who=S.mode==="運営部詳細"?"運営部":"商品部";
  const so=S.storeTab!=="__total__"?S.stores.find(x=>x.slug===S.storeTab):null;
  const scope=`${S.area} / ${S.dept}${so?" / "+so.short:" / エリア合計"}`;
  const sel=S.snaps.find(x=>x.snapshot===S.snap);
  const o={edA:canEditSec(P.a,v),edPD:canEditSec(P.pd,v),res:canResolve_(),labels:secs,badges:true,tb:true};
  PL.o=o;
  const anyEdit=o.edA||o.edPD;
  const whoTag=anyEdit?`<span class="cmwho can">✎ あなたが書ける欄</span>`:`<span class="cmwho cant">閲覧のみ</span>`;
  let h=`<div class="cmcard"><div class="cmhead"><b>PDCA アクション（${who}）</b>${whoTag}<span class="lb">${esc(scope)}・${esc(sel?sel.label:"")}${IS_GAS?"":"（ローカル＝保存はこの端末のみ）"}</span><span class="lb" id="cmsave"></span>`+
    `<a href="#" data-jump="body" class="lb" style="margin-left:auto">↑ 表へ</a>`+
    `<button type="button" class="hbtn" id="histBtn" aria-expanded="${S.hist?"true":"false"}" aria-controls="cmhist" onclick="histToggle_()" title="課題 × 週の表（直近8週）。もう一度押すと閉じます（← ひとつ前に戻る でも戻れます）">🕘 週ごとの履歴</button>`+
    (S.sheetUrl?`<a href="${esc(safeUrl_(S.sheetUrl))}" target="_blank" rel="noopener" class="btn" style="margin-left:8px;text-decoration:none;padding:3px 10px;font-size:12px">📄 スプレッドシートで開く</a>`:"")+`</div>`;
  h+=cmTableHtml_(v,P,o);
  if(anyEdit) h+=`<div class="lb" style="margin-top:6px">セルに直接入力すると自動保存されます。「✓ 済」は課題ごとの完了の記録です（次の週に1回「済の報告」として下に出て、その次の週から出なくなります）。🗑 で消すのは、この週に書いた欄だけです。</div>`;
  else if(S.asg&&S.asg.role!=="viewer"&&!PL.monthEnd) h+=`<div class="lb" style="margin-top:6px">${esc(cmWhyReadonly_())}</div>`;
  h+=cmTailHtml_(v,PL,true);
  if(S.hist) h+=histHtml_();
  el.innerHTML=h+`</div>`;
  el.querySelectorAll("textarea.cmcell").forEach(t=>{ t._pl=PL; });
  if(S.hist) histFit_();
}
/* 表（本部・店舗の方の画面・印刷で同じもの）。o={edA, edPD, res, labels, badges, tb} */
function cmTableHtml_(v,P,o){
  const ro=` <span class="badge" style="background:#e2e8f0;color:#475569">閲覧のみ</span>`, L=o.labels;
  let h=`<table class="cmt"><thead><tr><th style="width:26px">#</th>`+
    `<th style="width:46%">${L[0].icon} ${esc(L[0].label)}${o.badges&&!o.edA?ro:""}</th>`+
    `<th style="width:46%">${L[1].icon} ${esc(L[1].label)}${o.badges&&!o.edPD?ro:""}</th>`+

function cmSrc_(a,P){ return `${esc(lbl8_(a.w))} の ${a.row&&a.row.section===P.a?"A":"PD"}`; }
function cmMeta_(r){ return `${esc(r.author||"")}${r.updated_at?"・"+esc(String(r.updated_at).slice(5,16)):""}`; }
function cmDelBtn_(id){ return `<button type="button" class="btn cmdel" data-cdel="${esc(id)}" title="この欄を消す（この週に書いた欄だけ。前の週の PD は消えません）">🗑</button>`; }
/* 書ける欄（いまある行・新しい欄）。iss＝新しい欄を書いたときにつなぐ課題 */
function cmTa_(sec,r,iss){

function cmIndicator(st,msg){ const e=$("cmsave"); if(!e) return; e.textContent=msg||""; e.style.color=st==="err"?"#b91c1c":st==="saving"?"#b45309":"#166534"; }
function newId(){ return "it_"+Date.now().toString(36)+"_"+(++cmSeq)+Math.random().toString(36).slice(2,6); }

function cInput(el){
  el.style.height="auto"; el.style.height=el.scrollHeight+"px";
  clearTimeout(el._t); el._t=setTimeout(()=>cFlush(el),700); // 手が止まって0.7秒で自動保存
}
function cBlur(el){ clearTimeout(el._t); cFlush(el); }
/* 入力欄の中身を、その欄を出した時点の場所・週（el._pl）の行へ。画面を切り替えたあとに遅れて来ても、別の週へは書かない */
function cFlush(el){
  const pl=el._pl||PL; if(!pl) return;
  const sec=el.dataset.sec;
  if(!el.dataset.id){
    if(!el.value.trim()) return;
    const id=newId(), iss=el.dataset.iss||id; el.dataset.id=id;
    pl.rows.push({ym:pl.xw.ym,snap8:pl.x,section:sec,item_id:id,issue_id:iss,text:el.value,resolved:false,resolved_at:"",resolved_week:"",author:$("user").textContent||"",updated_at:""});
    cmAfterNew_(el,iss,id,pl);
    enqueueSave(id,pl);
    return;
  }
  const it=pl.rows.find(x=>x.item_id===el.dataset.id); if(!it||it.text===el.value) return;
  it.text=el.value; enqueueSave(it.item_id,pl);
}
/* 新しい欄を書いたあと（打っている欄は作り直さない）: 消す釦を足す。「＋」の行なら、今週生まれた課題にして、下に次の「＋」の行 */
function cmAfterNew_(el,iss,id,pl){
  if(!el.isConnected) return;
  el.insertAdjacentHTML("afterend",`<div class="cmmeta">${esc($("user").textContent||"")}${cmDelBtn_(id)}</div>`);
  const tr=el.closest("tr"); if(!tr||tr.dataset.new!=="1") return;
  tr.dataset.new=""; tr.dataset.iss=iss;
  tr.querySelectorAll("textarea.cmcell").forEach(t=>{ if(!t.dataset.id) t.dataset.iss=iss; });
  const n=[...tr.parentNode.querySelectorAll("tr[data-iss]")].filter(r=>!r.classList.contains("cmrep")).length;
  const mk=tr.querySelector(".cmmark"); if(mk) mk.textContent=MARKS[n-1]||String(n);
  const rs=tr.querySelector(".cmrs"); if(rs&&pl.o&&pl.o.res) rs.innerHTML=`<button type="button" class="btn cmres" data-cres="${esc(iss)}" data-on="1">✓ 済</button>`;
  tr.insertAdjacentHTML("afterend",cmNewRow_(pair_(),pl.o||{edA:false}));
  const nx=tr.nextElementSibling; if(nx) nx.querySelectorAll("textarea.cmcell").forEach(t=>{ t._pl=pl; });
}
function enqueueSave(id,pl){
  pl=pl||PL; const it=pl&&pl.rows.find(x=>x.item_id===id); if(!it) return;
  const key={ym:it.ym,snap8:it.snap8,area:pl.area,store:pl.store,dept:pl.dept};   // 保存時点の場所・週を固定（後で画面を切り替えても正しい週へ書く）
  cmIndicator("saving","保存中…");
  saveQ=saveQ.then(async()=>{

  });
}
/* 消すのは、その欄（その週に書いた行）だけ。前の週の PD は消さない（PO 2026-10-16 Q5）。
   消した行はシートに印付きで残る（サーバーが消さずに印を付ける・記録も残る）。 */
function cDel(id){
  const pl=PL; if(!pl) return;

  const lab=r.section===pair_().a?"A":"PD";

/* 済・戻す（課題ごと）。済＝その週の A に出している行に「この週に済」。戻す＝その課題の済を外す（済の週と済の報告の週だけ出る） */
function cResolve(iss,flag){
  const pl=PL; if(!pl||!canResolve_()) return;
  const v=cmView_(), it=v.live.concat(v.born,v.report).find(o=>o.key===iss); if(!it) return;
  const row=flag?it.target:(it.holder||it.target); if(!row) return;
  const P=pair_(), x=pl.x;
  pl.rows.forEach(r=>{ if((r.section===P.a||r.section===P.pd)&&(r.issue_id||r.item_id)===iss){ r.resolved=false; r.resolved_at=""; r.resolved_week=""; } });
  if(flag){ row.resolved=true; row.resolved_week=x; }
  drawComments();
  const key={ym:row.ym,snap8:row.snap8,area:pl.area,store:pl.store,dept:pl.dept};
  cmIndicator("saving","保存中…");
  saveQ=saveQ.then(async()=>{
    try{ await capi("resolveComment",key,row.section,row.item_id,flag,x); cmIndicator("ok",(flag?"✓ 済にしました ":"戻しました ")+new Date().toTimeString().slice(0,5)); }
    catch(e){ cmIndicator("err","⚠ 保存失敗："+String(e&&e.message||e).slice(0,60)); if(PL===pl) renderComments(); }
  });
}

/* ── 🕘 週ごとの履歴（課題 × 週。直近8週・右がいまの週）──
   列ごとに同じ決まり（pdcaWeek_）で組み立て直し、その週の課題の様子を印にする（✎ 書いた／○ A に出ていた／✅ 済にした週／☑ 済の報告）。
   開く・閉じる・週を押して移るは「← ひとつ前に戻る」に積む（ブラウザの戻るも同じ）。読み足しが要るときだけ GAS へ行く。 */
function histCols_(){
  const all=[PL.xw].concat(PL.weeks);            // 新しい順
  return all.slice(0,HIST.span).map((w,i)=>({w:w,prev:all.slice(i+1).map(o=>o.snap8)})).reverse();
}
function histData_(){
  const P=pair_(), cols=histCols_(), byKey={}, order=[];
  cols.forEach((c,j)=>{
    const v=c.v=pdcaWeek_(PL.rows,P,c.prev,c.w.snap8);
    const put=(it,g,pos)=>{ if(!byKey[it.key]){ byKey[it.key]={key:it.key,birth:it.birth,head:it.head,cells:{}}; order.push(it.key); } byKey[it.key].cells[j]={g:g,it:it,pos:pos}; };
    v.live.forEach((it,p)=>put(it,"live",p)); v.born.forEach((it,p)=>put(it,"born",v.live.length+p)); v.report.forEach((it,p)=>put(it,"report",p));
  });
  // 並び: いまの週（右端）で出ている課題 → 済の報告 → ほか（新しく動いた順）
  const last=cols.length-1;
  const rank=k=>{ const c=byKey[k].cells[last]; return c?(c.g==="report"?1:0):2; };
  const seen=k=>Math.max.apply(null,Object.keys(byKey[k].cells).map(Number));
  order.sort((p,q)=>rank(p)-rank(q)||(rank(p)<2?byKey[p].cells[last].pos-byKey[q].cells[last].pos:(seen(q)-seen(p)||(byKey[q].birth>byKey[p].birth?1:-1))));
  return {cols:cols,rows:order.map(k=>byKey[k])};
}
function histMark_(cell){
  if(!cell) return "";
  if(cell.g==="report") return "☑";
  if(cell.it.here) return "✅";
  if(cell.g==="born") return "✎";
  return cell.it.pdRows.some(r=>String(r.text||"").trim())?"✎":"○";
}
function histHtml_(){
  const d=HIST.d=histData_(), cols=d.cols, last=cols.length-1;
  const me=j=>j>0&&cols[j].w.ym!==cols[j-1].w.ym;
  let h=`<div id="cmhist" class="hpanel"><div class="hhead"><b>🕘 週ごとの履歴</b><span class="lb">直近${cols.length}週（右がいまの週）。マスを押すと、その週の文が下に出ます。週を押すと、その週へ移ります</span>`+
    `<span class="hsp"></span><button type="button" class="btn" onclick="histMore_()" title="さらに前の8週を左に足します">◀ もっと前の8週</button><button type="button" class="btn" onclick="histToggle_()">閉じる</button></div>`+
    `<div class="legend"><span>✎ 書いた</span><span>○ A に出ていた（書かなかった）</span><span>✅ 済にした週</span><span>☑ 済の報告</span><span>太い線＝月の切れ目（月末確定）</span></div>`;
  if(!d.rows.length) return h+`<div class="note">この ${cols.length} 週に、課題はありません。</div></div>`;
  h+=`<div class="hwrap"><table class="hist"><thead><tr><th class="il">課題（書き始めた週）</th>`+
    cols.map((c,j)=>`<th class="${j===last?"cur":""}${me(j)?" me":""}"><button type="button" data-hweek="${j}" data-k="hw:${esc(c.w.snap8)}" title="押すと、データ期間を ${esc(lbl8_(c.w.snap8))} の週へ${me(j)?`（${+cols[j-1].w.ym.slice(4)}月の月末確定のあと）`:""}${j===last?"（いま見ている週）":""}">${esc(lbl8_(c.w.snap8))}</button></th>`).join("")+`</tr></thead><tbody>`;
  d.rows.forEach(r=>{
    const off=!(r.cells[last]&&r.cells[last].g!=="report"), head=String(r.head||"").replace(/\s+/g," ");
    const lab=`${lbl8_(r.birth)}〜 ${head.length>18?head.slice(0,18)+"…":head}`;
    h+=`<tr class="${off?"done":""}"><td class="il" title="${esc(head)}">${esc(lab)}</td>`+cols.map((c,j)=>{
      const m=histMark_(r.cells[j]);
      return `<td class="${me(j)?"me":""}">${m?`<button type="button" class="hc" data-hk="${esc(r.key)}" data-hj="${j}" aria-label="${esc(lab)}・${esc(lbl8_(c.w.snap8))}">${m}</button>`:""}</td>`;
    }).join("")+`</tr>`;
  });
  return h+`</tbody></table></div><div class="hdet empty" id="hdet" aria-live="polite">マスを押すと、その週の A・PD がここに出ます。</div></div>`;
}
/* マス → その週のその課題の A・PD の文を、表のすぐ下に */
function histShow_(key,j,btn){
  const d=HIST.d; if(!d) return;
  const r=d.rows.find(x=>x.key===key), c=d.cols[j]; if(!r||!c) return;

  else{

function histFit_(){ const w=document.querySelector("#cmhist .hwrap"); if(w&&w.scrollWidth>w.clientWidth+2) w.scrollLeft=w.scrollWidth; }   // あふれるときは、いまの週（右端）を見せる
